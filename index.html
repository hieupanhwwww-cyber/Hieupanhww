<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Nội Thất</title>
<meta name="description" content="Lập báo giá, chốt đơn và theo dõi thanh toán cho nội thất trọn gói">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sổ Nội Thất">
<meta name="theme-color" content="#F4EFE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17130F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}html{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}
:root{
  /* Bố cục: thanh điều hướng + danh sách đơn (trái) + chi tiết (phải) khi iPad ngang; tab dưới đáy khi dọc */
  --bg:#F4EFE8; --surface:#FFFFFF; --surface-2:#FAF6F0; --line:#E6DDD1; --line-2:#D5C8B8;
  --fg:#2A2119; --muted:#75685B; --accent:#7A4E2D; --accent-2:#5F3B1F; --accent-ink:#FFFFFF; --accent-soft:#F1E4D6;
  --ok:#2C7A4C; --ok-soft:#E2F1E7; --warn:#9C620C; --warn-soft:#FBEED6; --bad:#B03A29; --bad-soft:#F8E2DD; --info:#2E6590; --info-soft:#E0EBF5;
  --shadow:0 1px 2px rgba(70,45,20,.06),0 6px 20px rgba(70,45,20,.07); --paper:#FFFFFF; --ink-hint:#9A8C7D;
  --font:"Be Vietnam Pro",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --r:16px; --r-sm:11px;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17130F; --surface:#221C17; --surface-2:#2A231D; --line:#3A3028; --line-2:#4A3E33;
  --fg:#F2EBE2; --muted:#B4A696; --accent:#CF9A6E; --accent-2:#E2B48C; --accent-ink:#1B140E; --accent-soft:#3A2B1F;
  --ok:#6FC08F; --ok-soft:#1E3326; --warn:#E3B062; --warn-soft:#3A2D17; --bad:#EE8B78; --bad-soft:#3D221C; --info:#84B6DD; --info-soft:#1C2C3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --paper:#F7F3EE; --ink-hint:#8A7D70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130F; --surface:#221C17; --surface-2:#2A231D; --line:#3A3028; --line-2:#4A3E33;
  --fg:#F2EBE2; --muted:#B4A696; --accent:#CF9A6E; --accent-2:#E2B48C; --accent-ink:#1B140E; --accent-soft:#3A2B1F;
  --ok:#6FC08F; --ok-soft:#1E3326; --warn:#E3B062; --warn-soft:#3A2D17; --bad:#EE8B78; --bad-soft:#3D221C; --info:#84B6DD; --info-soft:#1C2C3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --paper:#F7F3EE; --ink-hint:#8A7D70; color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.num,.money-v,.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- khung app ---------- */
.app{height:100%;display:flex}
.main{flex:1;min-width:0;height:100%;position:relative}
.rail{flex:none;display:flex;background:var(--surface);border-color:var(--line);z-index:20}
.rail .brand{font-weight:700;color:var(--accent);font-size:13px;line-height:1.15;text-align:center;letter-spacing:.02em}
.rail .navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;border-radius:14px;min-height:60px}
.rail .navbtn[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.rail .navbtn .ic{width:24px;height:24px}
.wide .rail{flex-direction:column;align-items:stretch;gap:6px;width:92px;padding:14px 8px;border-right:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px))}
.wide .rail .brand{padding:6px 0 14px}
.wide .rail .rail-foot{margin-top:auto;font-size:11.5px;text-align:center;color:var(--muted)}
.narrow .rail{position:fixed;left:0;right:0;bottom:0;flex-direction:row;justify-content:space-around;border-top:1px solid var(--line);padding:6px var(--gut-r) calc(6px + env(safe-area-inset-bottom,0px)) var(--gut)}
.narrow .rail .brand,.narrow .rail .rail-foot{display:none}
.narrow .rail .navbtn{flex:1;max-width:160px;min-height:56px}
.narrow .main{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.narrow.norail .main{padding-bottom:0}
.oc-money>div{min-width:0}

.split{display:grid;grid-template-columns:minmax(340px,400px) 1fr;height:100%}
.pane{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;min-width:0}
.list-pane{border-right:1px solid var(--line);background:var(--surface-2)}
.pane-in{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:18px 32px}
.full .pane-in{max-width:1180px;margin:0 auto}
.wide .pane-in{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* ---------- nút & ô nhập ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:16px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:active{background:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line-2))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px;border-radius:10px}
.btn.big{min-height:54px;font-size:17px;padding:0 22px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--fg);flex:none}
.iconbtn:active{background:var(--accent-soft)}
.iconbtn.sm{width:40px;height:40px}
.iconbtn.line{border-color:var(--line-2);background:var(--surface)}
.in{display:block;width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);font-size:16px;line-height:1.3}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.in{min-height:84px;resize:vertical}
select.in{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13.5px;font-weight:600;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px}
.withbtn{display:flex;gap:8px}
.withbtn .in{flex:1;min-width:0}
.datefield{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);font-variant-numeric:tabular-nums}
.datefield input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.datefield .ic{color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.seg button{min-height:42px;padding:0 14px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--muted);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* ---------- thẻ, nhãn ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card+.card,.stack>*+*{margin-top:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3,.card>h3{font-size:17px}
.card>h3{margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-quote{color:var(--warn);background:var(--warn-soft)}
.s-closed{color:var(--accent);background:var(--accent-soft)}
.s-building{color:var(--info);background:var(--info-soft)}
.s-done{color:var(--ok);background:var(--ok-soft)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--fg);font-size:15px}
.notice.warn{background:var(--warn-soft)}
.notice.bad{background:var(--bad-soft)}
.notice.ok{background:var(--ok-soft)}
.notice .ic{margin-top:1px;color:var(--accent)}
.notice b{font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);font-size:18px;margin-bottom:6px}

/* ---------- danh sách đơn ---------- */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.list-head h1{font-size:26px}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.mini{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:var(--surface);min-width:0}
.mini span{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.25}
.mini b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.search{position:relative;margin-bottom:10px}
.search .ic{position:absolute;left:12px;top:13px;color:var(--muted)}
.search .in{padding-left:42px}
.chips{display:flex;max-width:100%;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip small{font-weight:500;opacity:.75;margin-left:3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.list-pane .cards{grid-template-columns:minmax(0,1fr)}
.ocard{display:block;width:100%;min-width:0;text-align:left;padding:15px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.ocard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.oc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;min-width:0}
.oc-code{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.oc-name{font-size:18px;font-weight:700;line-height:1.3}
.oc-proj{color:var(--muted);font-size:15px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc-money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line-2)}
.oc-money span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.oc-money b{font-size:15.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.oc-money .due{color:var(--bad)}
.oc-money .zero{color:var(--ok)}
.oc-over{margin-top:8px;font-size:13.5px;font-weight:600;color:var(--info)}
.banner{margin-bottom:12px}

/* ---------- chi tiết đơn ---------- */
.d-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.d-title{flex:1;min-width:220px}
.d-title h2{font-size:26px;margin:6px 0 2px}
.d-sub{color:var(--muted);font-size:15px}
.bignums{container-type:inline-size;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.bignum{padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-width:0}
.bignum span{display:block;font-size:14px;font-weight:600;color:var(--muted)}
.bignum b{display:block;font-size:clamp(17px,4.1cqi,30px);font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bignum.due b{color:var(--bad)}
.bignum.paid b{color:var(--ok)}
.bignum small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.d-actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.d-actions .btn{min-height:68px;flex-direction:column;gap:4px;padding:8px 6px;white-space:normal;line-height:1.2;text-align:center;font-size:15px}
.rowlist{display:flex;flex-direction:column}
.ritem{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ritem:first-child{border-top:0;padding-top:2px}
.ritem .rmain{flex:1;min-width:0}
.ritem .rmain b{font-weight:600}
.ritem .rsub{font-size:14px;color:var(--muted)}
.ritem .ramt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ramt.plus{color:var(--ok)}
.ramt.minus{color:var(--bad)}
.ritem.cancel .rmain,.ritem.cancel .ramt{text-decoration:line-through;opacity:.55}
.sumline{display:flex;justify-content:space-between;gap:12px;padding-top:10px;margin-top:6px;border-top:1px solid var(--line);font-weight:600}
.lockq{width:100%;border-collapse:collapse;font-size:15px}
.lockq th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line-2);font-weight:600}
.lockq td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.lockq .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lockq .sub{display:block;color:var(--muted);font-size:13.5px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.verlist{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .fileph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;padding:8px;font-size:13px;color:var(--muted);text-align:center;word-break:break-word}
.note-add{display:flex;gap:8px;margin-top:10px}
.note-add .in{flex:1;min-width:0}
.hist{font-size:14px;color:var(--muted)}
.hist li{padding:5px 0;border-top:1px dashed var(--line)}
.hist li:first-child{border-top:0}
.hist{list-style:none;margin:0;padding:0}

/* ---------- soạn báo giá ---------- */
.editor{height:100%;display:flex;flex-direction:column}
.ed-top{flex:none;display:flex;align-items:center;gap:10px;padding:10px var(--gut-r) 10px var(--gut);background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-title{flex:1;min-width:180px;display:flex;flex-direction:column}
.ed-title b{font-size:18px}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap}
.ed-scroll{flex:1;height:auto}
.savestat{font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.savestat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.savestat.saving::before{background:var(--warn)}
.savestat.error{color:var(--bad);font-weight:600}
.savestat.error::before{background:var(--bad)}
.savestat button{border:0;background:none;color:var(--accent);font-weight:700;text-decoration:underline;padding:0 2px}
.qtable{margin:0 -4px}
.qhead,.qrow{display:grid;grid-template-columns:34px minmax(150px,1.35fr) minmax(140px,1.25fr) 84px 118px 128px 128px 44px;gap:8px;align-items:start;padding:0 4px}
.qhead{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.qhead .r{text-align:right}
.qrow{padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.qrow .c-no{padding-top:13px;font-weight:600;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.qrow .amt{min-height:48px;display:flex;align-items:center;justify-content:flex-end;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.qrow .fl{display:none;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.qtywrap{display:flex;gap:4px;align-items:center}
.qtywrap .in{flex:1;min-width:0;padding-left:8px;padding-right:8px}
.qtywrap .iconbtn{border:1px solid var(--line-2);background:var(--surface-2);width:40px;height:48px}
.dimtxt{font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.c-more{padding-top:2px}
.addbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ed-bottom{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px;align-items:start}
.ed-bottom .card+.card{margin-top:0}
.totals .tline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-variant-numeric:tabular-nums}
.totals .tline+.tline{border-top:1px solid var(--line)}
.totals .tgrand{font-size:20px;font-weight:700}
.totals .tgrand b{color:var(--accent);font-size:26px}
.disc{display:flex;gap:6px;align-items:center}
.disc .in{width:150px;min-height:44px}
.disc .seg button{min-height:36px;padding:0 10px}
.words{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.4}
.ed-bar{display:none}

/* ---------- thống kê ---------- */
.kpis{container-type:inline-size;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.kpi{text-align:left;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:14px;font-weight:600;color:var(--muted)}
.kpi b{font-size:clamp(17px,2.9cqi,28px);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{font-size:13px;color:var(--muted)}

<script>
'use strict';
/* =========================================================
   TIỆN ÍCH
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = (p = '') => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const pad2 = n => String(n).padStart(2, '0');
const dstr = d => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const today = () => dstr(new Date());
const addDays = (s, n) => { const [y, m, d] = s.split('-').map(Number); return dstr(new Date(y, m - 1, d + n)); };
const fmtDate = s => { if (!s) return ''; const [y, m, d] = String(s).slice(0, 10).split('-'); return `${d}/${m}/${y}`; };
const fmtTime = dt => `${pad2(dt.getHours())}:${pad2(dt.getMinutes())}`;
const fmtDateTime = dt => `${fmtTime(dt)} ${fmtDate(dstr(dt))}`;
const NF = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 0 });
const QF = new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 3 });
const money = n => NF.format(Math.round(Number(n) || 0));
const moneyD = n => money(n) + ' đ';
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + money(Math.abs(n));
const fmtQty = n => QF.format(Number(n) || 0);
const parseMoney = s => { const v = parseInt(String(s ?? '').replace(/[^\d]/g, ''), 10); return Number.isFinite(v) ? v : 0; };
const parseQty = s => {
  let t = String(s ?? '').trim().replace(/\s/g, '');
  if (!t) return 0;
  t = t.replace(/,/g, '.');
  const parts = t.split('.');
  if (parts.length > 2) t = parts.slice(0, -1).join('') + '.' + parts[parts.length - 1];
  const v = parseFloat(t);
  return Number.isFinite(v) && v > 0 ? Math.round(v * 1000) / 1000 : 0;
};
const round3 = v => Math.round(v * 1000) / 1000;
const clone = o => JSON.parse(JSON.stringify(o));
const digits = s => String(s || '').replace(/\D/g, '');
const fold = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\u0111/g, 'd').replace(/\u0110/g, 'D').toLowerCase();
const fileSafe = s => fold(s).replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '').slice(0, 40);
const softFocus = el => { const a = document.activeElement; if (el && !(a && a !== el && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))) el.focus(); };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const shortMoney = n => {
  const a = Math.abs(n);
  const f = (v, u) => new Intl.NumberFormat('vi-VN', { maximumFractionDigits: 1 }).format(v) + u;
  if (a >= 1e9) return f(n / 1e9, ' tỷ');
  if (a >= 1e6) return f(n / 1e6, ' tr');
  if (a >= 1e3) return f(n / 1e3, 'k');
  return String(Math.round(n));
};

/* Đọc số tiền bằng chữ tiếng Việt */
const DIG = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
function read3(n, full) {
  const h = Math.floor(n / 100), t = Math.floor((n % 100) / 10), u = n % 10, out = [];
  if (h > 0 || full) out.push(DIG[h] + ' trăm');
  if (t > 1) {
    out.push(DIG[t] + ' mươi');
    if (u === 1) out.push('mốt'); else if (u === 4) out.push('tư'); else if (u === 5) out.push('lăm'); else if (u > 0) out.push(DIG[u]);
  } else if (t === 1) {
    out.push('mười');
    if (u === 5) out.push('lăm'); else if (u > 0) out.push(DIG[u]);
  } else if (u > 0) {
    if (h > 0 || full) out.push('linh');
    out.push(DIG[u]);
  }
  return out.join(' ');
}
function readBelowBillion(n, full) {
  const g = [Math.floor(n / 1e6), Math.floor(n / 1e3) % 1000, n % 1000], names = ['triệu', 'nghìn', ''];
  const parts = []; let started = full;
  for (let i = 0; i < 3; i++) {
    if (g[i] === 0) continue;
    parts.push(read3(g[i], started) + (names[i] ? ' ' + names[i] : ''));
    started = true;
  }
  return parts.join(' ');
}
function readNum(n) {
  if (n === 0) return 'không';
  if (n >= 1e9) { const hi = Math.floor(n / 1e9), lo = n % 1e9; return readNum(hi) + ' tỷ' + (lo ? ' ' + readBelowBillion(lo, true) : ''); }
  return readBelowBillion(n, false);
}
function moneyWords(n) {
  n = Math.round(Math.abs(Number(n) || 0));
  const s = readNum(n) + ' đồng';
  return s.charAt(0).toUpperCase() + s.slice(1) + '.';
}

/* =========================================================
   NGHIỆP VỤ
   ========================================================= */
const UNITS = ['m²', 'md', 'bộ', 'cái', 'gói'];
const UNIT_NAMES = { 'm²': 'm² (mét vuông)', 'md': 'md (mét dài)', 'bộ': 'bộ', 'cái': 'cái', 'gói': 'gói' };
const STATUS = {
  quote: { label: 'Đang báo giá', cls: 's-quote' },
  closed: { label: 'Đã chốt', cls: 's-closed' },
  building: { label: 'Đang thi công', cls: 's-building' },
  done: { label: 'Hoàn thành', cls: 's-done' },
};
const DEFAULT_SETTINGS = {
  id: 'settings',
  shopName: 'Nội Thất Hùng Loan',
  tagline: 'Thiết kế – thi công nội thất trọn gói',
  address: 'Làng nghề Hà Lâm 1 – Thư Lâm – Hà Nội',
  phone: '0916.771.586 – 0961.761.868',
  email: '',
  bankName: '', bankBin: '', bankAccount: '', bankHolder: '', memoPrefix: 'HL',
  logo: '',
  defaultNote: '', defaultTerms: '',
  codePrefix: 'BG',
  warrantyMonths: 36,
  planTemplate: null,
};
const TRIGGERS = { sign: 'Khi chốt đơn', progress: 'Khi bắt đầu thi công', accept: 'Khi nghiệm thu, bàn giao', date: 'Theo ngày hẹn' };
const DEFAULT_PLAN = [
  { label: 'Đặt cọc khi ký hợp đồng', pct: 50, trigger: 'sign' },
  { label: 'Khi bắt đầu lắp đặt', pct: 40, trigger: 'progress' },
  { label: 'Sau nghiệm thu, bàn giao', pct: 0, trigger: 'accept' },
];
const PLAN_STATE = {
  paid: { label: 'Đã thu', cls: 's-done' },
  overdue: { label: 'Quá hạn', cls: 's-bad' },
  due: { label: 'Đến hạn', cls: 's-quote' },
  later: { label: 'Chưa đến hạn', cls: 's-later' },
};
const PAY_METHOD = { transfer: 'Chuyển khoản', cash: 'Tiền mặt' };

const rowAmount = r => Math.round((Number(r.qty) || 0) * (Number(r.price) || 0));
function quoteTotals(q) {
  const sub = (q?.rows || []).reduce((s, r) => s + rowAmount(r), 0);
  const d = q?.discount || {};
  let disc = 0;
  if (d.type === 'percent') disc = Math.round(sub * Math.min(Math.max(Number(d.value) || 0, 0), 100) / 100);
  else disc = Math.min(Math.max(Math.round(Number(d.value) || 0), 0), sub);
  return { sub, disc, total: sub - disc };
}
const isClosed = o => o.status !== 'quote';
const lastVersion = o => (o.versions && o.versions.length ? o.versions[o.versions.length - 1] : null);
const headQuote = o => (isClosed(o) ? lastVersion(o)?.quote : o.draft) || newQuote();
const changeSigned = c => (c.sign < 0 ? -c.amount : c.amount);
const confirmedChanges = o => (o.changes || []).filter(c => c.status === 'confirmed').reduce((s, c) => s + changeSigned(c), 0);
function orderTotal(o) {
  if (!isClosed(o)) return quoteTotals(o.draft).total;
  const v = lastVersion(o);
  return (v ? v.total : 0) + confirmedChanges(o);
}
/* ---------- lịch thanh toán theo đợt ---------- */
const planTemplate = () => { const t = settings().planTemplate; return Array.isArray(t) && t.length ? t : DEFAULT_PLAN; };
const newPlan = (tpl = planTemplate()) => tpl.map(r => ({ id: uid('d'), label: r.label || '', pct: Number(r.pct) || 0, trigger: TRIGGERS[r.trigger] ? r.trigger : 'date' }));
const planPctSum = plan => (plan || []).slice(0, -1).reduce((s, r) => s + (Number(r.pct) || 0), 0);
function planAmounts(plan, total) {
  const rows = plan || []; let used = 0;
  return rows.map((r, i) => {
    const last = i === rows.length - 1;
    let amount;
    if (last) amount = total - used;
    else { amount = Math.round(total * (Number(r.pct) || 0) / 100); used += amount; }
    return { ...r, n: i + 1, last, amount: Math.max(0, amount), raw: amount };
  });
}
/* Tỷ lệ % tính trên giá trị báo giá đã chốt; phát sinh đã xác nhận cộng/trừ vào đợt cuối */
function orderPlanAmounts(o, plan = o.plan) {
  const v = lastVersion(o);
  const rows = planAmounts(plan, v ? v.total : orderTotal(o));
  if (!rows.length) return rows;
  let adj = confirmedChanges(o);
  for (let i = rows.length - 1; i >= 0 && adj !== 0; i--) {
    const nv = rows[i].amount + adj;
    if (nv >= 0 || i === 0) { rows[i].amount = Math.max(0, nv); adj = 0; }
    else { adj = nv; rows[i].amount = 0; }
  }
  return rows;
}
function triggerReached(o, r) {
  if (r.reached) return true;
  if (r.trigger === 'sign') return isClosed(o);
  if (r.trigger === 'progress') return o.status === 'building' || o.status === 'done' || !!o.handover;
  if (r.trigger === 'accept') return o.status === 'done' || !!o.handover;
  return false;
}
function planStatus(o) {
  if (!isClosed(o) || !(o.plan && o.plan.length)) return [];
  const T = today();
  let pool = orderPaid(o);
  return orderPlanAmounts(o).map(r => {
    const paid = Math.min(pool, r.amount); pool -= paid;
    const left = r.amount - paid;
    let state;
    if (left <= 0) state = 'paid';
    else if (r.due && r.due < T) state = 'overdue';
    else if (triggerReached(o, r) || (r.due && r.due <= T)) state = 'due';
    else state = 'later';
    return { ...r, paid, left, state };
  });
}
const nextInstallment = o => planStatus(o).find(r => r.left > 0) || null;
const overdueAmount = o => planStatus(o).filter(r => r.state === 'overdue').reduce((s, r) => s + r.left, 0);
const dueNowAmount = o => planStatus(o).filter(r => r.state === 'overdue' || r.state === 'due').reduce((s, r) => s + r.left, 0);
function mergePlan(oldPlan, newPlanRows) {
  return (newPlanRows || []).map(r => { const old = (oldPlan || []).find(x => x.id === r.id); return { ...r, due: old?.due || r.due || '', reached: old?.reached || false }; });
}
function normalizeOrder(o) {
  for (const k of ['payments', 'changes', 'attachments', 'notes', 'log', 'versions']) if (!Array.isArray(o[k])) o[k] = [];
  let n = o.payments.reduce((m, p) => Math.max(m, p.no || 0), 0);
  [...o.payments].sort((a, b) => String(a.createdAt || a.date).localeCompare(String(b.createdAt || b.date))).forEach(p => { if (!p.no) p.no = ++n; if (!p.method) p.method = 'transfer'; });
  return o;
}
const receiptNo = (o, p) => `PT-${o.code}-${pad2(p.no || 0)}`;
async function sha256Hex(str) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 2166136261; for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(16).padStart(8, '0');

}
async function makeSignRecord(img, name, content) {
  const at = new Date().toISOString();
  const hash = (await sha256Hex(JSON.stringify(content) + '|' + at + '|' + name)).slice(0, 16).toUpperCase();
  return { img, name, at, hash };
}
function addMonths(s, m) { const [y, mo, d] = s.split('-').map(Number); const dt = new Date(y, mo - 1 + m, d); if (dt.getDate() !== d) dt.setDate(0); return dstr(dt); }

const orderPaid = o => (o.payments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
const orderDue = o => (isClosed(o) ? Math.max(0, orderTotal(o) - orderPaid(o)) : 0);
const orderOver = o => (isClosed(o) ? Math.max(0, orderPaid(o) - orderTotal(o)) : 0);
/* Các sự kiện làm thay đổi giá trị đơn đã chốt, tính theo ngày */
function valueEvents(o) {
  if (!isClosed(o)) return [];
  const ev = [];
  (o.versions || []).forEach((v, i, arr) => {
    if (i === 0) ev.push({ date: v.closedAt, amount: v.total, kind: 'close', label: 'Chốt đơn' + (arr.length > 1 ? ' (bản 1)' : '') });
    else ev.push({ date: v.closedAt, amount: v.total - arr[i - 1].total, kind: 'revise', label: `Chốt bản ${v.no} (điều chỉnh báo giá)` });
  });
  (o.changes || []).filter(c => c.status === 'confirmed').forEach(c => ev.push({ date: c.confirmedAt, amount: changeSigned(c), kind: 'change', label: 'Phát sinh: ' + c.title }));
  return ev;
}
function newQuote() {
  const st = settings();
  return { date: today(), customer: { name: '', phone: '', address: '' }, project: '', rows: [], discount: { type: 'amount', value: 0 }, note: st.defaultNote || '', terms: st.defaultTerms || '', plan: newPlan() };
}
const newRow = (p = {}) => ({ id: uid('r'), name: '', material: '', unit: 'm²', qty: 0, price: 0, dims: null, ...p });
function nextCode() {
  const st = settings();
  const pre = (st.codePrefix || 'BG').replace(/[^A-Za-z0-9-]/g, '').slice(0, 6) || 'BG';
  const d = new Date();
  const stem = `${pre}${String(d.getFullYear()).slice(2)}${pad2(d.getMonth() + 1)}-`;
  let max = 0;
  for (const o of Store.list('orders')) if (o.code && o.code.startsWith(stem)) max = Math.max(max, parseInt(o.code.slice(stem.length), 10) || 0);
  return stem + pad2(max + 1);
}
const DIM_UNIT = { mm: 0.001, cm: 0.01, m: 1 };
function dimsQty(unit, d) {
  const k = DIM_UNIT[d.u] || 0.001, n = Number(d.n) || 0;
  if (unit === 'm²') return round3((Number(d.a) || 0) * k * (Number(d.b) || 0) * k * n);

}
function dimText(unit, d) {
  if (!d) return '';
  const a = QF.format(Number(d.a) || 0), b = QF.format(Number(d.b) || 0), n = Number(d.n) || 1;
  let s;
  if (unit === 'm²') s = `${a} × ${b} ${d.u}`;
  else if (unit === 'md') s = `dài ${a} ${d.u}`;
  else s = (Number(d.a) || Number(d.b)) ? `${a} × ${b} ${d.u}` : '';
  if (n !== 1) s += (s ? ' × ' : '') + `${QF.format(n)}`;

/* =========================================================
   LƯU TRỮ: claude.ai db (đồng bộ tài khoản) hoặc IndexedDB (máy này)
   ========================================================= */
const COLS = ['orders', 'customers', 'catalog', 'app'];
const caps = { db: null, assets: null, downloads: null };

function cloudBackend(db) {
  return {
    async loadAll() {
      const out = {};
      for (const c of COLS) {
        const snap = await db.collection(c).get();
        out[c] = snap.docs.filter(d => d.exists).map(d => clone(d.data()));
      }
      return out;
    },
    set: (c, id, doc) => withTimeout(db.collection(c).doc(id).set(doc), 15000),
    del: (c, id) => withTimeout(db.collection(c).doc(id).delete(), 15000),
  };
}
const withTimeout = (p, ms) => Promise.race([p, sleep(ms).then(() => { throw { code: 'unavailable', message: 'timeout' }; })]);
function idbOpen() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('so-noi-that', 2);
    r.onupgradeneeded = () => { for (const n of ['docs', 'blobs', 'outbox']) if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const idbReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
async function localBackend() {
  let idb = null;
  try { idb = await idbOpen(); } catch (e) { idb = null; }
  const mem = new Map(), memBlobs = new Map();
  const tx = (store, mode) => idb.transaction(store, mode).objectStore(store);
  return {
    persistent: !!idb,
    async loadAll() {
      const out = Object.fromEntries(COLS.map(c => [c, []]));
      if (!idb) return out;
      const keys = await idbReq(tx('docs', 'readonly').getAllKeys());
      const vals = await idbReq(tx('docs', 'readonly').getAll());
      keys.forEach((k, i) => { const c = String(k).split('/')[0]; if (out[c]) out[c].push(vals[i]); });
      return out;
    },
    async set(c, id, doc) { if (!idb) { mem.set(c + '/' + id, doc); return; } await idbReq(tx('docs', 'readwrite').put(doc, c + '/' + id)); },
    async del(c, id) { if (!idb) { mem.delete(c + '/' + id); return; } await idbReq(tx('docs', 'readwrite').delete(c + '/' + id)); },
    async putBlob(k, b) { if (!idb) { memBlobs.set(k, b); return; } await idbReq(tx('blobs', 'readwrite').put(b, k)); },
    async getBlob(k) { if (!idb) return memBlobs.get(k); return idbReq(tx('blobs', 'readonly').get(k)); },
    async delBlob(k) { if (!idb) { memBlobs.delete(k); return; } await idbReq(tx('blobs', 'readwrite').delete(k)); },
  };
}

/* Hàng chờ trên máy: giữ thay đổi chưa gửi được lên máy chủ (mất sóng, tải lại trang) */
const Outbox = {
  db: null, ok: false,
  async open() { try { this.db = await idbOpen(); this.ok = true; } catch (e) { this.db = null; } },
  st(mode) { return this.db.transaction('outbox', mode).objectStore('outbox'); },
  async put(key, entry) { if (!this.db) return; try { await idbReq(this.st('readwrite').put(entry, key)); } catch (e) { /* bỏ qua */ } },
  async done(key, ts) { if (!this.db) return; try { const cur = await idbReq(this.st('readonly').get(key)); if (cur && cur.ts === ts) await idbReq(this.st('readwrite').delete(key)); } catch (e) { /* bỏ qua */ } },
  async all() {
    if (!this.db) return [];
    try { const keys = await idbReq(this.st('readonly').getAllKeys()); const vals = await idbReq(this.st('readonly').getAll()); return keys.map((k, i) => ({ key: k, ...vals[i] })); } catch (e) { return []; }
  },
};

const Store = {
  mode: 'loading', backend: null, loadedAt: 0,
  data: Object.fromEntries(COLS.map(c => [c, new Map()])),
  pending: new Map(), timers: new Map(), inflight: new Set(), again: new Set(), failed: new Map(),
  lastSaved: null, lastError: '', lastErrorCode: '', seq: 0,
  list(c) { return [...this.data[c].values()]; },
  get(c, id) { return this.data[c].get(id); },
  async loadAll() {
    const all = await this.backend.loadAll();
    for (const c of COLS) { this.data[c] = new Map((all[c] || []).filter(d => d && d.id).map(d => [d.id, c === 'orders' ? normalizeOrder(d) : d])); }
    this.loadedAt = Date.now();
  },
  async restoreOutbox() {
    const items = (await Outbox.all()).filter(e => e && e.c && e.id && Date.now() - e.ts < 30 * 864e5);
    for (const e of items) {
      if (e.op === 'del') this.data[e.c]?.delete(e.id);
      else if (e.doc) this.data[e.c]?.set(e.id, e.c === 'orders' ? normalizeOrder(e.doc) : e.doc);
      this.queue(e.c, e.id, e.op, 0);
    }
    return items.length;
  },
  put(c, doc, delay = 450) {
    this.data[c].set(doc.id, doc);
    this.queue(c, doc.id, 'set', delay);
  },
  del(c, id) {
    this.data[c].delete(id);
    this.queue(c, id, 'del', 0);
  },
  queue(c, id, op, delay) {
    const key = c + '/' + id;
    this.pending.set(key, { c, id, op, ts: Date.now() * 1000 + (this.seq++ % 1000) });
    this.failed.delete(key);
    clearTimeout(this.timers.get(key));
    this.timers.set(key, setTimeout(() => this.flushKey(key), delay));
    updateSaveStatus();
  },
  async flushKey(key) {
    clearTimeout(this.timers.get(key)); this.timers.delete(key);
    if (this.inflight.has(key)) { this.again.add(key); return; }
    const p = this.pending.get(key);
    if (!p) return;
    this.pending.delete(key);
    this.inflight.add(key);
    updateSaveStatus();
    let tries = 0;
    const doc = p.op === 'del' ? null : this.data[p.c].get(p.id);
    const snapshot = doc ? clone(doc) : null;
    if (this.mode === 'cloud') await Outbox.put(key, { c: p.c, id: p.id, op: p.op, doc: snapshot, ts: p.ts });
    for (;;) {
      try {
        if (p.op === 'del') await this.backend.del(p.c, p.id);
        else if (snapshot) await this.backend.set(p.c, p.id, snapshot);
        this.lastSaved = new Date(); this.lastError = ''; this.lastErrorCode = '';
        if (this.mode === 'cloud') Outbox.done(key, p.ts);
        break;
      } catch (e) {
        const code = e && e.code;
        if ((code === 'unavailable' || code === 'store_unavailable') && tries++ < 1 && navigator.onLine !== false) { await sleep(600 + Math.random() * 600); continue; }
        this.lastErrorCode = code || 'unavailable';
        this.lastError = saveErrorText(e);
        if (!this.pending.has(key)) this.failed.set(key, p);
        break;
      }
    }
    this.inflight.delete(key);
    if (this.again.has(key)) { this.again.delete(key); if (this.pending.has(key)) this.flushKey(key); }
    updateSaveStatus();
  },
  flushAll() {
    for (const [k, p] of this.failed) { if (!this.pending.has(k)) this.pending.set(k, p); }
    this.failed.clear();
    for (const k of [...this.pending.keys()]) this.flushKey(k);
  },
  busy() { return this.pending.size + this.inflight.size; },
  offline() { return this.failed.size > 0 && (navigator.onLine === false || this.lastErrorCode === 'unavailable' || this.lastErrorCode === 'store_unavailable'); },
  async idle(ms = 8000) { const t = Date.now(); this.flushAll(); while (this.busy() && Date.now() - t < ms) await sleep(60); return !this.busy() && !this.failed.size; },
};
function saveErrorText(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Bộ nhớ của app đã đầy. Hãy xóa bớt ảnh hoặc đơn cũ rồi thử lại.';
  if (c === 'invalid_argument') return 'Dữ liệu quá lớn hoặc không hợp lệ nên chưa lưu được. Hãy bớt nội dung rồi thử lại.';
  if (c === 'revoked' || c === 'not_granted') return 'Mất quyền truy cập dữ liệu. Hãy tải lại trang.';
  if (c === 'resource_exhausted') return 'Lưu quá nhanh, hệ thống đang chờ. Bấm Thử lại sau vài giây.';
  return 'Mất mạng. Thay đổi đang được giữ trên máy này và sẽ tự gửi khi có mạng.';
}
const settings = () => ({ ...DEFAULT_SETTINGS, ...(Store.get('app', 'settings') || {}) });
function saveSettings(patch) { Store.put('app', { ...settings(), ...patch, id: 'settings' }, 600); }
const meta = () => Store.get('app', 'meta') || { id: 'meta' };

const blobUrls = new Map();
async function attSrc(att) {
  if (att.store === 'asset') return Store.mode === 'cloud' ? '/_blob/' + att.ref : '';
  if (blobUrls.has(att.ref)) return blobUrls.get(att.ref);
  if (!Store.backend.getBlob) return '';
  const b = await Store.backend.getBlob(att.ref);
  if (!b) return '';
  const u = URL.createObjectURL(b); blobUrls.set(att.ref, u); return u;
}
async function removeAttBlob(att) {
  try {
    if (att.store === 'asset' && caps.assets) await caps.assets.delete(att.ref);
    else if (att.store === 'idb' && Store.backend.delBlob) await Store.backend.delBlob(att.ref);
  } catch (e) { /* tệp có thể đã bị xóa trước đó */ }
}
async function storeFile(file, extra = {}) {
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '');
  const isImg = /^image\//.test(file.type);
  if (!isPdf && !isImg) throw { code: 'bad_type' };
  const blob = isImg ? await downscaleImage(file) : file;
  if (!blob) throw { code: 'bad_image' };
  const type = isPdf ? 'application/pdf' : (blob.type || 'image/jpeg');
  const base = { id: uid('a'), name: file.name || 'anh.jpg', kind: isPdf ? 'pdf' : 'image', at: new Date().toISOString(), ...extra };
  if (Store.mode === 'cloud') {
    if (!caps.assets) throw { code: 'not_granted' };
    const r = await caps.assets.upload(blob, { type });
    return { ...base, store: 'asset', ref: r.id };
  }
  const key = uid('b'); await Store.backend.putBlob(key, blob);
  return { ...base, store: 'idb', ref: key };
}
function storeFileError(e, name) {
  const c = e && e.code;
  if (c === 'bad_type') return `“${name}” không phải ảnh hoặc PDF.`;
  if (c === 'bad_image') return `Không đọc được ảnh “${name}”.`;
  if (c === 'not_granted') return 'Bạn không có quyền thêm ảnh vào app này.';
  if (c === 'too_large') return `“${name}” quá lớn (tối đa 20 MB).`;
  if (c === 'quota_or_state') return 'Bộ nhớ ảnh của app đã đầy. Hãy xóa bớt ảnh cũ.';
  return `Không tải được “${name}”. Kiểm tra mạng rồi thử lại.`;
}
function downscaleImage(file, maxSide = 2000, q = 0.85) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxSide / Math.max(img.naturalWidth, img.naturalHeight));
      if (s >= 1 && file.size < 1.5e6 && /jpe?g|png|webp/.test(file.type)) { URL.revokeObjectURL(url); resolve(file); return; }
      const cv = document.createElement('canvas');
      cv.width = Math.round(img.naturalWidth * s); cv.height = Math.round(img.naturalHeight * s);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(url);
      cv.toBlob(b => resolve(b || file), 'image/jpeg', q);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

/* Lưu file ra máy */
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const ownSite = !inFrame && !(window.claude && typeof window.claude.use === 'function');
const isStandalone = () => { try { return matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } };
async function saveFile(filename, blob) {
  let dl = caps.downloads;
  if (!dl && window.claude && typeof window.claude.use === 'function') { try { dl = caps.downloads = await window.claude.use('downloads'); } catch (e) { dl = null; } }
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast('Đã lưu ' + filename); return true; }
    catch (e) {
      if (e && e.code === 'declined') { toast('Đã hủy lưu file'); return false; }
      if (e && e.code === 'rate_limited') { toast('Đang có một hộp thoại lưu file khác. Hãy thử lại sau giây lát.', 'bad'); return false; }
      toast('Không lưu được file ở chế độ xem này. Hãy mở app trong claude.ai rồi thử lại.', 'bad'); return false;
    }
  }
  if (!inFrame) {
    const type = blob.type || ({ pdf: 'application/pdf', png: 'image/png', json: 'application/json' })[filename.split('.').pop()] || 'application/octet-stream';
    const file = new File([blob], filename, { type });
    if (navigator.canShare && navigator.share) {
      let can = false; try { can = navigator.canShare({ files: [file] }); } catch (e) { can = false; }
      if (can) {
        const doShare = async () => {
          try { await navigator.share({ files: [file] }); return 'ok'; }
          catch (e) { return e && e.name === 'AbortError' ? 'abort' : (e && e.name === 'NotAllowedError' ? 'gesture' : 'fail'); }
        };
        let r = await doShare();
        if (r === 'gesture') {
          /* iOS chỉ cho mở bảng chia sẻ ngay sau khi chạm: hỏi chạm thêm một lần */
          r = await new Promise(res => {
            let done = false;
            const el = openSheet({
              title: 'File đã sẵn sàng', html: `<p><b>${esc(filename)}</b></p><p class="muted">Chạm “Chia sẻ” rồi chọn Zalo, hoặc “Lưu vào Tệp” / “Lưu hình ảnh”.</p>`,
              foot: `<button class="btn" data-sa="close">Hủy</button><button class="btn primary" data-sa="share">Chia sẻ</button>`,
              onClick: async (a2, b2, el2) => { if (a2 !== 'share') return; done = true; closeSheet(el2); res(await doShare()); },
            });
            const obs = new MutationObserver(() => { if (!document.body.contains(el)) { obs.disconnect(); if (!done) res('abort'); } });
            obs.observe(document.body, { childList: true });
          });
        }
        if (r === 'ok') { toast('Đã mở bảng chia sẻ'); return true; }
        if (r === 'abort') { toast('Đã hủy'); return false; }
      }
    }
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 60000);

function tlv(id, v) { v = String(v); return id + String(v.length).padStart(2, '0') + v; }
function crc16(s) {
  let crc = 0xffff;

  const acct = tlv('00', bin) + tlv('01', account);
  const mai = tlv('00', 'A000000727') + tlv('01', acct) + tlv('02', 'QRIBFTTA');
  let s = tlv('00', '01') + tlv('01', amount ? '12' : '11') + tlv('38', mai) + tlv('53', '704');
  if (amount) s += tlv('54', String(Math.round(amount)));
  s += tlv('58', 'VN');
  if (memo) s += tlv('62', tlv('08', memo));

  return s + crc16(s);
}
function bankReady(st = settings()) {
  return /^\d{6}$/.test(st.bankBin || '') && /^[A-Za-z0-9]{4,19}$/.test(String(st.bankAccount || '').replace(/\s/g, ''));

  return { payload, memo, amount, matrix: QR.encode(payload), bank: st.bankName || bankName(st.bankBin), account: st.bankAccount, holder: st.bankHolder };

      if (pages.length > 1) drawOp(c, { t: 'text', x: size.w - PG.MR, y: fy, s: `Trang ${i + 1}/${pages.length}`, w: 400, pt: 7.5, color: PC.muted, align: 'right' });
    }

/* Ghép các trang thành một ảnh PNG dài (gửi Zalo) */
async function makePng(pages, size = { w: 210, h: 297 }) {
  const imgs = await Promise.all(pages.map(p => new Promise((res, rej) => { const u = URL.createObjectURL(p.blob); const i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; i.src = u; })));
  const gap = imgs.length > 1 ? 24 : 0;
  let w = Math.min(1240, imgs[0].naturalWidth);
  /* trang cuối: bỏ khoảng trắng giữa nội dung và chân trang */
  const lastImg = imgs[imgs.length - 1];
  const fullH = img => Math.round(img.naturalHeight * w / img.naturalWidth);
  const footPx = Math.round(fullH(lastImg) * 17 / size.h);
  let lastKeep = null;
  {
    const h = fullH(lastImg), cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    if (c) {
      c.drawImage(lastImg, 0, 0, w, h);
      const scanH = h - footPx, data = c.getImageData(0, 0, w, scanH).data;
      let yEnd = 0;
      for (let y = scanH - 1; y >= 0 && !yEnd; y--) for (let x = 0; x < w; x += 2) { const k = (y * w + x) * 4; if (data[k] < 228 || data[k + 1] < 228 || data[k + 2] < 228) { yEnd = y; break; } }
      const top = Math.min(scanH, yEnd + Math.round(w * 0.05));
      if (top + footPx < h * 0.85) lastKeep = { top, foot: footPx, h };
      cv.width = cv.height = 1;
    }
  }
  const hOf = (img, i) => (i === imgs.length - 1 && lastKeep) ? lastKeep.top + lastKeep.foot : fullH(img);
  let total = imgs.reduce((s, img, i) => s + hOf(img, i), 0) + gap * (imgs.length - 1);
  const MAX = 15e6;
  if (w * total > MAX) {
    const k = Math.sqrt(MAX / (w * total)); w = Math.floor(w * k);
    if (lastKeep) { lastKeep = { top: Math.floor(lastKeep.top * k), foot: Math.floor(lastKeep.foot * k), h: fullH(lastImg) }; }
    total = imgs.reduce((s, img, i) => s + hOf(img, i), 0) + gap * (imgs.length - 1);
  }
  const cv = document.createElement('canvas'); cv.width = w; cv.height = total;
  const c = cv.getContext('2d');
  if (!c) throw new Error('canvas');
  c.fillStyle = '#E7E1D9'; c.fillRect(0, 0, w, total);
  c.imageSmoothingQuality = 'high';
  let y = 0;
  imgs.forEach((img, i) => {
    const h = fullH(img);
    if (i === imgs.length - 1 && lastKeep) {
      const sx = img.naturalWidth / w;
      c.drawImage(img, 0, 0, img.naturalWidth, lastKeep.top * sx, 0, y, w, lastKeep.top);
      c.drawImage(img, 0, (h - lastKeep.foot) * sx, img.naturalWidth, lastKeep.foot * sx, 0, y + lastKeep.top, w, lastKeep.foot);
      y += lastKeep.top + lastKeep.foot;
    } else { c.drawImage(img, 0, y, w, h); y += h + gap; }
  });

}
function pdfText(s) {

}
function makePdf(pages, title, size = { w: 210, h: 297 }) {
  const enc = new TextEncoder(), chunks = [], offs = [];
  let off = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); off += b.length; };
  const obj = (n, fn) => { offs[n] = off; push(`${n} 0 obj\n`); fn(); push('\nendobj\n'); };
  const W = +(size.w * 72 / 25.4).toFixed(2), H = +(size.h * 72 / 25.4).toFixed(2), n = pages.length;
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${pages.map((_, i) => `${4 + 3 * i} 0 R`).join(' ')}] /Count ${n} >>`));
  const d = new Date();
  const ds = `D:${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
  obj(3, () => push(`<< /Title ${pdfText(title)} /Producer (So Noi That) /CreationDate (${ds}) >>`));
  pages.forEach((p, i) => {
    obj(4 + 3 * i, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${6 + 3 * i} 0 R >> >> /Contents ${5 + 3 * i} 0 R >>`));
    const cs = `q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(5 + 3 * i, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(6 + 3 * i, () => { push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`); push(p.bytes); push('\nendstream'); });
  });
  const last = 3 + 3 * n, xref = off;
  push(`xref\n0 ${last + 1}\n0000000000 65535 f \n`);
  for (let k = 1; k <= last; k++) push(String(offs[k]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${last + 1} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks, { type: 'application/pdf' });
}

  el.innerHTML = `<div class="sheet-bg" data-sa="close"></div><div class="sheet ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="sheet-h"><h3>${esc(title)}</h3><button class="iconbtn" data-sa="close" aria-label="Đóng">${ic('x')}</button></header><div class="sheet-b">${html}</div>${foot ? `<footer class="sheet-f">${foot}</footer>` : ''}</div>`;

  el.addEventListener('click', e => {
    const b = e.target.closest('[data-sa]');
    if (!b || !el.contains(b)) return;
    if (b.dataset.sa === 'close') { closeSheet(el); return; }
    onClick && onClick(b.dataset.sa, b, el, e);

}

}

/* ---------- lịch thanh toán: trình soạn dùng chung (báo giá / mẫu / đơn đã chốt) ---------- */
function planEditor(plan, total, scope = 'quote') {
  const tplBtn = scope === 'tpl' ? `<button class="btn sm" data-act="plan-tpl">Khôi phục mặc định</button>` : `<button class="btn sm" data-act="plan-tpl">Dùng mẫu</button>`;
  const head = `<div class="card-h"><h3>Lịch thanh toán</h3>${tplBtn}</div>`;
  if (!plan || !plan.length) return head + `<p class="muted">Chưa có lịch thanh toán. <button class="linkbtn" data-act="plan-tpl">Tạo theo mẫu</button></p>`;
  const ord = scope === 'order' ? curOrder() : null;
  const rows = total == null ? plan.map((r, i) => ({ ...r, n: i + 1, last: i === plan.length - 1 })) : ord ? orderPlanAmounts(ord, plan) : planAmounts(plan, total);
  const sum = planPctSum(plan);
  return head + `<div class="plan-rows">${rows.map(r => `
    <div class="prow ${total == null ? 'noamt' : ''}" data-prow="${r.id}">
      <span class="pno">Đợt ${r.n}</span>
      <input class="in pl" id="pl-${r.id}" data-pf="label" value="${esc(r.label)}" placeholder="Nội dung đợt" aria-label="Nội dung đợt ${r.n}" autocomplete="off">
      <select class="in pt" id="pt-${r.id}" data-pf="trigger" aria-label="Mốc thu đợt ${r.n}">${Object.entries(TRIGGERS).map(([k, l]) => `<option value="${k}" ${k === r.trigger ? 'selected' : ''}>${l}</option>`).join('')}</select>
      ${r.last ? `<span class="ppct rest">Còn lại</span>` : `<div class="ppct"><input class="in num" id="pp-${r.id}" data-pf="pct" inputmode="decimal" value="${r.pct ? QF.format(r.pct) : ''}" placeholder="0" aria-label="Tỷ lệ đợt ${r.n}" autocomplete="off"><span>%</span></div>`}
      ${total == null ? '' : `<b class="pamt" data-pamt>${money(r.amount)}</b>`}
      <button class="iconbtn" data-act="plan-del" data-id="${r.id}" aria-label="Xóa đợt ${r.n}" ${plan.length <= 1 ? 'disabled' : ''}>${ic('trash')}</button>
    </div>`).join('')}</div>
    <p class="err" data-planwarn ${sum >= 100 ? '' : 'hidden'}>Các đợt trước đã chiếm ${QF.format(sum)}%. Đợt cuối sẽ bằng 0, hãy giảm tỷ lệ.</p>
    <div class="addbar"><button class="btn sm" data-act="plan-add">${ic('plus')}Thêm đợt</button><span class="muted plan-hint">Đợt cuối tự lấy phần còn lại${scope === 'tpl' ? '' : ', gồm cả phát sinh'}.</span></div>`;
}
function refreshPlanBox(box, plan, total) {
  if (!box || !plan) return;
  const sum = planPctSum(plan);
  const w = box.querySelector('[data-planwarn]'); if (w) { w.hidden = sum < 100; w.textContent = `Các đợt trước đã chiếm ${QF.format(sum)}%. Đợt cuối sẽ bằng 0, hãy giảm tỷ lệ.`; }
  if (total == null) return;
  const ord = box.dataset.planScope === 'order' ? curOrder() : null;
  for (const r of (ord ? orderPlanAmounts(ord, plan) : planAmounts(plan, total))) { const el = box.querySelector(`[data-prow="${r.id}"] [data-pamt]`); if (el) el.textContent = money(r.amount); }
}
function planCtx(el) {
  const box = el.closest('[data-plan-scope]'); if (!box) return null;
  const scope = box.dataset.planScope;
  if (scope === 'quote') {
    const o = curOrder(); if (!o?.draft) return null;
    if (!Array.isArray(o.draft.plan)) o.draft.plan = [];
    return { box, scope, get plan() { return o.draft.plan; }, set plan(v) { o.draft.plan = v; }, total: quoteTotals(o.draft).total, save: d => touchOrder(o, d) };
  }
  if (scope === 'tpl') return { box, scope, get plan() { return S.tplWork; }, set plan(v) { S.tplWork = v; }, total: null, save: () => saveSettings({ planTemplate: clone(S.tplWork) }) };
  const o = curOrder();
  return { box, scope, get plan() { return S.planWork; }, set plan(v) { S.planWork = v; }, total: o ? lastVersion(o).total : 0, order: o, save: () => {} };
}
function planInput(el) {
  const ctx = planCtx(el); if (!ctx) return;
  const row = ctx.plan.find(r => r.id === el.closest('[data-prow]')?.dataset.prow); if (!row) return;
  const f = el.dataset.pf;
  if (f === 'pct') row.pct = Math.min(parseQty(el.value), 100);
  else row[f] = el.value;
  refreshPlanBox(ctx.box, ctx.plan, ctx.total);
  ctx.save();
}
function rerenderPlan(ctx) { ctx.box.innerHTML = planEditor(ctx.plan, ctx.total, ctx.scope); ctx.save(0); }
function refreshRows(o) {
  const box = $('#qrows'); if (!box) return;
  box.innerHTML = o.draft.rows.map(rowHtml).join('');
  $('#qrows-empty').hidden = !!o.draft.rows.length;
  $('#row-count').textContent = o.draft.rows.length + ' dòng';
  refreshTotals(o);
}
function setPath(obj, path, v) { const ks = path.split('.'); let t = obj; while (ks.length > 1) { const k = ks.shift(); t = t[k] ||= {}; } t[ks[0]] = v; }

function onEditorInput(e) {
  const o = curOrder(); if (!o || !o.draft) return;
  const el = e.target, q = o.draft;
  if (el.dataset.pf) return;
  if (el.id === 'qf-date') { if (el.value) { q.date = el.value; touchOrder(o); } return; }
  if (el.dataset.qf) {
    if (el.dataset.qf === 'discount') {
      q.discount ||= { type: 'amount', value: 0 };
      q.discount.value = q.discount.type === 'percent' ? Math.min(parseQty(el.value), 100) : parseMoney(el.value);
      refreshTotals(o);
    } else setPath(q, el.dataset.qf, el.value);
    touchOrder(o); return;
  }
  const rowEl = el.closest('[data-row]'); if (!rowEl || !el.dataset.rf) return;
  const r = q.rows.find(x => x.id === rowEl.dataset.row); if (!r) return;
  const f = el.dataset.rf;
  if (f === 'name') {
    r.name = el.value;
    const hit = Store.list('catalog').find(c => c.name.trim().toLowerCase() === el.value.trim().toLowerCase());
    if (hit && !r.price && !r.material) {
      r.material = hit.material || ''; r.unit = hit.unit || r.unit; r.price = hit.price || 0;
      rowEl.querySelector('[data-rf=material]').value = r.material;
      rowEl.querySelector('[data-rf=unit]').value = r.unit;
      rowEl.querySelector('[data-rf=price]').value = r.price ? money(r.price) : '';
    }
  } else if (f === 'material') r.material = el.value;
  else if (f === 'unit') { r.unit = el.value; if (r.dims) { r.qty = dimsQty(r.unit, r.dims); rowEl.querySelector('[data-rf=qty]').value = r.qty ? fmtQty(r.qty) : ''; const d = rowEl.querySelector('[data-dim]'); d.textContent = 'KT: ' + dimText(r.unit, r.dims); } }
  else if (f === 'qty') { r.qty = parseQty(el.value); if (r.dims) { r.dims = null; const d = rowEl.querySelector('[data-dim]'); d.hidden = true; d.textContent = ''; } }
  else if (f === 'price') r.price = parseMoney(el.value);
  rowEl.querySelector('[data-amt]').textContent = money(rowAmount(r));
  refreshTotals(o);
  touchOrder(o);

function validateQuote(q) {

  if (rows.some(r => r.name.trim() && !rowAmount(r))) errs.push('Có hạng mục chưa có khối lượng hoặc đơn giá (thành tiền bằng 0).');

}

function upsertCustomer(c) {

async function doClose(o, date, dep, method = 'transfer', sig = null, signer = '') {
  const q = o.draft;
  q.rows = q.rows.filter(r => r.name.trim() || rowAmount(r));
  const t = quoteTotals(q), first = !o.versions.length;
  const v = { no: o.versions.length + 1, quote: clone(q), sub: t.sub, disc: t.disc, total: t.total, closedAt: date, closedTs: new Date().toISOString() };
  if (sig) v.sign = await makeSignRecord(sig, signer, { code: o.code, no: v.no, quote: v.quote, total: v.total });
  o.versions.push(v); o.draft = null;
  o.plan = mergePlan(o.plan, v.quote.plan || []);
  if (first) { o.status = 'closed'; o.closedAt = date; addLog(o, `Chốt đơn ngày ${fmtDate(date)}: ${moneyD(t.total)}`); }
  else addLog(o, `Chốt bản ${v.no} ngày ${fmtDate(date)}: ${moneyD(o.versions[v.no - 2].total)} → ${moneyD(t.total)}`);
  if (v.sign) addLog(o, `Khách ${v.sign.name} ký xác nhận bản ${v.no} (mã ${v.sign.hash})`);
  if (dep > 0) { o.payments.push({ id: uid('p'), no: nextPayNo(o), amount: dep, date, method, note: 'Đặt cọc khi chốt đơn', createdAt: new Date().toISOString() }); addLog(o, `Ghi nhận đặt cọc ${moneyD(dep)} (${PAY_METHOD[method]})`); }
  o.customerId = upsertCustomer(q.customer) || o.customerId;
  touchOrder(o, 0);

  toast(first ? 'Đã chốt đơn ' + o.code : `Đã chốt bản ${v.no}`);
}

function sigPadHtml(id) {
  return `<div class="sigbox"><canvas class="sigpad" id="${id}" aria-label="Khung ký tên"></canvas><span class="sig-hint">Ký vào đây bằng ngón tay hoặc bút</span><button class="btn sm sig-clear" type="button" data-sigclear>Ký lại</button></div>`;

function mountSigPad(canvas) {
  const box = canvas.parentElement, hint = box.querySelector('.sig-hint'), ctx = canvas.getContext('2d');
  let drawing = false, last = null, empty = true, bb = null;
  const size = () => {
    const r = canvas.getBoundingClientRect(), dpr = Math.min(2, window.devicePixelRatio || 1);
    canvas.width = Math.max(1, Math.round(r.width * dpr)); canvas.height = Math.max(1, Math.round(r.height * dpr));
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1F2A55'; ctx.fillStyle = '#1F2A55';
  };
  const clear = () => { size(); empty = true; bb = null; hint.hidden = false; };
  const pt = e => { const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top, w: e.pointerType === 'pen' ? 1.2 + (e.pressure || 0.5) * 2.4 : 2.6 }; };
  const grow = p => { bb = bb ? { x0: Math.min(bb.x0, p.x), y0: Math.min(bb.y0, p.y), x1: Math.max(bb.x1, p.x), y1: Math.max(bb.y1, p.y) } : { x0: p.x, y0: p.y, x1: p.x, y1: p.y }; };
  canvas.addEventListener('pointerdown', e => {
    e.preventDefault(); canvas.setPointerCapture?.(e.pointerId);

function periodRange() {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth();

    for (const p of o.payments || []) if (inR(p.date)) pays.push({ ...p, o });

async function backupJson() {
  const data = { format: 'so-noi-that', version: 2, exportedAt: new Date().toISOString(), data: {} };
  for (const c of COLS) data.data[c] = Store.list(c);
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const ok = await saveFile(`So-noi-that-sao-luu-${today()}.json`, blob);
  if (ok) { saveMeta({ lastBackupAt: new Date().toISOString() }); render(); }
}
function readBackup(raw) {
  if (!raw || typeof raw !== 'object') return null;
  if (raw.format === 'so-noi-that' && raw.data && Array.isArray(raw.data.orders)) return { at: raw.exportedAt, cols: raw.data };
  /* bản sao lưu cũ (trước 20/10/2026): các danh sách nằm ở cấp ngoài cùng */
  if (Array.isArray(raw.orders) && (raw.app === 'so-noi-that' || Array.isArray(raw.app)) && Array.isArray(raw.catalog || []) && Array.isArray(raw.customers || [])) {
    return { at: raw.exportedAt, cols: { orders: raw.orders, customers: raw.customers || [], catalog: raw.catalog || [], app: Array.isArray(raw.app) ? raw.app : [] } };
  }
  return null;
}
async function restoreJson(file) {
  let raw;
  try { raw = JSON.parse(await file.text()); } catch (e) { toast('File không đúng định dạng sao lưu.', 'bad'); return; }
  const b = readBackup(raw);
  if (!b) { toast('File không phải bản sao lưu của Sổ Nội Thất.', 'bad'); return; }
  const when = b.at ? fmtDateTime(new Date(b.at)) : 'không rõ thời gian';
  const ok = await confirmBox({ title: 'Khôi phục dữ liệu?', text: `Toàn bộ dữ liệu hiện tại sẽ được <b>thay bằng</b> bản sao lưu lúc ${esc(when)} (${b.cols.orders.length} đơn, ${(b.cols.customers || []).length} khách). Ảnh đính kèm không nằm trong bản sao lưu.`, ok: 'Khôi phục', danger: true });
  if (!ok) return;
  for (const c of COLS) for (const d of Store.list(c)) Store.del(c, d.id);
  for (const c of COLS) for (const d of (b.cols[c] || [])) if (d && d.id) Store.put(c, c === 'orders' ? normalizeOrder(d) : d, 0);
  S.orderId = null; S.view = 'list'; render(); toast(`Đã khôi phục ${b.cols.orders.length} đơn`);
}
async function setLogo(file) {
  const img = await loadImg(URL.createObjectURL(file));
  if (!img) { toast('Không đọc được ảnh logo.', 'bad'); return; }
  const s = Math.min(1, 600 / img.width, 300 / img.height);
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  let url = cv.toDataURL('image/png');
  if (url.length > 180000) url = cv.toDataURL('image/jpeg', 0.9);
  saveSettings({ logo: url }); render(); toast('Đã cập nhật logo');
}

    log: [{ at: iso(78), text: 'Tạo báo giá' }, { at: iso(75), text: 'Chốt đơn' }, { at: iso(28), text: 'Chuyển sang Hoàn thành' }] });
  // 4–5. Đang báo giá
  const q4 = Q(D(1), 'Chị Mai (mẫu)', '0900 000 004', 'Long Biên, Hà Nội', 'Phòng ngủ – nhà riêng', [R('Tủ áo cánh mở', 0, { a: 1800, b: 2400, n: 1, u: 'mm' }), R('Bàn trang điểm', 1), R('Giường ngủ 1m8', 1)]);
  const o4 = mk(q4, {}); o4.draft = q4; o4.log = [{ at: iso(1), text: 'Tạo báo giá' }];
  const q5 = Q(T, 'Anh Đức (mẫu)', '0900 000 005', 'Lê Chân, Hải Phòng', 'Căn hộ – bếp', [R('Tủ bếp dưới', 3), R('Tủ bếp trên', 2.4), R('Kệ tivi', 2)]);
  const o5 = mk(q5, {}); o5.draft = q5; o5.log = [{ at: iso(0), text: 'Tạo báo giá' }];
  // mã đơn theo tháng chốt/lập
  const pre = settings().codePrefix || 'BG', seq = {};
  [...orders].sort((a, b) => (a.closedAt || headQuote(a).date).localeCompare(b.closedAt || headQuote(b).date)).forEach(o => {
    const d = (o.closedAt || headQuote(o).date).split('-'); const stem = `${pre}${d[0].slice(2)}${d[1]}-`; seq[stem] = (seq[stem] || 0) + 1; o.code = stem + 'M' + seq[stem];
  });
  orders.forEach(o => { normalizeOrder(o); if (isClosed(o)) o.plan = mergePlan([], lastVersion(o).quote.plan); });
  o1.plan[1].due = D(5);
  o2.plan[0].due = addDays(T, 3);
  o3.handover = { date: D(28), warrantyMonths: 36, warrantyUntil: addMonths(D(28), 36), note: '', sign: null, at: iso(28) };
  return { catalog: cat, customers: custs, orders };
}

/* định dạng ô tiền khi gõ, giữ vị trí con trỏ */
function formatMoneyInput(el) {
  const pos = el.selectionStart ?? el.value.length;
  const digitsRight = el.value.slice(pos).replace(/\D/g, '').length;
  const v = parseMoney(el.value);
  const nv = el.value.replace(/\D/g, '') ? money(v) : '';
  if (nv === el.value) return;
  el.value = nv;
  let p = nv.length, cnt = 0;
  while (p > 0 && cnt < digitsRight) { p--; if (/\d/.test(nv[p])) cnt++; }
  if (digitsRight === 0) p = nv.length;
  try { el.setSelectionRange(p, p); } catch (er) { /* bỏ qua */ }
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-money]') || (el.id === 'disc-val' && curOrder()?.draft?.discount?.type !== 'percent')) formatMoneyInput(el);
  if (el.matches('.datefield input')) { const t = el.parentElement.querySelector('[data-dftext]'); if (t) t.textContent = el.value ? fmtDate(el.value) : 'Chọn ngày'; }
  if (el.dataset.pf) { planInput(el); return; }
  if (el.closest('.editor')) { onEditorInput(e); return; }
  if (el.id === 'order-search') { S.q = el.value; const c = $('#cards'); if (c) c.innerHTML = renderCards(); return; }
  if (el.id === 'cat-search') { S.catQ = el.value; clearTimeout(window._catT); window._catT = setTimeout(() => { const pos = el.selectionStart; render(); const n = $('#cat-search'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { /* */ } } }, 350); return; }
  if (el.dataset.cf) { const row = el.closest('[data-cat]'), c = Store.get('catalog', row.dataset.cat); if (!c) return; const v = el.dataset.cf === 'price' ? parseMoney(el.value) : el.value; Store.put('catalog', { ...c, [el.dataset.cf]: v }); return; }
  if (el.dataset.kf) { const row = el.closest('[data-cus]'), c = Store.get('customers', row.dataset.cus); if (!c) return; Store.put('customers', { ...c, [el.dataset.kf]: el.value }); return; }
  if (el.dataset.sf) {
    saveSettings({ [el.dataset.sf]: el.value });
    if (['bankBin', 'bankAccount', 'memoPrefix', 'codePrefix'].includes(el.dataset.sf)) { const q = $('#qrtest'); if (q) q.innerHTML = qrTestHtml(); }
    return;
  }
});

  const el = e.target;
  if (el.dataset.due) {
    const o = curOrder(), r = o?.plan?.find(x => x.id === el.dataset.due); if (!r) return;
    r.due = el.value || ''; const n = o.plan.indexOf(r) + 1;
    addLog(o, r.due ? `Đặt hạn thu đợt ${n}: ${fmtDate(r.due)}` : `Bỏ hạn thu đợt ${n}`); touchOrder(o, 0); render(); return;
  }
  if (el.dataset.pf) return;
  if (el.closest('.editor') && (el.tagName === 'SELECT' || el.type === 'date')) { onEditorInput(e); return; }
  if (el.dataset.cf && el.tagName === 'SELECT') { const row = el.closest('[data-cat]'), c = Store.get('catalog', row.dataset.cat); c && Store.put('catalog', { ...c, unit: el.value }, 0); return; }
  if (el.id === 'st-from' || el.id === 'st-to') { if (el.value) { S[el.id === 'st-from' ? 'from' : 'to'] = el.value; render(); } return; }
  if (el.id === 'att-input') { const o = curOrder(); if (o && el.files.length) addAttachments(o, el.files); el.value = ''; return; }
  if (el.id === 'logo-in') { if (el.files[0]) setLogo(el.files[0]); el.value = ''; return; }
  if (el.id === 'restore-in') { if (el.files[0]) restoreJson(el.files[0]); el.value = ''; return; }
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.dataset && el.dataset.rf === 'qty') { const v = parseQty(el.value); el.value = v ? fmtQty(v) : ''; }
  if (el.id === 'disc-val' && curOrder()?.draft?.discount?.type === 'percent') { const v = parseQty(el.value); el.value = v ? QF.format(Math.min(v, 100)) : ''; }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && sheets.length) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'note-in') { e.preventDefault(); ACTIONS['add-note'](); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Store.flushAll(); return; }
  if (Store.mode === 'cloud' && !Store.busy() && !Store.failed.size && !sheets.length && S.view !== 'edit' && Date.now() - Store.loadedAt > 15000) {
    Store.loadAll().then(render).catch(() => { /* giữ dữ liệu đang có */ });
  }
});
window.addEventListener('pagehide', () => Store.flushAll());
wideMQ.addEventListener('change', () => render());

/* ảnh đính kèm lưu trên máy: điền src sau khi vẽ */
function hydrate() {
  const o = curOrder(); if (!o) return;
  for (const img of $$('img[data-att]')) {
    const a = o.attachments.find(x => x.id === img.dataset.att); if (!a) continue;
    attSrc(a).then(u => { if (u) img.src = u; });
  }
}

async function boot() {
  S.loadError = ''; Store.mode = 'loading'; render();
  let db = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { db = await Promise.race([window.claude.use('db'), sleep(11000).then(() => null)]); } catch (e) { db = null; }
    window.claude.use('assets').then(a => { caps.assets = a; if (S.orderId && Store.mode === 'cloud') render(); }).catch(() => { caps.assets = null; });
    window.claude.use('downloads').then(d => { caps.downloads = d; }).catch(() => { caps.downloads = null; });
  }
  if (db) { caps.db = db; Store.backend = cloudBackend(db); await Outbox.open(); }
  else {
    Store.backend = await localBackend();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* bỏ qua */ }
  }
  try {
    await withTimeout(Store.loadAll(), 25000);
    Store.mode = db ? 'cloud' : 'local';
    if (Store.mode === 'cloud') { const n = await Store.restoreOutbox(); if (n) setTimeout(() => toast(`Đã khôi phục ${n} thay đổi chưa gửi lên máy chủ`), 300); }
  } catch (e) {
    Store.mode = db ? 'cloud' : 'local';
    S.loadError = e && e.code === 'revoked' ? 'Bạn không còn quyền mở dữ liệu của app này.' : 'Không kết nối được tới nơi lưu dữ liệu. Kiểm tra mạng rồi bấm Thử lại.';
  }
  render();
  ensureFonts();
}
setInterval(() => { if (Store.failed.size && navigator.onLine !== false) Store.flushAll(); }, 15000);
window.addEventListener('online', () => { if (Store.failed.size) Store.flushAll(); updateSaveStatus(); });
window.addEventListener('offline', () => updateSaveStatus());
if (ownSite && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === '127.0.0.1' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* chạy bình thường không cần ngoại tuyến */ }); });
}
boot();

</script>
