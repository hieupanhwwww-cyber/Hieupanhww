  let hit = Store.list('customers').find(x => ph ? digits(x.phone) === ph : (!digits(x.phone) && x.name.trim().toLowerCase() === name.toLowerCase()));
  if (hit) {
    const up = { ...hit, name, phone: c.phone || hit.phone, address: c.address || hit.address };
    Store.put('customers', up, 0); return hit.id;
  }
  const n = { id: uid('c'), name, phone: c.phone || '', address: c.address || '', createdAt: new Date().toISOString() };
  Store.put('customers', n, 0); return n.id;
}
async function doClose(o, date, dep, method = 'transfer', sig = null, signer = '') {
  const q = o.draft;
  q.rows = q.rows.filter(r => r.name.trim() || rowAmount(r));
  const t = quoteTotals(q), first = !o.versions.length;
  const v = { no: o.versions.length + 1, quote: clone(q), sub: t.sub, disc: t.disc, total: t.total, closedAt: date, closedTs: new Date().toISOString() };
  if (sig) v.sign = await makeSignRecord(sig, signer, { code: o.code, no: v.no, quote: v.quote, total: v.total });
  /* chốt giá nhập theo danh mục tại thời điểm chốt: đổi danh mục sau này không làm đổi lãi đơn cũ */
  const cd = costDoc(o.id), frz = {};
  for (const r of q.rows) if (cd.rows?.[r.id] == null) { const k = rowCat(r); if (k && catCost(k.id)) frz[r.id] = catCost(k.id); }
  if (Object.keys(frz).length) saveCostDoc(o.id, { rows: frz, kc: frz }, 0);
  o.versions.push(v); o.draft = null;
  o.plan = mergePlan(o.plan, v.quote.plan || []);
  if (first) { o.status = 'closed'; o.closedAt = date; addLog(o, `Chốt đơn ngày ${fmtDate(date)}: ${moneyD(t.total)}`); }
  else addLog(o, `Chốt bản ${v.no} ngày ${fmtDate(date)}: ${moneyD(o.versions[v.no - 2].total)} → ${moneyD(t.total)}`);
  if (v.sign) addLog(o, `Khách ${v.sign.name} ký xác nhận bản ${v.no} (mã ${v.sign.hash})`);
  if (dep > 0 && !can('pay')) { (o.payReqs ||= []).push({ id: uid('q'), amount: dep, date, method, note: 'Đặt cọc khi chốt đơn', by: Team.uid(), byName: Team.myName(), status: 'pending', createdAt: new Date().toISOString() }); addLog(o, `Báo đã thu đặt cọc ${moneyD(dep)} (${PAY_METHOD[method]}), chờ xác nhận`); }
  else if (dep > 0) { o.payments.push({ id: uid('p'), no: nextPayNo(o), amount: dep, date, method, note: 'Đặt cọc khi chốt đơn', createdAt: new Date().toISOString() }); addLog(o, `Ghi nhận đặt cọc ${moneyD(dep)} (${PAY_METHOD[method]})`); }
  o.customerId = upsertCustomer(q.customer) || o.customerId;
  touchOrder(o, 0);
  S.view = 'detail'; S.ver = null; render();
  toast(first ? 'Đã chốt đơn ' + o.code : `Đã chốt bản ${v.no}`);
}

function sigPadHtml(id) {

function mountSigPad(canvas) {
  const box = canvas.parentElement, hint = box.querySelector('.sig-hint'), ctx = canvas.getContext('2d');

function periodRange() {
  const d = new Date(), y = d.getFullYear(), m = d.getMonth();
  if (S.period === 'month') return monthRange(d);
  if (S.period === 'quarter') { const qs = Math.floor(m / 3) * 3; return [dstr(new Date(y, qs, 1)), dstr(new Date(y, qs + 3, 0))]; }
  if (S.period === 'year') return [`${y}-01-01`, `${y}-12-31`];

  return f <= t ? [f, t] : [t, f];
}
function computeStats(from, to) {
  const inR = s => s && s >= from && s <= to;
  const ev = [], pays = [], closed = [], debt = [];
  for (const o of Store.list('orders')) {
    for (const e of valueEvents(o)) if (inR(e.date)) ev.push({ ...e, o });
    for (const p of o.payments || []) if (inR(p.date)) pays.push({ ...p, o });
    if (isClosed(o) && inR(o.closedAt)) closed.push(o);
    const due = orderDue(o); if (due > 0) debt.push({ o, due });

  ev.sort((a, b) => a.date.localeCompare(b.date)); pays.sort((a, b) => a.date.localeCompare(b.date));

  return { ev, pays, closed, debt, value: ev.reduce((s, e) => s + e.amount, 0), paid: pays.reduce((s, p) => s + p.amount, 0), due: debt.reduce((s, d) => s + d.due, 0) };
}

  while (out.length < 6) { let [yy, mm] = out[0].split('-').map(Number); mm--; if (mm < 1) { mm = 12; yy--; } out.unshift(`${yy}-${pad2(mm)}`); }

}

async function backupJson() {
  const data = { format: 'so-noi-that', version: 2, exportedAt: new Date().toISOString(), data: {} };
  for (const c of COLS) data.data[c] = Store.list(c);
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' });
  const ok = await saveFile(`So-noi-that-sao-luu-${today()}.json`, blob);
  if (ok) { saveMeta({ lastBackupAt: new Date().toISOString() }); render(); }
}
function readBackup(raw) {
  if (!raw || typeof raw !== 'object') return null;
  if (raw.format === 'so-noi-that' && raw.data && Array.isArray(raw.data.orders)) return { at: raw.exportedAt, cols: raw.data };
  /* bản sao lưu cũ (trước 20/10/2026): các danh sách nằm ở cấp ngoài cùng */
  if (Array.isArray(raw.orders) && (raw.app === 'so-noi-that' || Array.isArray(raw.app)) && Array.isArray(raw.catalog || []) && Array.isArray(raw.customers || [])) {
    return { at: raw.exportedAt, cols: { orders: raw.orders, customers: raw.customers || [], catalog: raw.catalog || [], app: Array.isArray(raw.app) ? raw.app : [] } };
  }
  return null;
}
async function restoreJson(file) {
  let raw;
  try { raw = JSON.parse(await file.text()); } catch (e) { toast('File không đúng định dạng sao lưu.', 'bad'); return; }
  const b = readBackup(raw);
  if (!b) { toast('File không phải bản sao lưu của Sổ Nội Thất.', 'bad'); return; }
  const when = b.at ? fmtDateTime(new Date(b.at)) : 'không rõ thời gian';
  const ok = await confirmBox({ title: 'Khôi phục dữ liệu?', text: `Toàn bộ dữ liệu hiện tại sẽ được <b>thay bằng</b> bản sao lưu lúc ${esc(when)} (${b.cols.orders.length} đơn, ${(b.cols.customers || []).length} khách). Ảnh đính kèm không nằm trong bản sao lưu.`, ok: 'Khôi phục', danger: true });
  if (!ok) return;
  for (const c of COLS) for (const d of Store.list(c)) Store.del(c, d.id);
  for (const c of COLS) for (const d of (b.cols[c] || [])) if (d && d.id) Store.put(c, c === 'orders' ? normalizeOrder(d) : d, 0);
  S.orderId = null; S.view = 'list'; render(); toast(`Đã khôi phục ${b.cols.orders.length} đơn`);
}
async function setLogo(file) {
  const img = await loadImg(URL.createObjectURL(file));
  if (!img) { toast('Không đọc được ảnh logo.', 'bad'); return; }
  const s = Math.min(1, 600 / img.width, 300 / img.height);
  const cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  let url = cv.toDataURL('image/png');
  if (url.length > 180000) url = cv.toDataURL('image/jpeg', 0.9);
  saveSettings({ logo: url }); render(); toast('Đã cập nhật logo');
}

/* =========================================================
   LÃI: giá nhập + vận chuyển → lãi của từng đơn
   Lưu riêng ở nhóm "costs" (không nằm trong đơn), nên không bao giờ
   in ra báo giá, và khi làm việc nhóm chỉ Chủ / Kế toán đọc được.
   ========================================================= */
const canCost = () => can('cost') && feat('profit');
const costDoc = oid => Store.get('costs', 'o_' + oid) || { id: 'o_' + oid, rows: {}, chg: {}, ship: 0 };
const catCost = kid => Number(Store.get('costs', 'k_' + kid)?.cost) || 0;
const catByName = name => { const n = String(name || '').trim().toLowerCase(); return n ? Store.list('catalog').find(c => c.name.trim().toLowerCase() === n) : null; };
function saveCostDoc(oid, patch, delay = 600) {
  const cur = costDoc(oid);
  Store.put('costs', { ...cur, ...patch, rows: { ...(cur.rows || {}), ...(patch.rows || {}) }, chg: { ...(cur.chg || {}), ...(patch.chg || {}) }, kc: { ...(cur.kc || {}), ...(patch.kc || {}) }, id: 'o_' + oid }, delay);
}
function setCatCost(kid, cost, delay = 600) { Store.put('costs', { id: 'k_' + kid, cost: Math.max(0, Math.round(Number(cost) || 0)), at: new Date().toISOString() }, delay); }
/* giá nhập của 1 dòng: đã nhập cho đơn > giá nhập trong danh mục (theo tên) */
function rowCost(c, r) {
  const v = c.rows && c.rows[r.id];
  if (v != null && v !== '') return Number(v) || 0;
  const k = catByName(r.name); return k ? catCost(k.id) : 0;
}
function profitOf(o, q = null) {
  q = q || (S.view === 'edit' && o.draft ? o.draft : headQuote(o));
  const c = costDoc(o.id), t = quoteTotals(q);
  let goods = 0, missing = 0;
  for (const r of q.rows || []) {
    if (!String(r.name || '').trim() && !rowAmount(r)) continue;
    const u = rowCost(c, r);
    if (!(u > 0)) { if (rowAmount(r) > 0) missing++; continue; }
    goods += Math.round((Number(r.qty) || 0) * u);
  }
  let rev = t.total, chgCost = 0;
  for (const g of (o.changes || []).filter(x => x.status === 'confirmed')) { rev += changeSigned(g); chgCost += Number(c.chg?.[g.id]) || 0; }
  const ship = Number(c.ship) || 0, cost = goods + chgCost + ship, profit = rev - cost;
  return { rev, goods, chgCost, ship, cost, profit, pct: rev > 0 ? profit / rev * 100 : 0, missing, any: cost > 0 };
}
const pctTxt = v => (Math.round(v * 10) / 10).toLocaleString('vi-VN') + '%';
function profitInner(o) {
  const p = profitOf(o);
  return `<div class="pgrid">
      <div><span>Doanh thu</span><b>${money(p.rev)}</b></div>
      <div><span>Giá nhập</span><b>${money(p.goods + p.chgCost)}</b></div>
      <div><span>Vận chuyển</span><b>${money(p.ship)}</b></div>
      <div class="pres ${p.profit < 0 ? 'neg' : ''}"><span>Lãi</span><b>${money(p.profit)}</b><small>${p.rev ? pctTxt(p.pct) + ' doanh thu' : ''}</small></div>
    </div>
    ${p.missing ? `<p class="pwarn">${ic('info')} ${p.missing} hạng mục chưa có giá nhập, lãi đang tính cao hơn thực tế.</p>` : ''}
    <p class="muted" style="font-size:13px;margin-top:8px">Chỉ bạn thấy. Không in ra báo giá.</p>`;
}
function profitSum(o) { const p = profitOf(o); return p.any ? `<span class="${p.profit < 0 ? 'negt' : 'okt'}">${money(p.profit)} đ</span> · ${p.rev ? pctTxt(p.pct) : ''}${p.missing ? ` · <span class="warnt">thiếu ${p.missing} giá nhập</span>` : ''}` : '<span class="warnt">Chưa nhập giá nhập</span>'; }
function profitCardHtml(o) { return canCost() ? sect('profit', 'Lãi dự kiến', `<span data-psum>${profitSum(o)}</span>`, `<div data-pbody>${profitInner(o)}</div>`, { id: 'profit-card', cls: 'profit', act: `<button class="btn sm" data-act="profit-edit">${ic('edit')}Giá nhập</button>` }) : ''; }
function refreshProfit(o) {
  const el = document.getElementById('profit-card'); if (!el || !o) return;
  const b = el.querySelector('[data-pbody]'), sm = el.querySelector('[data-psum]');
  if (b) b.innerHTML = profitInner(o); if (sm) sm.innerHTML = profitSum(o);
}

function profitSheet(o) {
  const q = S.view === 'edit' && o.draft ? o.draft : headQuote(o);
  const c = costDoc(o.id);
  const rows = (q.rows || []).filter(r => String(r.name || '').trim() || rowAmount(r));
  const chgs = (o.changes || []).filter(x => x.status === 'confirmed');
  const work = { rows: Object.fromEntries(rows.map(r => [r.id, rowCost(c, r)])), chg: Object.fromEntries(chgs.map(g => [g.id, Number(c.chg?.[g.id]) || 0])), ship: Number(c.ship) || 0 };
  const sumHtml = () => {
    const t = quoteTotals(q);
    let goods = 0; for (const r of rows) goods += Math.round((Number(r.qty) || 0) * (work.rows[r.id] || 0));
    let rev = t.total, cc = 0; for (const g of chgs) { rev += changeSigned(g); cc += work.chg[g.id] || 0; }
    const cost = goods + cc + work.ship, pr = rev - cost;
    return `<div class="psum"><div><span>Doanh thu</span><b>${money(rev)}</b></div><div><span>Tổng chi phí</span><b>${money(cost)}</b></div><div class="pres ${pr < 0 ? 'neg' : ''}"><span>Lãi</span><b>${money(pr)}</b><small>${rev ? pctTxt(pr / rev * 100) : ''}</small></div></div>`;
  };
  const lineProfit = r => { const u = work.rows[r.id] || 0; if (!u) return '<span class="muted">chưa có giá nhập</span>'; const v = Math.round((Number(r.qty) || 0) * ((Number(r.price) || 0) - u)); return `<span class="${v < 0 ? 'negt' : ''}">lãi ${money(v)}</span>`; };
  const el = openSheet({
    title: 'Giá nhập & vận chuyển', cls: 'wide',
    html: `<p class="muted">${esc(q.customer?.name || o.code)} · ${esc(o.code)}. Chỉ dùng để tính lãi, <b>không in ra báo giá</b> và không gửi cho khách.</p>

      <div class="cost-list">
        <div class="cost-row cost-head"><div>Hạng mục</div><div class="r">Giá bán</div><div class="r">Giá nhập / đơn vị</div><div class="r">Lãi dòng</div></div>
        ${rows.map(r => `<div class="cost-row" data-crow="${r.id}">
          <div><b>${esc(r.name || 'Dòng không tên')}</b><span class="sub">${fmtQty(r.qty)} ${esc(r.unit)}${catByName(r.name) ? '' : ' · không có trong danh mục'}</span></div>
          <div class="r num">${money(r.price)}</div>
          <div><input class="in num" data-money data-cost="${r.id}" inputmode="numeric" autocomplete="off" value="${work.rows[r.id] ? money(work.rows[r.id]) : ''}" placeholder="0" aria-label="Giá nhập ${esc(r.name)}"></div>
          <div class="r num" data-lp>${lineProfit(r)}</div></div>`).join('') || '<div class="empty">Báo giá chưa có hạng mục.</div>'}
      </div>
      ${chgs.length ? `<div class="field"><span class="lbl">Chi phí cho phát sinh đã xác nhận</span>${chgs.map(g => `<div class="cost-row two"><div><b>${esc(g.title)}</b><span class="sub">${g.sign < 0 ? '−' : '+'}${money(g.amount)} đ</span></div><div><input class="in num" data-money data-chgcost="${g.id}" inputmode="numeric" autocomplete="off" value="${work.chg[g.id] ? money(work.chg[g.id]) : ''}" placeholder="0" aria-label="Chi phí phát sinh ${esc(g.title)}"></div></div>`).join('')}</div>` : ''}
      <div class="fgrid"><div class="field cost-ship"><label for="cost-ship">Chi phí vận chuyển cả đơn</label>${moneyInput('cost-ship', work.ship, 'placeholder="0"')}</div></div>
      <label class="check"><input type="checkbox" id="cost-tocat" checked> Lưu giá nhập vào danh mục mẫu (hạng mục trùng tên) để lần sau tự điền</label>`,
    foot: `<button class="btn" data-sa="close">Hủy</button><button class="btn primary" data-sa="save">${ic('check')}Lưu</button>`,
    onMount: el => {
      el.addEventListener('input', e => {
        const t = e.target;
        if (t.dataset.cost) { work.rows[t.dataset.cost] = parseMoney(t.value); const r = rows.find(x => x.id === t.dataset.cost); const lp = t.closest('[data-crow]').querySelector('[data-lp]'); if (r && lp) lp.innerHTML = lineProfit(r); }
        else if (t.dataset.chgcost) work.chg[t.dataset.chgcost] = parseMoney(t.value);
        else if (t.id === 'cost-ship') work.ship = parseMoney(t.value);
        else return;
        el.querySelector('#cost-sum').innerHTML = sumHtml();
      });
      setTimeout(() => softFocus(el.querySelector('[data-cost]') || el.querySelector('#cost-ship')), 60);
    },
    onClick: (a, b, el2) => {
      if (a !== 'save') return;

        let n = 0;

      }
      closeSheet(el2); render(); toast('Đã lưu giá nhập và vận chuyển');
    },
  });
  return el;
}

/* khi dòng báo giá đổi mã (sửa bản mới, sao chép): mang giá nhập theo */
function carryRowCosts(fromOid, toOid, idMap) {
  const c = Store.get('costs', 'o_' + fromOid); if (!c || !c.rows) return;
  const rows = {}, kc = {}; for (const [a, b] of Object.entries(idMap)) { if (c.rows[a] != null) rows[b] = c.rows[a]; if (c.kc && c.kc[a] != null) kc[b] = c.kc[a]; }
  if (Object.keys(rows).length) saveCostDoc(toOid, { rows, kc }, 0);
}

/* thống kê lãi theo ngày chốt */
function profitStats(closed) {
  let rev = 0, cost = 0, missing = 0;
  const list = closed.map(o => { const p = profitOf(o, headQuote(o)); rev += p.rev; cost += p.cost; if (p.missing) missing++; return { o, p }; });
  return { rev, cost, profit: rev - cost, pct: rev ? (rev - cost) / rev * 100 : 0, missing, list };
}

function guessGroup(name) {
  const n = String(name || '').trim().toLowerCase(); if (!n) return 'Khác';
  if (LIB_GROUP.has(n)) return LIB_GROUP.get(n);
  for (const [re, g] of GUESS) if (re.test(n)) return g;
  return 'Khác';
}
const catGroup = c => (c.group && GROUPS.includes(c.group) ? c.group : guessGroup(c.name));
function addLibrary(only) {
  const have = new Set(Store.list('catalog').map(c => c.name.trim().toLowerCase()));
  let n = 0, i = 0;
  for (const [group, name, material, unit] of LIBRARY) {
    if (only && !only.includes(group)) continue;
    if (have.has(name.toLowerCase())) continue;
    Store.put('catalog', { id: uid('k'), name, material, unit, price: 0, group, lib: true }, 40 + (i++) * 60);
    n++;
  }
  return n;
}
function librarySheet() {
  const have = new Set(Store.list('catalog').map(c => c.name.trim().toLowerCase()));
  const per = g => LIBRARY.filter(x => x[0] === g && !have.has(x[1].toLowerCase())).length;

  const total = groups.reduce((s, g) => s + per(g), 0);

    title: 'Bộ hạng mục chuẩn nghề nội thất', cls: 'wide',

const roundK = v => Math.max(0, Math.round(v / 1000) * 1000);

  const groups = GROUPS.filter(g => Store.list('catalog').some(c => catGroup(c) === g));
  const pick = el => {
    const g = el.querySelector('#bp-group').value, kw = fold(el.querySelector('#bp-kw').value.trim());

  };
  const el = openSheet({
    title: 'Đổi giá hàng loạt',
    html: `<p class="muted">Dùng khi giá vật liệu thay đổi. VD: ván MDF tăng 5% → chọn “Vật liệu có chữ: MDF”, nhập 5.</p>
      <div class="fgrid">
        <div class="field"><label for="bp-group">Nhóm hạng mục</label><select class="in" id="bp-group"><option value="">Tất cả nhóm</option>${groups.map(g => `<option>${esc(g)}</option>`).join('')}</select></div>
        <div class="field"><label for="bp-kw">Tên / vật liệu có chữ</label><input class="in" id="bp-kw" placeholder="VD: MDF, Acrylic, tủ bếp" autocomplete="off"></div>
        <div class="field"><label for="bp-pct">Tăng (+) / giảm (−) bao nhiêu %</label><input class="in num" id="bp-pct" inputmode="decimal" placeholder="VD: 5 hoặc -3" autocomplete="off"></div>
      </div>
      <div class="field"><span class="lbl">Áp dụng cho</span><div class="seg" id="bp-what"><button data-sa="w" data-v="both" aria-pressed="true">Giá bán và giá nhập</button><button data-sa="w" data-v="price" aria-pressed="false">Chỉ giá bán</button><button data-sa="w" data-v="cost" aria-pressed="false">Chỉ giá nhập</button></div></div>
      <div class="calcline" id="bp-prev"></div>
      <p class="muted" style="font-size:14px">Làm tròn đến 1.000 đ. Báo giá và đơn cũ <b>không tự đổi</b>; sau khi đổi giá, app sẽ chỉ ra các báo giá đang dùng giá cũ để bạn chọn cập nhật.</p>`,
    foot: `<button class="btn" data-sa="close">Hủy</button><button class="btn primary" data-sa="ok">Áp dụng</button>`,
    onMount: el => {
      const prev = () => {
        const list = pick(el), pct = parseFloat(String(el.querySelector('#bp-pct').value).replace(',', '.')) || 0;
        const withPrice = list.filter(c => c.price > 0 || catCost(c.id) > 0).length;
        el.querySelector('#bp-prev').innerHTML = `${list.length} hạng mục khớp · ${withPrice} mục đã có giá${pct ? ` · <b>${pct > 0 ? '+' : ''}${QF.format(pct)}%</b>` : ''}`;
      };
      el._prev = prev; el.addEventListener('input', prev); el.addEventListener('change', prev); prev();
    },
    onClick: async (a, b, el2) => {
      if (a === 'w') { segPick(b); return; }
      if (a !== 'ok') return;
      const pct = parseFloat(String(el2.querySelector('#bp-pct').value).replace(',', '.')) || 0;
      if (!pct || pct <= -100) { toast('Nhập số % tăng hoặc giảm.', 'bad'); return; }
      const what = el2.querySelector('#bp-what [aria-pressed=true]').dataset.v, list = pick(el2);
      const doCost = what !== 'price' && canCost(), doPrice = what !== 'cost';
      let n = 0, i = 0; const k = 1 + pct / 100, at = new Date().toISOString();
      for (const c of list) {
        let changed = false;
        if (doPrice && c.price > 0) { Store.put('catalog', { ...c, price: roundK(c.price * k), priceAt: at }, 40 + (i++) * 60); changed = true; }
        if (doCost && catCost(c.id) > 0) { setCatCost(c.id, roundK(catCost(c.id) * k), 40 + (i++) * 60); changed = true; }
        if (changed) n++;
      }
      closeSheet(el2); render();
      const g = el2.querySelector('#bp-group').value, kw = el2.querySelector('#bp-kw').value.trim();
      saveMeta({ priceLog: [...(meta().priceLog || []).slice(-29), { at, pct, what, scope: [g || 'Tất cả nhóm', kw && `“${kw}”`].filter(Boolean).join(' · '), n }] });
      toast(`Đã đổi giá ${n} hạng mục (${pct > 0 ? '+' : ''}${QF.format(pct)}%)`);
      setTimeout(() => { if (staleOrders().length) staleListSheet(); }, 400);
    },
  });
  return el;
}

function prevRange(from, to) { const n = daysBetween(from, to) + 1; return [addDays(from, -n), addDays(from, -1)]; }

/* chia doanh thu trong kỳ theo nhóm hạng mục, khớp đúng tổng doanh thu */

    let ov = 0;
    o.versions.forEach((v, i) => {
      if (!inR(v.closedAt)) return;
      const cur = verGroups(v), prev = i ? verGroups(o.versions[i - 1]) : new Map();
      for (const g of new Set([...cur.keys(), ...prev.keys()])) add(groups, g, (cur.get(g) || 0) - (prev.get(g) || 0));
      ov += v.total - (i ? o.versions[i - 1].total : 0);
    });
    for (const c of (o.changes || []).filter(x => x.status === 'confirmed' && inR(x.confirmedAt))) { add(groups, 'Phát sinh', changeSigned(c)); ov += changeSigned(c); }
    let paid = 0; for (const p of o.payments || []) if (inR(p.date)) paid += p.amount;
    if (ov || paid) {
      const c = cust.get(name) || { name, rev: 0, paid: 0, n: 0, phone: headQuote(o).customer?.phone || '' };
      c.rev += ov; c.paid += paid; if (ov) c.n++; cust.set(name, c);

    const bar = (v, x, cls) => { const h = Math.max(0, v) / max * ch; return `<rect class="bar ${cls} ${out ? 'out' : ''}" x="${x}" y="${T + ch - h}" width="${barW}" height="${Math.max(h, v ? 2 : 0)}" rx="3"/>`; };

function openPalette() {
  if (document.querySelector('.sheet.palette')) return;
  let res = [], sel = 0;
  const el = openSheet({
    title: 'Tìm nhanh', cls: 'palette',

    onMount: el => {
      const inp = el.querySelector('#pal-q'), list = el.querySelector('#pal-list');
      const draw = () => {
        res = paletteResults(inp.value); sel = Math.min(sel, Math.max(0, res.length - 1));
        let last = '';
        list.innerHTML = res.length ? res.map((r, i) => `${r.sec !== last ? `<div class="pal-sec">${esc((last = r.sec))}</div>` : ''}<button class="pal-it" role="option" data-sa="pick" data-i="${i}" aria-selected="${i === sel}">${ic(r.icon || 'info')}<span><b>${esc(r.label)}</b>${r.sub ? `<small>${esc(r.sub)}</small>` : ''}</span></button>`).join('') : `<div class="empty">Không tìm thấy “${esc(inp.value)}”.</div>`;
        const s = list.querySelector('[aria-selected=true]'); if (s) s.scrollIntoView({ block: 'nearest' });
      };
      inp.addEventListener('input', () => { sel = 0; draw(); });
      inp.addEventListener('keydown', e => {
        if (e.key === 'ArrowDown') { e.preventDefault(); sel = Math.min(res.length - 1, sel + 1); draw(); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); sel = Math.max(0, sel - 1); draw(); }
        else if (e.key === 'Enter') { e.preventDefault(); const r = res[sel]; if (r) { closeSheet(el); r.run(); } }
      });
      draw(); inp.focus(); setTimeout(() => { if (document.activeElement !== inp) inp.focus(); }, 30);
    },

  });
  return el;
}

const CASH_OUT = ['Vật tư, ván', 'Phụ kiện, thiết bị', 'Nhân công, thợ', 'Thuê ngoài, gia công', 'Vận chuyển', 'Quảng cáo', 'Lương', 'Thuê xưởng, mặt bằng', 'Điện, nước, xăng', 'Dụng cụ, máy móc', 'Tiếp khách', 'Chi khác'];
const CASH_IN = ['Thu khác', 'Bán phế liệu', 'Góp vốn, vay'];
const CUST_CAT = 'Tiền khách trả';
const CASH_IC = { 'Vật tư, ván': 'book', 'Phụ kiện, thiết bị': 'ruler', 'Nhân công, thợ': 'user', 'Thuê ngoài, gia công': 'user', 'Vận chuyển': 'orders', 'Quảng cáo': 'stats', 'Lương': 'user', 'Thuê xưởng, mặt bằng': 'lock', 'Điện, nước, xăng': 'info', 'Dụng cụ, máy móc': 'ruler', 'Tiếp khách': 'note', [CUST_CAT]: 'money' };
const canCash = () => can('cash') && feat('cash');

/* mọi khoản thu chi trong kỳ (gồm tiền khách trả trong đơn) */
function cashList(from, to) {
  const inR = d => (!from || d >= from) && (!to || d <= to);
  const out = [];
  for (const e of Store.list('cash')) if (e && e.date && inR(e.date)) out.push({ ...e, src: 'cash' });
  for (const o of Store.list('orders')) for (const p of o.payments || []) if (inR(p.date)) {
    out.push({ id: 'p_' + p.id, src: 'pay', type: 'in', date: p.date, amount: Number(p.amount) || 0, cat: CUST_CAT, note: (headQuote(o).customer?.name || '') + (p.note ? ' · ' + p.note : ''), oid: o.id, method: p.method, createdAt: p.createdAt });
  }
  return out.sort((a, b) => b.date.localeCompare(a.date) || String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
}
function cashSum(list) {
  let i = 0, ic = 0, o = 0; const cats = new Map();
  for (const e of list) {
    if (e.type === 'out') { o += e.amount; cats.set(e.cat, (cats.get(e.cat) || 0) + e.amount); }
    else { i += e.amount; if (e.src === 'pay') ic += e.amount; }
  }
  return { in: i, inCust: ic, inOther: i - ic, out: o, net: i - o, cats: [...cats].map(([g, v]) => ({ g, v })).sort((a, b) => b.v - a.v) };
}
const orderSpendList = oid => Store.list('cash').filter(e => e.oid === oid && e.type === 'out').sort((a, b) => b.date.localeCompare(a.date));
const orderSpend = oid => orderSpendList(oid).reduce((s, e) => s + (Number(e.amount) || 0), 0);

/* =========================================================
   CỘNG SỔ THEO THÁNG
   Sổ quỹ: tồn đầu tháng + thu − chi = tồn cuối tháng
   Lãi tháng = thu (không tính tiền góp vốn, đi vay) − chi; tỷ suất lãi = lãi / thu
   Bảng phụ: lãi theo đơn chốt = doanh thu − chi phí đơn − chi chung + thu khác
   Chốt sổ: lưu số liệu lúc chốt; sửa khoản trong tháng đã chốt phải xác nhận
   ========================================================= */
const canPL = () => canCash() || canCost();
const CAPITAL_CAT = 'Góp vốn, vay';
const ym = d => String(d || '').slice(0, 7);
const ymLabel = m => { const [y, mm] = String(m).split('-'); return `Tháng ${+mm}/${y}`; };
const ymShort = m => { const [y, mm] = String(m).split('-'); return `T${+mm}/${String(y).slice(2)}`; };
function monthsBack(n) {
  const d = new Date(), out = [];
  for (let i = n - 1; i >= 0; i--) { const x = new Date(d.getFullYear(), d.getMonth() - i, 1); out.push(`${x.getFullYear()}-${pad2(x.getMonth() + 1)}`); }
  return out;
}
function plMonthsRange() {
  const R = S.plR || 'last12', y = new Date().getFullYear(), cur = today().slice(0, 7);
  if (R === 'year') return Array.from({ length: 12 }, (_, i) => `${y}-${pad2(i + 1)}`).filter(m => m <= cur);
  if (R === 'prev') return Array.from({ length: 12 }, (_, i) => `${y - 1}-${pad2(i + 1)}`);
  return monthsBack(12);
}
const cashStart = () => meta().cashStart || null;
const books = () => meta().books || {};

  for (const o of Store.list('orders')) {

        waits.push(listen(q,
          snap => { out[c] = snap.docs.map(d => ({ ...d.data(), id: d.id })); },
          ch => Store.applyRemote(c, ch.doc.id, ch.type === 'removed' ? null : { ...ch.doc.data(), id: ch.doc.id })));
      }
      /* danh sách người trong xưởng */
      waits.push(listen(T.col('members'),
        snap => { T.members = new Map(snap.docs.map(d => [d.id, { ...d.data(), uid: d.id }])); },
        ch => { if (ch.type === 'removed') T.members.delete(ch.doc.id); else T.members.set(ch.doc.id, { ...ch.doc.data(), uid: ch.doc.id }); scheduleRender(); }));
      if (T.role === 'owner') {
        waits.push(listen(T.col('invites').where('used', '==', false),
          snap => { T.invites = new Map(snap.docs.map(d => [d.id, d.data()])); },
          ch => { if (ch.type === 'removed') T.invites.delete(ch.doc.id); else T.invites.set(ch.doc.id, ch.doc.data()); scheduleRender(); }));
      }
      if (T.role !== 'worker') {
        let cq = T.col('conflicts');
        if (T.role === 'sale') cq = cq.where('by', '==', T.uid());
        waits.push(listen(cq,
          snap => { T.conflicts = new Map(snap.docs.map(d => [d.id, d.data()])); },
          ch => { if (ch.type === 'removed') T.conflicts.delete(ch.doc.id); else T.conflicts.set(ch.doc.id, ch.doc.data()); scheduleRender(); }));
      } else {
        waits.push(listen(T.col('jobs').where('assignees', 'array-contains', T.uid()),
          snap => { T.jobs = new Map(snap.docs.map(d => [d.id, d.data()])); },
          ch => { if (ch.type === 'removed') T.jobs.delete(ch.doc.id); else T.jobs.set(ch.doc.id, ch.doc.data()); scheduleRender(); }));
      }
      await Promise.all(waits);
      return out;
    },
    async set(c, id, doc, base) {
      const ref = T.col(c).doc(id);
      const lock = T.role === 'sale' ? ['payments'] : [];
      let out = null, conflicts = [], theirsDoc = null;
      try {
        await withTimeout(T.db.runTransaction(async tx => {
          const snap = await tx.get(ref);
          const theirs = snap.exists ? snap.data() : null;
          theirsDoc = theirs; conflicts = [];
          let merged;
          if (!theirs) merged = JSON.parse(JSON.stringify(doc));
          else { const r = mergeDoc(base || {}, doc, theirs, lock); merged = r.doc; conflicts = r.conflicts; }
          if (c === 'orders') {
            fixNumbers(merged, theirs);
            if (!merged.owner) merged.owner = (theirs && theirs.owner) || T.uid();
            if (merged.codeTemp) {
              const stem = String(merged.code || '').replace(/T[A-Z0-9]*$/, '');
              const cref = T.col('counters').doc(stem.replace(/-$/, '') || 'BG');
              const cs = await tx.get(cref);
              let n;
              if (cs.exists) n = (cs.data().n || 0) + 1;
              else n = Store.list('orders').reduce((mx, o) => (o.code && o.code.startsWith(stem) && !o.codeTemp ? Math.max(mx, parseInt(o.code.slice(stem.length), 10) || 0) : mx), 0) + 1;
              tx.set(cref, { n });
              merged.code = stem + pad2(n); delete merged.codeTemp;
            }
          }
          if (c === 'customers' && !merged.owner) merged.owner = (theirs && theirs.owner) || T.uid();
          merged.rev = ((theirs && theirs.rev) || 0) + 1;
          merged.updatedBy = T.uid(); merged.updatedByName = T.myName();
          if (!merged.updatedAt) merged.updatedAt = new Date().toISOString();
          delete merged.id;
          tx.set(ref, merged);
          out = { ...merged, id };
        }), 20000);
      } catch (e) { throw fbErr(e); }
      if (conflicts.length) T.saveConflict(c, id, conflicts, doc, theirsDoc || {});
      if (c === 'orders') T.writeJob(out);
      return { doc: out };
    },
    async del(c, id) {
      try { await withTimeout(T.col(c).doc(id).delete(), 15000); } catch (e) { throw fbErr(e); }
      if (c === 'orders') { try { await T.col('jobs').doc(id).delete(); } catch (e) { /* bỏ qua */ } }
    },
    async putFile(blob, type, o) {
      const data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1] || ''); r.onerror = rej; r.readAsDataURL(blob); });
      const CH = 700000, parts = Math.max(1, Math.ceil(data.length / CH)), ref = uid('f');
      const b = T.db.batch();
      for (let i = 0; i < parts; i++) b.set(T.col('files').doc(`${ref}_${i}`), { ref, i, n: parts, type, oid: o ? o.id : '', owner: (o && o.owner) || T.uid(), data: data.slice(i * CH, (i + 1) * CH) });
      try { await withTimeout(b.commit(), 60000); } catch (e) { throw fbErr(e); }
      return { ref, parts };
    },
    async putBlob(k, b) { (await getLocal()).putBlob(k, b); },
    async getBlob(ref, att) {
      if (!att || att.store !== 'fs') return (await getLocal()).getBlob(ref);
      const docs = await Promise.all(Array.from({ length: att.parts || 1 }, (_, i) => T.col('files').doc(`${ref}_${i}`).get()));
      if (docs.some(d => !d.exists)) return null;
      const s = docs.map(d => d.data().data).join(''), type = docs[0].data().type || 'image/jpeg';
      const bin = atob(s), u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      return new Blob([u8], { type });
    },
    async delBlob(ref, att) {
      if (!att || att.store !== 'fs') return (await getLocal()).delBlob(ref);
      for (let i = 0; i < (att.parts || 1); i++) { try { await T.col('files').doc(`${ref}_${i}`).delete(); } catch (e) { /* bỏ qua */ } }
    },
  };
}

/* ---------- thao tác ---------- */
const errText = e => {
  const c = (e && e.code) || '';
  if (e && e.msg) return e.msg;
  if (/invalid-email/.test(c)) return 'Email không đúng dạng.';
  if (/user-not-found|wrong-password|invalid-credential|invalid-login/.test(c)) return 'Sai email hoặc mật khẩu.';
  if (/email-already-in-use/.test(c)) return 'Email này đã có tài khoản. Bấm Đăng nhập.';
  if (/weak-password/.test(c)) return 'Mật khẩu cần ít nhất 6 ký tự.';
  if (/too-many-requests/.test(c)) return 'Thử sai nhiều lần. Đợi vài phút rồi thử lại.';
  if (/permission-denied|permission/.test(c)) return 'Không có quyền làm việc này.';
  if (/network|unavailable/.test(c)) return 'Mất mạng. Kiểm tra mạng rồi thử lại.';
  return 'Chưa làm được. Thử lại sau.';
};
function gateErr(msg) { S.tmErr = msg; const el = $('#tm-err'); if (el) { el.hidden = !msg; el.textContent = msg; } }
async function inviteShare(code) {
  const text = `Mời bạn vào Sổ Nội Thất (${ROLES[Team.invites.get(code)?.role] || ''}).\n1. Mở link bằng Safari, bấm Chia sẻ → Thêm vào MH chính: ${location.origin + location.pathname}\n2. Mở app → Cài đặt → “Tôi là nhân viên – dán mã mời”, dán mã dưới đây.\n\n${packInvite(Team.cfg, Team.wid, code)}\n\nMã ngắn: ${code} (hết hạn sau 7 ngày, dùng 1 lần)`;
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { if (e && e.name === 'AbortError') return; }
  try { await navigator.clipboard.writeText(text); toast('Đã chép lời mời. Dán vào Zalo để gửi.'); }
  catch (e) { openSheet({ title: 'Lời mời', html: `<textarea class="in" rows="8" readonly>${esc(text)}</textarea><p class="muted">Chọn hết rồi chép, dán vào Zalo.</p>` }); }
}

function teamChange(el) {
  if (el.dataset && el.dataset.mrole) {

    Team.setMember(el.dataset.mrole, { role: el.value }).then(() => toast(`${m ? m.name : ''}: ${ROLES[el.value]}`)).catch(er => { toast(errText(er), 'bad'); render(); });
    return true;
  }
  if (el.id === 'as-owner') { const o = curOrder(); if (!o || !el.value) return true; const m = Team.members.get(el.value); o.owner = el.value; addLog(o, 'Chuyển phụ trách cho ' + (m ? m.name : '')); touchOrder(o, 0); return true; }

(function readInviteHash() {
  const m = location.hash.match(/moi=(SNT1\.[A-Za-z0-9_-]+)/); if (!m) return;

  'add-att': () => { const i = $('#att-input'); i && i.click(); },
  'open-att': b => { const o = curOrder(), a = o?.attachments.find(x => x.id === b.dataset.id); a && openAttachment(o, a); },
  'focus-note': () => { openSect('notes'); const n = $('#note-in'); if (n) { n.scrollIntoView({ block: 'center', behavior: 'smooth' }); setTimeout(() => n.focus(), 250); } },
  'add-note': () => {
    const o = curOrder(), n = $('#note-in'); if (!o || !n) return;
    const t = n.value.trim(); if (!t) { toast('Hãy nhập nội dung ghi chú.', 'bad'); n.focus(); return; }
    o.notes.push({ id: uid('n'), text: t, at: new Date().toISOString() }); touchOrder(o, 0); render(); toast('Đã thêm ghi chú');
  },
  'del-note': async b => {
    const o = curOrder(); if (!o) return;
    const ok = await confirmBox({ title: 'Xóa ghi chú?', text: 'Ghi chú này sẽ bị xóa.', ok: 'Xóa', danger: true });
    if (!ok) return; o.notes = o.notes.filter(x => x.id !== b.dataset.id); touchOrder(o, 0); render();
  },
  period: b => { S.period = b.dataset.p; render(); },
  drill: b => drillSheet(b.dataset.d),
  bar: b => drillSheet('month', { m: b.dataset.m }),
  'cat-tab': b => { S.catTab = b.dataset.t; S.catQ = ''; render(); },
  'cat-add': () => {
    const c = { id: uid('k'), name: '', material: '', unit: 'm²', price: 0, group: S.catGroup || 'Khác', new: Date.now() };
    Store.put('catalog', c, 0); S.catQ = ''; render(); setTimeout(() => { const el = document.getElementById('cn-' + c.id); el && el.focus(); }, 50);
  },
  'cat-del': async b => {
    const c = Store.get('catalog', b.dataset.id); if (!c) return;
    const ok = await confirmBox({ title: 'Xóa hạng mục mẫu?', text: `Xóa “${esc(c.name || 'hạng mục chưa đặt tên')}” khỏi danh mục. Các báo giá đã lập không bị ảnh hưởng.`, ok: 'Xóa', danger: true });
    if (!ok) return; Store.del('catalog', c.id); render();
  },
  'cus-add': () => {
    const c = { id: uid('c'), name: '', phone: '', address: '', createdAt: new Date().toISOString(), new: Date.now() };
    Store.put('customers', c, 0); S.catQ = ''; render(); setTimeout(() => { const el = document.getElementById('kn-' + c.id); el && el.focus(); }, 50);
  },
  'cus-del': async b => {
    const c = Store.get('customers', b.dataset.id); if (!c) return;
    const ok = await confirmBox({ title: 'Xóa khách hàng?', text: `Xóa “${esc(c.name || 'khách chưa đặt tên')}” khỏi danh sách. Các đơn của khách vẫn giữ nguyên.`, ok: 'Xóa', danger: true });
    if (!ok) return; Store.del('customers', c.id); render();
  },
  'logo-del': () => { saveSettings({ logo: '' }); render(); },
  backup: () => backupJson(),
  'plan-add': b => {
    const ctx = planCtx(b); if (!ctx) return;
    const p = ctx.plan.slice(); p.splice(Math.max(0, p.length - 1), 0, { id: uid('d'), label: '', pct: 0, trigger: 'date' });
    ctx.plan = p; rerenderPlan(ctx);
    setTimeout(() => softFocus(ctx.box.querySelector(`#pl-${p[Math.max(0, p.length - 2)].id}`)), 30);
  },
  'plan-del': async b => {
    const ctx = planCtx(b); if (!ctx) return;
    const r = ctx.plan.find(x => x.id === b.dataset.id); if (!r || ctx.plan.length <= 1) return;
    const ok = await confirmBox({ title: 'Xóa đợt thanh toán?', text: `Xóa “${esc(r.label || 'đợt chưa đặt tên')}” khỏi lịch. Đợt cuối sẽ tự nhận phần tiền còn lại.`, ok: 'Xóa đợt', danger: true });
    if (!ok) return; ctx.plan = ctx.plan.filter(x => x.id !== r.id); rerenderPlan(ctx);
  },
  'plan-tpl': async b => {
    const ctx = planCtx(b); if (!ctx) return;
    if (ctx.plan && ctx.plan.length) {
      const ok = await confirmBox({ title: ctx.scope === 'tpl' ? 'Khôi phục lịch mặc định?' : 'Thay bằng lịch mẫu?', text: ctx.scope === 'tpl' ? 'Mẫu sẽ về 3 đợt: 50% khi ký, 40% khi bắt đầu lắp đặt, phần còn lại sau nghiệm thu.' : 'Lịch thanh toán hiện tại của báo giá này sẽ được thay bằng lịch mẫu trong Cài đặt.', ok: 'Đồng ý' });
      if (!ok) return;
    }
    ctx.plan = ctx.scope === 'tpl' ? newPlan(DEFAULT_PLAN) : newPlan(); rerenderPlan(ctx);
  },
  'plan-edit': () => { const o = curOrder(); o && planEditSheet(o); },
  'plan-qr': b => { const o = curOrder(), r = planStatus(o).find(x => String(x.n) === b.dataset.n); r && qrSheet(o, r); },
  'plan-pay': b => { const o = curOrder(), r = planStatus(o).find(x => String(x.n) === b.dataset.n); r && paySheet(o, r); },
  receipt: b => {
    const o = curOrder(), p = o?.payments.find(x => x.id === b.dataset.id); if (!p) return;
    menuSheet('Phiếu thu ' + receiptNo(o, p), [
      { label: 'Xuất ảnh PNG (gửi Zalo)', icon: 'image', run: () => exportDoc(() => renderReceipt(o, p), 'png') },
      { label: 'Xuất PDF', icon: 'dl', run: () => exportDoc(() => renderReceipt(o, p)) },
    ]);
  },
  handover: () => {
    const o = curOrder(); if (!o) return;
    if (!o.handover) { handoverSheet(o); return; }
    menuSheet('Nghiệm thu, bàn giao', [
      { label: 'Xuất biên bản PDF', icon: 'dl', run: () => exportDoc(() => renderHandover(o)) },
      { label: 'Xuất biên bản ảnh PNG', icon: 'image', run: () => exportDoc(() => renderHandover(o), 'png') },
      { label: 'Làm lại biên bản', icon: 'edit', run: () => handoverSheet(o) },
    ]);
  },
  'handover-pdf': () => { const o = curOrder(); o?.handover && exportDoc(() => renderHandover(o)); },
  'handover-png': () => { const o = curOrder(); o?.handover && exportDoc(() => renderHandover(o), 'png'); },
  'sign-version': b => { const o = curOrder(), v = o?.versions.find(x => String(x.no) === b.dataset.v); v && signVersionSheet(o, v); },
  'qr-test': () => {
    const st = settings();
    const payload = vietQRPayload({ bin: st.bankBin, account: String(st.bankAccount).replace(/\s/g, ''), amount: 10000, memo: qrMemo(`${st.memoPrefix || ''} THU QR`) });
    openSheet({
      title: 'Thử mã QR 10.000 đ',
      html: `<div class="qrbox"><div id="qr-canvas"></div><p>Quét bằng app ngân hàng của bạn. Nếu app hiện đúng tên chủ tài khoản <b>${esc(st.bankHolder || '')}</b> và số tiền 10.000 đ là mã đã đúng.</p></div>`,
      foot: `<button class="btn primary" data-sa="close">Xong</button>`,
      onMount: el => { const cv = QR.toCanvas(QR.encode(payload), 720); cv.className = 'qrimg'; el.querySelector('#qr-canvas').appendChild(cv); },
    });
  },
};
Object.assign(ACTIONS, TEAM_ACTIONS);

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const fn = ACTIONS[b.dataset.act];
  if (fn) { e.preventDefault(); fn(b, e); }
});
document.addEventListener('click', e => {
  const inp = e.target.closest('.datefield input');
  if (inp && typeof inp.showPicker === 'function') { try { inp.showPicker(); } catch (er) { /* trình duyệt tự mở */ } }
});

/* định dạng ô tiền khi gõ, giữ vị trí con trỏ */
function formatMoneyInput(el) {
  const pos = el.selectionStart ?? el.value.length;
  const digitsRight = el.value.slice(pos).replace(/\D/g, '').length;
  const v = parseMoney(el.value);
  const nv = el.value.replace(/\D/g, '') ? money(v) : '';
  if (nv === el.value) return;
  el.value = nv;
  let p = nv.length, cnt = 0;
  while (p > 0 && cnt < digitsRight) { p--; if (/\d/.test(nv[p])) cnt++; }
  if (digitsRight === 0) p = nv.length;
  try { el.setSelectionRange(p, p); } catch (er) { /* bỏ qua */ }
}
document.addEventListener('input', e => {
  const el = e.target;
  if (el.matches('[data-money]') || (el.id === 'disc-val' && curOrder()?.draft?.discount?.type !== 'percent')) formatMoneyInput(el);
  if (el.matches('.datefield input')) { const t = el.parentElement.querySelector('[data-dftext]'); if (t) t.textContent = el.value ? fmtDate(el.value) : 'Chọn ngày'; }
  if (el.dataset.pf) { planInput(el); return; }
  if (el.closest('.editor')) { onEditorInput(e); return; }
  if (el.id === 'order-search') { S.q = el.value; const c = $('#cards'); if (c) c.innerHTML = renderCards(); return; }
  if (el.id === 'cat-search') { S.catQ = el.value; clearTimeout(window._catT); window._catT = setTimeout(() => { const pos = el.selectionStart; render(); const n = $('#cat-search'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { /* */ } } }, 350); return; }
  if (el.dataset.kc) { setCatCost(el.dataset.kc, parseMoney(el.value)); return; }
  if (el.dataset.cf) { const row = el.closest('[data-cat]'), c = Store.get('catalog', row.dataset.cat); if (!c) return; const v = el.dataset.cf === 'price' ? parseMoney(el.value) : el.value; Store.put('catalog', { ...c, [el.dataset.cf]: v, ...(el.dataset.cf === 'price' && c.price ? { priceAt: new Date().toISOString() } : {}) }); return; }
  if (el.dataset.kf) { const row = el.closest('[data-cus]'), c = Store.get('customers', row.dataset.cus); if (!c) return; Store.put('customers', { ...c, [el.dataset.kf]: el.value }); return; }
  if (el.dataset.sf) {
    saveSettings({ [el.dataset.sf]: el.value });
    if (['bankBin', 'bankAccount', 'memoPrefix', 'codePrefix'].includes(el.dataset.sf)) { const q = $('#qrtest'); if (q) q.innerHTML = qrTestHtml(); }
    return;
  }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (teamChange(el)) return;
  if (el.dataset && el.dataset.feat) { saveSettings({ features: { ...(settings().features || {}), [el.dataset.feat]: el.checked } }); render(); toast((el.checked ? 'Đã bật: ' : 'Đã tắt: ') + (FEATS.find(f => f[0] === el.dataset.feat) || [])[1]); return; }
  if (el.dataset.due) {
    const o = curOrder(), r = o?.plan?.find(x => x.id === el.dataset.due); if (!r) return;
    r.due = el.value || ''; const n = o.plan.indexOf(r) + 1;
    addLog(o, r.due ? `Đặt hạn thu đợt ${n}: ${fmtDate(r.due)}` : `Bỏ hạn thu đợt ${n}`); touchOrder(o, 0); render(); return;
  }
  if (el.dataset.pf) return;
  if (el.closest('.editor') && (el.tagName === 'SELECT' || el.type === 'date')) { onEditorInput(e); return; }
  if (el.dataset.cf && el.tagName === 'SELECT') { const row = el.closest('[data-cat]'), c = Store.get('catalog', row.dataset.cat); c && Store.put('catalog', { ...c, unit: el.value }, 0); return; }
  if (el.id === 'st-from' || el.id === 'st-to') { if (el.value) { S[el.id === 'st-from' ? 'from' : 'to'] = el.value; render(); } return; }
  if (el.id === 'att-input') { const o = curOrder(); if (o && el.files.length) addAttachments(o, el.files); el.value = ''; return; }
  if (el.id === 'logo-in') { if (el.files[0]) setLogo(el.files[0]); el.value = ''; return; }
  if (el.id === 'restore-in') { if (el.files[0]) restoreJson(el.files[0]); el.value = ''; return; }
});
document.addEventListener('focusout', e => {
  const el = e.target;
  if (el.dataset && el.dataset.rf === 'qty') { const v = parseQty(el.value); el.value = v ? fmtQty(v) : ''; }
  if (el.id === 'disc-val' && curOrder()?.draft?.discount?.type === 'percent') { const v = parseQty(el.value); el.value = v ? QF.format(Math.min(v, 100)) : ''; }
});
document.addEventListener('keydown', e => {
  const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName);
  const mod = e.metaKey || e.ctrlKey;
  if (Store.mode !== 'loading' && !(Team.cfg && Team.state !== 'ready')) {
    if (mod && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); openPalette(); return; }
    if (!typing && !sheets.length && e.key === '/') { e.preventDefault(); openPalette(); return; }
    if (mod && (e.key === 'n' || e.key === 'N') && can('quote') && !sheets.length) { e.preventDefault(); newQuoteAction(); return; }
    const tabs = ['today', 'orders', 'stats', 'catalog', 'settings'];
    if (mod && /^[1-5]$/.test(e.key) && !(Team.on() && Team.role === 'worker')) { e.preventDefault(); const t = tabs[+e.key - 1]; if (t === 'catalog' && !can('catalog')) return; S.tab = t; if (S.view === 'edit') { Store.flushAll(); S.view = 'detail'; } render(); return; }
  }
  if (e.key === 'Escape' && sheets.length) closeSheet();
  if (e.key === 'Enter' && e.target.id === 'note-in') { e.preventDefault(); ACTIONS['add-note'](); }
});
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { Store.flushAll(); return; }
  if (Store.mode === 'team' && !document.hidden && Store.failed.size && navigator.onLine !== false) { Store.flushAll(); return; }
  if (Store.mode === 'cloud' && !Store.busy() && !Store.failed.size && !sheets.length && S.view !== 'edit' && Date.now() - Store.loadedAt > 15000) {
    Store.loadAll().then(render).catch(() => { /* giữ dữ liệu đang có */ });
  }
});
window.addEventListener('pagehide', () => Store.flushAll());
wideMQ.addEventListener('change', () => render());

/* ảnh đính kèm lưu trên máy: điền src sau khi vẽ */
function hydrate() {
  const o = curOrder(); if (!o) return;
  for (const img of $$('img[data-att]')) {
    const a = o.attachments.find(x => x.id === img.dataset.att); if (!a) continue;
    attSrc(a).then(u => { if (u) img.src = u; });
  }
}

async function boot() {
  S.loadError = ''; Store.mode = 'loading';
  if (ownSite && Team.readCfg()) { Team.start(); return; }
  render();
  let db = null;
  if (window.claude && typeof window.claude.use === 'function') {
    try { db = await Promise.race([window.claude.use('db'), sleep(11000).then(() => null)]); } catch (e) { db = null; }
    window.claude.use('assets').then(a => { caps.assets = a; if (S.orderId && Store.mode === 'cloud') render(); }).catch(() => { caps.assets = null; });
    window.claude.use('downloads').then(d => { caps.downloads = d; }).catch(() => { caps.downloads = null; });
  }
  if (db) { caps.db = db; Store.backend = cloudBackend(db); await Outbox.open(); }
  else {
    Store.backend = await localBackend();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* bỏ qua */ }
  }
  try {
    await withTimeout(Store.loadAll(), 25000);
    Store.mode = db ? 'cloud' : 'local';
    if (Store.mode === 'cloud') { const n = await Store.restoreOutbox(); if (n) setTimeout(() => toast(`Đã khôi phục ${n} thay đổi chưa gửi lên máy chủ`), 300); }
  } catch (e) {
    Store.mode = db ? 'cloud' : 'local';
    S.loadError = e && e.code === 'revoked' ? 'Bạn không còn quyền mở dữ liệu của app này.' : 'Không kết nối được tới nơi lưu dữ liệu. Kiểm tra mạng rồi bấm Thử lại.';
  }
  render();
  ensureFonts();
}
setInterval(() => { if (Store.failed.size && navigator.onLine !== false) Store.flushAll(); }, 15000);
window.addEventListener('online', () => { if (Store.failed.size) Store.flushAll(); updateSaveStatus(); });
window.addEventListener('offline', () => updateSaveStatus());
if (ownSite && 'serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === '127.0.0.1' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => { /* chạy bình thường không cần ngoại tuyến */ }); });
}
boot();

</script>
