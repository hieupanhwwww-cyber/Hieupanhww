<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sổ Nội Thất</title>
<meta name="description" content="Lập báo giá, chốt đơn và theo dõi thanh toán cho nội thất trọn gói">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sổ Nội Thất">
<meta name="theme-color" content="#F4EFE8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#17130F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap&subset=vietnamese">
<style>
:root{padding-top:env(safe-area-inset-top,0px)}html{box-sizing:border-box}body{margin:0;font-size:14px}img{max-width:100%}
:root{
  /* Bố cục: thanh điều hướng + danh sách đơn (trái) + chi tiết (phải) khi iPad ngang; tab dưới đáy khi dọc */
  --bg:#F4EFE8; --surface:#FFFFFF; --surface-2:#FAF6F0; --line:#E6DDD1; --line-2:#D5C8B8;
  --fg:#2A2119; --muted:#75685B; --accent:#7A4E2D; --accent-2:#5F3B1F; --accent-ink:#FFFFFF; --accent-soft:#F1E4D6;
  --ok:#2C7A4C; --ok-soft:#E2F1E7; --warn:#9C620C; --warn-soft:#FBEED6; --bad:#B03A29; --bad-soft:#F8E2DD; --info:#2E6590; --info-soft:#E0EBF5;
  --shadow:0 1px 2px rgba(70,45,20,.06),0 6px 20px rgba(70,45,20,.07); --paper:#FFFFFF; --ink-hint:#9A8C7D;
  --font:"Be Vietnam Pro",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --r:16px; --r-sm:11px;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17130F; --surface:#221C17; --surface-2:#2A231D; --line:#3A3028; --line-2:#4A3E33;
  --fg:#F2EBE2; --muted:#B4A696; --accent:#CF9A6E; --accent-2:#E2B48C; --accent-ink:#1B140E; --accent-soft:#3A2B1F;
  --ok:#6FC08F; --ok-soft:#1E3326; --warn:#E3B062; --warn-soft:#3A2D17; --bad:#EE8B78; --bad-soft:#3D221C; --info:#84B6DD; --info-soft:#1C2C3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --paper:#F7F3EE; --ink-hint:#8A7D70; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17130F; --surface:#221C17; --surface-2:#2A231D; --line:#3A3028; --line-2:#4A3E33;
  --fg:#F2EBE2; --muted:#B4A696; --accent:#CF9A6E; --accent-2:#E2B48C; --accent-ink:#1B140E; --accent-soft:#3A2B1F;
  --ok:#6FC08F; --ok-soft:#1E3326; --warn:#E3B062; --warn-soft:#3A2D17; --bad:#EE8B78; --bad-soft:#3D221C; --info:#84B6DD; --info-soft:#1C2C3A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); --paper:#F7F3EE; --ink-hint:#8A7D70; color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
p{margin:0}
.num,.money-v,.tab{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ic{width:22px;height:22px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- khung app ---------- */
.app{height:100%;display:flex}
.main{flex:1;min-width:0;height:100%;position:relative}
.rail{flex:none;display:flex;background:var(--surface);border-color:var(--line);z-index:20}
.rail .brand{font-weight:700;color:var(--accent);font-size:13px;line-height:1.15;text-align:center;letter-spacing:.02em}
.rail .navbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;color:var(--muted);font-size:12.5px;font-weight:600;border-radius:14px;min-height:60px}
.rail .navbtn[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
.rail .navbtn .ic{width:24px;height:24px}
.wide .rail{flex-direction:column;align-items:stretch;gap:6px;width:92px;padding:14px 8px;border-right:1px solid var(--line);padding-left:max(8px,env(safe-area-inset-left,0px))}
.wide .rail .brand{padding:6px 0 14px}
.wide .rail .rail-foot{margin-top:auto;font-size:11.5px;text-align:center;color:var(--muted)}
.narrow .rail{position:fixed;left:0;right:0;bottom:0;flex-direction:row;justify-content:space-around;border-top:1px solid var(--line);padding:6px var(--gut-r) calc(6px + env(safe-area-inset-bottom,0px)) var(--gut)}
.narrow .rail .brand,.narrow .rail .rail-foot{display:none}
.narrow .rail .navbtn{flex:1;max-width:160px;min-height:56px}
.narrow .main{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
.narrow.norail .main{padding-bottom:0}
.oc-money>div{min-width:0}

.split{display:grid;grid-template-columns:minmax(340px,400px) 1fr;height:100%}
.pane{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;min-width:0}
.list-pane{border-right:1px solid var(--line);background:var(--surface-2)}
.pane-in{padding-left:var(--gut);padding-right:var(--gut-r);padding-block:18px 32px}
.full .pane-in{max-width:1180px;margin:0 auto}
.wide .pane-in{padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}

/* ---------- nút & ô nhập ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:12px;border:1px solid var(--line-2);background:var(--surface);font-weight:600;font-size:16px;white-space:nowrap;transition:background .15s,transform .1s}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:active{background:var(--accent-2)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line-2))}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:40px;padding:0 12px;font-size:15px;border-radius:10px}
.btn.big{min-height:54px;font-size:17px;padding:0 22px}
.btn[disabled]{opacity:.45;pointer-events:none}
.iconbtn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;color:var(--fg);flex:none}
.iconbtn:active{background:var(--accent-soft)}
.iconbtn.sm{width:40px;height:40px}
.iconbtn.line{border-color:var(--line-2);background:var(--surface)}
.in{display:block;width:100%;min-height:48px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);font-size:16px;line-height:1.3}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
textarea.in{min-height:84px;resize:vertical}
select.in{appearance:none;-webkit-appearance:none;padding-right:30px;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 16px) 52%,calc(100% - 11px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.in.num{text-align:right;font-variant-numeric:tabular-nums}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13.5px;font-weight:600;color:var(--muted)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(260px,100%),1fr));gap:14px}
.withbtn{display:flex;gap:8px}
.withbtn .in{flex:1;min-width:0}
.datefield{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);background:var(--surface);font-variant-numeric:tabular-nums}
.datefield input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;-webkit-appearance:none;appearance:none}
.datefield .ic{color:var(--muted)}
.seg{display:inline-flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px}
.seg button{min-height:42px;padding:0 14px;border:0;border-radius:10px;background:transparent;font-weight:600;color:var(--muted);font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}

/* ---------- thẻ, nhãn ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.card+.card,.stack>*+*{margin-top:14px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.card-h h3,.card>h3{font-size:17px}
.card>h3{margin-bottom:12px}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;font-size:13px;font-weight:600;white-space:nowrap}
.pill::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.s-quote{color:var(--warn);background:var(--warn-soft)}
.s-closed{color:var(--accent);background:var(--accent-soft)}
.s-building{color:var(--info);background:var(--info-soft)}
.s-done{color:var(--ok);background:var(--ok-soft)}
.tag{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:6px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.notice{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--fg);font-size:15px}
.notice.warn{background:var(--warn-soft)}
.notice.bad{background:var(--bad-soft)}
.notice.ok{background:var(--ok-soft)}
.notice .ic{margin-top:1px;color:var(--accent)}
.notice b{font-weight:700}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);font-size:18px;margin-bottom:6px}

/* ---------- danh sách đơn ---------- */
.list-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.list-head h1{font-size:26px}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:14px}
.mini{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:13px;background:var(--surface);min-width:0}
.mini span{font-size:12.5px;color:var(--muted);font-weight:600;line-height:1.25}
.mini b{font-size:17px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.search{position:relative;margin-bottom:10px}
.search .ic{position:absolute;left:12px;top:13px;color:var(--muted)}
.search .in{padding-left:42px}
.chips{display:flex;max-width:100%;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{flex:none;min-height:40px;padding:0 13px;border-radius:999px;border:1px solid var(--line-2);background:var(--surface);font-size:14.5px;font-weight:600;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.chip small{font-weight:500;opacity:.75;margin-left:3px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(330px,100%),1fr));gap:12px}
.list-pane .cards{grid-template-columns:minmax(0,1fr)}
.ocard{display:block;width:100%;min-width:0;text-align:left;padding:15px 16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);transition:border-color .15s,box-shadow .15s}
.ocard[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 30%,transparent)}
.oc-top{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;min-width:0}
.oc-code{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.oc-name{font-size:18px;font-weight:700;line-height:1.3}
.oc-proj{color:var(--muted);font-size:15px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.oc-money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px;padding-top:11px;border-top:1px dashed var(--line-2)}
.oc-money span{display:block;font-size:12px;color:var(--muted);font-weight:600}
.oc-money b{font-size:15.5px;font-variant-numeric:tabular-nums;white-space:nowrap}
.oc-money .due{color:var(--bad)}
.oc-money .zero{color:var(--ok)}
.oc-over{margin-top:8px;font-size:13.5px;font-weight:600;color:var(--info)}
.banner{margin-bottom:12px}

/* ---------- chi tiết đơn ---------- */
.d-head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.d-title{flex:1;min-width:220px}
.d-title h2{font-size:26px;margin:6px 0 2px}
.d-sub{color:var(--muted);font-size:15px}
.bignums{container-type:inline-size;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:14px}
.bignum{padding:16px 18px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);min-width:0}
.bignum span{display:block;font-size:14px;font-weight:600;color:var(--muted)}
.bignum b{display:block;font-size:clamp(17px,4.1cqi,30px);font-weight:700;font-variant-numeric:tabular-nums;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bignum.due b{color:var(--bad)}
.bignum.paid b{color:var(--ok)}
.bignum small{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.d-actions{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:16px}
.d-actions .btn{min-height:68px;flex-direction:column;gap:4px;padding:8px 6px;white-space:normal;line-height:1.2;text-align:center;font-size:15px}
.rowlist{display:flex;flex-direction:column}
.ritem{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.ritem:first-child{border-top:0;padding-top:2px}
.ritem .rmain{flex:1;min-width:0}
.ritem .rmain b{font-weight:600}
.ritem .rsub{font-size:14px;color:var(--muted)}
.ritem .ramt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.ramt.plus{color:var(--ok)}
.ramt.minus{color:var(--bad)}
.ritem.cancel .rmain,.ritem.cancel .ramt{text-decoration:line-through;opacity:.55}
.sumline{display:flex;justify-content:space-between;gap:12px;padding-top:10px;margin-top:6px;border-top:1px solid var(--line);font-weight:600}
.lockq{width:100%;border-collapse:collapse;font-size:15px}
.lockq th{font-size:12.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line-2);font-weight:600}
.lockq td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.lockq .r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.lockq .sub{display:block;color:var(--muted);font-size:13.5px}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch}
.verlist{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.thumb{position:relative;aspect-ratio:4/3;max-width:100%;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);padding:0}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .fileph{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:100%;padding:8px;font-size:13px;color:var(--muted);text-align:center;word-break:break-word}
.note-add{display:flex;gap:8px;margin-top:10px}
.note-add .in{flex:1;min-width:0}
.hist{font-size:14px;color:var(--muted)}
.hist li{padding:5px 0;border-top:1px dashed var(--line)}
.hist li:first-child{border-top:0}
.hist{list-style:none;margin:0;padding:0}

/* ---------- soạn báo giá ---------- */
.editor{height:100%;display:flex;flex-direction:column}
.ed-top{flex:none;display:flex;align-items:center;gap:10px;padding:10px var(--gut-r) 10px var(--gut);background:var(--surface);border-bottom:1px solid var(--line);flex-wrap:wrap}
.ed-title{flex:1;min-width:180px;display:flex;flex-direction:column}
.ed-title b{font-size:18px}
.ed-actions{display:flex;gap:8px;flex-wrap:wrap}
.ed-scroll{flex:1;height:auto}
.savestat{font-size:13.5px;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.savestat::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--ok)}
.savestat.saving::before{background:var(--warn)}
.savestat.error{color:var(--bad);font-weight:600}
.savestat.error::before{background:var(--bad)}
.savestat button{border:0;background:none;color:var(--accent);font-weight:700;text-decoration:underline;padding:0 2px}
.qtable{margin:0 -4px}
.qhead,.qrow{display:grid;grid-template-columns:34px minmax(150px,1.35fr) minmax(140px,1.25fr) 84px 118px 128px 128px 44px;gap:8px;align-items:start;padding:0 4px}
.qhead{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-bottom:8px;border-bottom:1px solid var(--line-2)}
.qhead .r{text-align:right}
.qrow{padding-top:10px;padding-bottom:10px;border-bottom:1px solid var(--line)}
.qrow .c-no{padding-top:13px;font-weight:600;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.qrow .amt{min-height:48px;display:flex;align-items:center;justify-content:flex-end;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.qrow .fl{display:none;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:4px}
.qtywrap{display:flex;gap:4px;align-items:center}
.qtywrap .in{flex:1;min-width:0;padding-left:8px;padding-right:8px}
.qtywrap .iconbtn{border:1px solid var(--line-2);background:var(--surface-2);width:40px;height:48px}
.dimtxt{font-size:13px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.c-more{padding-top:2px}
.addbar{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.ed-bottom{display:grid;grid-template-columns:1.25fr 1fr;gap:14px;margin-top:14px;align-items:start}
.ed-bottom .card+.card{margin-top:0}
.totals .tline{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-variant-numeric:tabular-nums}
.totals .tline+.tline{border-top:1px solid var(--line)}
.totals .tgrand{font-size:20px;font-weight:700}
.totals .tgrand b{color:var(--accent);font-size:26px}
.disc{display:flex;gap:6px;align-items:center}
.disc .in{width:150px;min-height:44px}
.disc .seg button{min-height:36px;padding:0 10px}
.words{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.4}
.ed-bar{display:none}

/* ---------- thống kê ---------- */
.kpis{container-type:inline-size;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:14px 0}
.kpi{text-align:left;padding:16px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi span{font-size:14px;font-weight:600;color:var(--muted)}
.kpi b{font-size:clamp(17px,2.9cqi,28px);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi small{font-size:13px;color:var(--muted)}
.kpi .go{font-size:13px;font-weight:600;color:var(--accent);margin-top:2px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font);font-size:13px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .bar{fill:var(--accent)}
.chart .bar.out{fill:var(--line-2)}
.chart .bar-hit{fill:transparent;cursor:pointer}
.chart text.val{fill:var(--fg);font-weight:600;font-size:12.5px}
.range{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.foot-note{font-size:14px;color:var(--muted);margin-top:16px}
.debt td,.debt th{white-space:nowrap}

/* ---------- danh mục ---------- */
.cat-row{display:grid;grid-template-columns:minmax(160px,1.3fr) minmax(160px,1.5fr) 96px 150px 44px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cat-head{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:0 0 8px;border-bottom:1px solid var(--line-2)}
.cus-row{display:grid;grid-template-columns:minmax(150px,1fr) 170px minmax(180px,1.4fr) 90px 44px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.cus-row .cnt{font-size:14px;color:var(--muted);text-align:center}
.logo-box{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo-prev{width:150px;height:76px;border:1px dashed var(--line-2);border-radius:12px;display:grid;place-items:center;background:#fff;overflow:hidden;color:#75685B;font-size:13px}
.logo-prev img{max-width:100%;max-height:100%;object-fit:contain}

/* ---------- sheet / hộp thoại ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top,0px)) var(--gut-r) max(20px,env(safe-area-inset-bottom,0px)) var(--gut)}
.sheet-bg{position:absolute;inset:0;background:rgba(30,20,10,.42);opacity:0;transition:opacity .18s}
.sheet{position:relative;width:min(560px,100%);max-height:100%;display:flex;flex-direction:column;background:var(--surface);border-radius:20px;box-shadow:0 20px 60px rgba(0,0,0,.25);transform:translateY(16px);opacity:0;transition:transform .2s,opacity .2s}
.sheet.wide{width:min(860px,100%)}
.sheet-wrap.in .sheet-bg{opacity:1}
.sheet-wrap.in .sheet{transform:none;opacity:1}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 14px 10px 20px;border-bottom:1px solid var(--line)}
.sheet-h h3{font-size:19px}
.sheet-b{padding:16px 20px;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;padding:12px 20px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.sheet-f .btn{min-width:120px}
.menu-list{display:flex;flex-direction:column;gap:4px;margin:-6px -8px}
.menu-list button{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 12px;border:0;border-radius:12px;background:transparent;text-align:left;font-size:16.5px;font-weight:500}
.menu-list button:active{background:var(--accent-soft)}
.menu-list button.danger{color:var(--bad)}
.pick-list{display:flex;flex-direction:column}
.pick{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 6px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;width:100%}
.pick .pm{flex:1;min-width:0}
.pick .pm b{display:block;font-weight:600}
.pick .pm span{display:block;color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pick .pp{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pick .added{color:var(--ok);font-weight:700;font-size:14px}
.big-money{font-size:30px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.calcline{padding:12px 14px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);font-variant-numeric:tabular-nums;font-size:17px}
.calcline b{color:var(--accent)}
.err{color:var(--bad);font-weight:600;font-size:15px}
.preview-pages{display:flex;flex-direction:column;gap:14px;align-items:center;background:#8b7d6e22;padding:14px;border-radius:12px}
.preview-pages img{width:100%;max-width:760px;box-shadow:0 2px 14px rgba(0,0,0,.18);background:#fff;border-radius:2px}
.lightbox img{max-width:100%;max-height:62vh;object-fit:contain;display:block;margin:0 auto;border-radius:10px}

.toasts{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));z-index:200;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(560px,calc(100% - 32px))}
.wide~.toasts,.toasts.wide{bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.toast{background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:14px;font-size:15.5px;font-weight:500;box-shadow:var(--shadow);text-align:center;animation:tin .2s ease-out}
.toast.bad{background:var(--bad);color:#fff}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.loading{height:100%;display:grid;place-items:center;color:var(--muted);text-align:center;padding:24px}

/* ---------- màn hình hẹp (iPad dọc, điện thoại) ---------- */
@media (max-width:999px){
  .qhead{display:none}
  .qrow{grid-template-columns:28px 104px 1fr 1fr 1fr 44px;grid-template-areas:"no name name name name more" "no mat mat mat mat mat" "no unit qty price amt amt";row-gap:10px}
  .qrow .fl{display:block}
  .c-no{grid-area:no}.c-name{grid-area:name}.c-mat{grid-area:mat}.c-unit{grid-area:unit}.c-qty{grid-area:qty}.c-price{grid-area:price}.c-amt{grid-area:amt}.c-more{grid-area:more;padding-top:22px}
  .qrow .c-no{padding-top:34px}
  .ed-actions{display:none}
  .ed-bar{display:flex;gap:8px;position:sticky;bottom:0;padding:10px var(--gut-r) calc(10px + env(safe-area-inset-bottom,0px)) var(--gut);background:var(--surface);border-top:1px solid var(--line);z-index:5}
  .ed-bar .btn{flex:1;padding:0 10px}
  .editor .ed-scroll{padding-bottom:0}
  .narrow .editor{padding-bottom:0}
  .ed-bottom{grid-template-columns:1fr}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi b{font-size:clamp(17px,5.8cqi,28px)}
  .d-actions{grid-template-columns:repeat(3,minmax(0,1fr))}
  .cat-row{grid-template-columns:1fr 1fr 44px;grid-template-areas:"n n x" "m m m" "u p p"}
  .cat-row .cn{grid-area:n}.cat-row .cm{grid-area:m}.cat-row .cu{grid-area:u}.cat-row .cp{grid-area:p}.cat-row .cx{grid-area:x}
  .cat-head{display:none}
  .cus-row{grid-template-columns:1fr 1fr 44px;grid-template-areas:"n n x" "p c c" "a a a"}
  .cus-row .cn{grid-area:n}.cus-row .cph{grid-area:p}.cus-row .ca{grid-area:a}.cus-row .cnt{grid-area:c;text-align:left}.cus-row .cx{grid-area:x}
  .sheet-wrap{align-items:flex-end;padding:0}
  .sheet,.sheet.wide{width:100%;border-radius:20px 20px 0 0;max-height:92%;padding-bottom:env(safe-area-inset-bottom,0px)}
}
@media (max-width:620px){
  .qrow{grid-template-columns:24px 96px 1fr 44px;grid-template-areas:"no name name more" "no mat mat mat" "no unit qty qty" "no price price price" "no amt amt amt"}
  .bignums{grid-template-columns:1fr}
  .bignum b{font-size:28px}
  .minis{grid-template-columns:1fr 1fr}
  .minis .mini:last-child{grid-column:span 2}
  .list-head h1{font-size:22px}
  .cards{grid-template-columns:1fr}
  .d-actions{grid-template-columns:1fr 1fr}
  .d-actions .btn:last-child{grid-column:span 2}
  .ed-bar .btn span{display:none}
  .disc{flex-wrap:wrap}
}

/* ---------- lịch thanh toán, QR, chữ ký ---------- */
.s-bad{color:var(--bad);background:var(--bad-soft)}
.s-later{color:var(--muted);background:var(--surface-2)}
.savestat.offline{color:var(--warn);font-weight:600}

.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;text-decoration:underline;padding:0 2px;font-size:inherit}

.notice.bad .ic{color:var(--bad)}
.oc-next{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;min-width:0}

.oc-next>span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plan-rows{display:flex;flex-direction:column}
.prow{display:grid;grid-template-columns:56px minmax(140px,1.4fr) minmax(150px,1fr) 104px 128px 44px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.prow.noamt{grid-template-columns:56px minmax(140px,1.4fr) minmax(150px,1fr) 104px 44px}
.pno{grid-area:no;font-weight:700;color:var(--muted);font-size:15px}
.prow .pl{grid-area:lb}.prow .pt{grid-area:tr}.prow .ppct{grid-area:pc}.prow .pamt{grid-area:am}.prow>.iconbtn{grid-area:x}
.prow{grid-template-areas:"no lb tr pc am x"}
.prow.noamt{grid-template-areas:"no lb tr pc x"}
.ppct{display:flex;align-items:center;gap:6px;font-weight:600;color:var(--muted)}
.ppct .in{width:100%;min-width:0}
.ppct.rest{justify-content:flex-end;padding-right:6px}
.pamt{text-align:right;font-variant-numeric:tabular-nums;font-size:16px}
.plan-hint{align-self:center;font-size:14px}
.plan-mini{display:flex;flex-direction:column;gap:4px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.plan-mini div{display:flex;justify-content:space-between;gap:12px;font-variant-numeric:tabular-nums;font-size:15px}
.ritem.pd{align-items:flex-start}
.pd-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:7px}
.duechip{position:relative;display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 11px;border:1px solid var(--line-2);border-radius:10px;font-size:14px;font-weight:600;background:var(--surface);font-variant-numeric:tabular-nums}
.duechip .ic{width:18px;height:18px;color:var(--muted)}
.duechip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;-webkit-appearance:none;appearance:none}
.pd-btns{display:flex;gap:6px;align-items:center}

.signed>div{flex:1;min-width:180px}

.sigbox::after{content:"";position:absolute;left:24px;right:24px;bottom:44px;border-bottom:1px solid #DCD1C3;pointer-events:none}
.sigpad{width:100%;height:100%;display:block;touch-action:none;border-radius:14px;cursor:crosshair}
.sig-hint{position:absolute;left:0;right:0;top:42%;text-align:center;color:var(--ink-hint);pointer-events:none;font-size:15px}
.sig-clear{position:absolute;right:8px;bottom:8px;background:#FFFFFF;color:#2A2119;border-color:#D5C8B8}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.qrimg{width:min(300px,78vw);height:auto;image-rendering:pixelated;border-radius:10px;display:block}
.qrinfo{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;text-align:left;font-size:15px;width:100%;max-width:440px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}

.qrtest{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:15px}
.checkline{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px}

@media (max-width:999px){
  .prow,.prow.noamt{grid-template-columns:56px 1fr 1fr 44px;grid-template-areas:"no lb lb x" "no tr tr tr" "no pc am am"}

/* làm việc nhóm */
.gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}

.gate-card .linkbtn{align-self:flex-start;font-weight:500;font-size:14px;margin-top:4px}
.sep{border:0;border-top:1px solid var(--line);margin:8px 0;width:100%}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:15px}

.pgrid,.psum{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}

.pgrid span,.psum span{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.pgrid b,.psum b{display:block;font-size:19px;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* =========================================================
   PHONG CÁCH macOS (Sonoma): thanh bên mờ, nhóm bo góc,
   nút và ô nhập kiểu AppKit, sheet bật từ trên, giữ tông trắng–sữa–nâu
   ========================================================= */
:root{
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Be Vietnam Pro",Arial,sans-serif;
  --bg:#F6F3EF; --surface:#FFFFFF; --surface-2:#F7F4F0; --line:rgba(60,40,20,.10); --line-2:rgba(60,40,20,.18);
  --fg:#1F1A15; --muted:#7A6F64; --accent:#8A5A34; --accent-2:#6F4524; --accent-soft:rgba(138,90,52,.12);
  --side:rgba(238,232,224,.72); --bar:rgba(250,248,245,.78);
  --shadow:0 0 0 .5px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(60,40,20,.05);
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1A18; --surface:#272421; --surface-2:#2E2A26; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --fg:#F3EEE8; --muted:#A79C90; --accent:#D2A27A; --accent-2:#E4BA94; --accent-soft:rgba(210,162,122,.16);
  --side:rgba(42,38,34,.72); --bar:rgba(34,31,28,.78);
  --shadow:0 0 0 .5px rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{
  --bg:#1C1A18; --surface:#272421; --surface-2:#2E2A26; --line:rgba(255,255,255,.09); --line-2:rgba(255,255,255,.16);
  --fg:#F3EEE8; --muted:#A79C90; --accent:#D2A27A; --accent-2:#E4BA94; --accent-soft:rgba(210,162,122,.16);
  --side:rgba(42,38,34,.72); --bar:rgba(34,31,28,.78)}
body{font-size:15px;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
h1,h2,h3{letter-spacing:-.015em}
.ic{stroke-width:1.6}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(120,100,80,.28);border-radius:10px;border:3px solid transparent;background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}

/* thanh bên kiểu Finder */
.rail{background:var(--side);-webkit-backdrop-filter:saturate(180%) blur(28px);backdrop-filter:saturate(180%) blur(28px)}
.wide .rail{width:232px;padding:18px 10px 12px;gap:2px;border-right:.5px solid var(--line-2)}
.wide .rail .brand{display:flex;align-items:center;gap:10px;text-align:left;padding:2px 8px 18px;color:var(--fg);font-size:15px;letter-spacing:-.01em}
.appicon{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:linear-gradient(180deg,#A8754B,#7A4E2D);color:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2),inset 0 .5px 0 rgba(255,255,255,.35);flex:none}
.appicon .ic{width:20px;height:20px;stroke-width:1.8}
.brand-t{display:flex;flex-direction:column;line-height:1.2;font-weight:700;min-width:0}
.brand-t small{font-size:11.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wide .rail .navbtn{flex-direction:row;justify-content:flex-start;gap:10px;min-height:38px;padding:0 10px;border-radius:7px;font-size:14.5px;font-weight:500;color:var(--fg)}
.wide .rail .navbtn .ic{width:19px;height:19px;color:var(--accent)}
.wide .rail .navbtn:hover{background:rgba(120,90,60,.08)}
.wide .rail .navbtn[aria-current="page"]{background:rgba(120,90,60,.16);color:var(--fg);font-weight:600}
.wide .rail .rail-foot{text-align:left;padding:0 10px;font-size:12px}
.narrow .rail{background:var(--bar);border-top:.5px solid var(--line-2)}
.narrow .rail .navbtn{font-size:11.5px;font-weight:500;border-radius:10px;min-height:52px}
.narrow .rail .navbtn[aria-current="page"]{background:transparent;color:var(--accent)}

/* cột danh sách + thanh tiêu đề mờ dính trên cùng */
.list-pane{background:var(--surface-2);border-right:.5px solid var(--line-2)}
.pane .list-head{position:sticky;top:0;z-index:6;margin:-18px calc(-1 * var(--gut-r)) 14px calc(-1 * var(--gut));padding:16px var(--gut-r) 12px var(--gut);background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid var(--line)}
.wide .pane .list-head{margin-left:min(-24px,calc(-1 * env(safe-area-inset-left,0px)));margin-right:min(-24px,calc(-1 * env(safe-area-inset-right,0px)));padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.list-head h1{font-size:24px;font-weight:700}
.ed-top{background:var(--bar);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-bottom:.5px solid var(--line-2)}
.ed-bar{background:var(--bar)!important;-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);border-top:.5px solid var(--line-2)!important}

/* nút kiểu macOS */
.btn{min-height:40px;padding:0 15px;border-radius:8px;border:0;background:var(--surface);box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 1px 1.5px rgba(0,0,0,.08);font-weight:500;font-size:15px;transition:filter .12s,transform .08s}
.btn:hover{filter:brightness(.98)}
.btn:active{transform:none;filter:brightness(.93)}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--accent) 88%,#fff),var(--accent));box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 1px 2px rgba(0,0,0,.14),inset 0 .5px 0 rgba(255,255,255,.25);color:#fff}
.btn.danger{box-shadow:0 0 0 .5px color-mix(in srgb,var(--bad) 45%,transparent),0 1px 1.5px rgba(0,0,0,.06)}
.btn.danger.solid{background:linear-gradient(180deg,color-mix(in srgb,var(--bad) 85%,#fff),var(--bad))}
.btn.sm{min-height:34px;padding:0 11px;font-size:14px;border-radius:7px}
.btn.big{min-height:40px;font-size:15px;padding:0 16px;border-radius:8px}
.btn .ic{width:18px;height:18px}
.iconbtn{border-radius:8px;width:40px;height:40px}
.iconbtn .ic{width:19px;height:19px}
.iconbtn:hover{background:rgba(120,90,60,.08)}
.iconbtn.line{border:0;background:var(--surface);box-shadow:0 0 0 .5px rgba(0,0,0,.14),0 1px 1.5px rgba(0,0,0,.08)}
.linkbtn{text-decoration:none;font-weight:600}

/* ô nhập kiểu AppKit */
.in,.datefield{min-height:40px;border-radius:7px;border:0;background:var(--surface);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.22),inset 0 1px 1px rgba(0,0,0,.04);font-size:15px;padding:8px 10px}
.datefield{padding:0 10px}
.in:focus{box-shadow:inset 0 0 0 .5px var(--accent),0 0 0 3.5px color-mix(in srgb,var(--accent) 35%,transparent)}
textarea.in{min-height:76px}
.field>label,.lbl{font-size:12.5px;font-weight:600;color:var(--muted)}
.search .in{border-radius:9px;background:rgba(120,90,60,.08);box-shadow:none}
.search .in:focus{background:var(--surface);box-shadow:inset 0 0 0 .5px var(--accent),0 0 0 3.5px color-mix(in srgb,var(--accent) 35%,transparent)}
.search .ic{top:10px;width:19px;height:19px}
.qtywrap .iconbtn{height:40px;width:36px;border:0;box-shadow:0 0 0 .5px rgba(0,0,0,.14);background:var(--surface-2)}

/* segmented control */
.seg{gap:0;padding:2px;border:0;border-radius:8px;background:rgba(120,90,60,.10)}
.seg button{min-height:30px;padding:0 13px;border-radius:6px;font-weight:500;font-size:14px;color:var(--fg)}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:0 0 0 .5px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.12);font-weight:600}
.chip{min-height:32px;padding:0 12px;border-radius:7px;border:0;background:rgba(120,90,60,.09);font-size:14px;font-weight:500;color:var(--fg)}
.chip[aria-pressed="true"]{background:var(--accent);color:#fff}

/* thẻ = nhóm bo góc kiểu Cài đặt hệ thống */
.card,.bignum,.kpi,.mini,.ocard{border:0;box-shadow:var(--shadow)}
.card{border-radius:12px;padding:16px 18px}
.card-h h3,.card>h3{font-size:15px;font-weight:600}
.bignum,.kpi{border-radius:12px}
.bignum span,.kpi span,.mini span{font-size:12.5px;font-weight:500}
.mini{border-radius:10px}
.ocard{border-radius:12px;padding:13px 15px}
.ocard:hover{box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 2px 8px rgba(60,40,20,.08)}
.ocard[aria-current="true"]{box-shadow:0 0 0 2px var(--accent),var(--shadow)}
.oc-name{font-size:16.5px}
.oc-money{border-top:.5px solid var(--line-2)}
.pill{min-height:22px;font-size:12px;padding:0 8px;font-weight:600}
.notice{border-radius:10px;font-size:14px}
.ritem{border-top:.5px solid var(--line-2)}
.lockq th{font-size:11.5px;border-bottom:.5px solid var(--line-2)}
.lockq td{border-bottom:.5px solid var(--line)}
.d-title h2{font-size:24px}
.d-actions .btn{min-height:62px;font-size:13.5px;border-radius:10px;font-weight:500}
.d-actions .btn .ic{width:21px;height:21px;color:var(--accent)}
.d-actions .btn.primary .ic{color:#fff}
.qhead{font-size:11.5px;border-bottom:.5px solid var(--line-2)}
.qrow{border-bottom:.5px solid var(--line)}
.qrow .amt{min-height:40px}
.qrow .c-no{padding-top:9px}
.totals .tgrand b{font-size:24px}

/* sheet kiểu macOS: bật từ trên, bo 12px */
.sheet-bg{background:rgba(20,14,8,.22)}
.sheet{border-radius:12px;box-shadow:0 0 0 .5px rgba(0,0,0,.18),0 24px 70px rgba(0,0,0,.30);transform:translateY(-12px) scale(.98)}
.sheet-h{border-bottom:.5px solid var(--line-2);padding:12px 12px 10px 18px}
.sheet-h h3{font-size:15px;font-weight:600}
.sheet-f{border-top:.5px solid var(--line-2);background:var(--surface-2);border-radius:0 0 12px 12px}
.sheet-f .btn{min-width:96px}
.menu-list button{min-height:42px;border-radius:7px;font-size:15px}
.menu-list button:hover{background:var(--accent);color:#fff}
.menu-list button:hover .ic{color:#fff}
.pick{min-height:52px;border-bottom:.5px solid var(--line)}

/* thông báo kiểu Trung tâm thông báo */
.toast{background:rgba(40,34,28,.86);color:#fff;-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-radius:12px;font-size:14px;box-shadow:0 0 0 .5px rgba(255,255,255,.08),0 10px 30px rgba(0,0,0,.25)}
@media (max-width:999px){
  .sheet,.sheet.wide{border-radius:14px 14px 0 0;transform:translateY(16px)}
  .sheet-f{border-radius:0}
}

.kpis:has(.kpi-profit){grid-template-columns:repeat(5,minmax(0,1fr))}
.kpis:has(.kpi-profit) .kpi b{font-size:clamp(16px,2.6cqi,26px)}
:root{--seg-on:#FFFFFF}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--seg-on:#4C443C}}
:root[data-theme="dark"]{--seg-on:#4C443C}
.seg button[aria-pressed="true"]{background:var(--seg-on)}
.cost-ship{max-width:320px}
/* nhóm hạng mục, bộ chuẩn, đổi giá */
.grp-h{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--accent);padding:16px 2px 6px;border-bottom:.5px solid var(--line-2);position:sticky;top:0;background:var(--surface);z-index:1}
.grp-h small{font-weight:500;color:var(--muted);margin-left:4px}
.pick-list .grp-h{padding-top:12px}
.libgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:6px 14px}
.libg span{display:flex;flex-direction:column;line-height:1.25}
.libg small{font-size:12.5px;color:var(--muted)}
.cost-row.rp{grid-template-columns:28px minmax(0,1.6fr) 110px 120px 120px;cursor:pointer}
.cost-row.rp input{width:20px;height:20px;accent-color:var(--accent)}
@media (max-width:999px){
  .cost-row.rp{grid-template-columns:28px 1fr 1fr;grid-template-areas:"c n n" "c o w" "c d d"}
  .cost-row.rp>:nth-child(1){grid-area:c}.cost-row.rp>:nth-child(2){grid-area:n}.cost-row.rp>:nth-child(3){grid-area:o;text-align:left}.cost-row.rp>:nth-child(4){grid-area:w}.cost-row.rp>:nth-child(5){grid-area:d}
}

/* =========================================================
   VỎ APP MỚI: thanh bên kiểu Mail, Hôm nay, Doanh thu, tìm nhanh
   ========================================================= */
.warnt{color:var(--warn);font-weight:600}.okt{color:var(--ok);font-weight:600}
.wide .rail{overflow-y:auto;scrollbar-width:none;gap:1px}
.wide .rail .brand{padding-bottom:12px}
.sb-search{display:flex;align-items:center;gap:8px;min-height:34px;margin:0 4px 8px;padding:0 10px;border:0;border-radius:8px;background:rgba(120,90,60,.10);color:var(--muted);font-size:14px;text-align:left}
.sb-search .ic{width:17px;height:17px}
.sb-search span{flex:1}
kbd{font-family:inherit;font-size:11.5px;padding:1px 6px;border-radius:5px;background:var(--surface);box-shadow:0 0 0 .5px rgba(0,0,0,.15);color:var(--muted)}
.sb-new{margin:0 4px 10px;min-height:36px}
.sb-label{font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);padding:14px 10px 4px;text-transform:uppercase}
.wide .rail .navbtn{min-height:34px}
.wide .rail .navbtn span{flex:1;text-align:left}
.badge{font-style:normal;font-size:11.5px;font-weight:600;min-width:20px;height:20px;padding:0 6px;border-radius:10px;display:inline-grid;place-items:center;background:rgba(120,90,60,.14);color:var(--muted);font-variant-numeric:tabular-nums}
.badge.bad{background:var(--bad);color:#fff}
.badge.plain{background:transparent;color:var(--muted)}
.narrow .rail .navbtn{position:relative}
.narrow .rail .badge{position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;font-size:10.5px;padding:0 5px}
.list-head>div:first-child{min-width:0}
.list-head .d-sub{font-size:13.5px;margin-top:2px}
.hd-act{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn.icon-only{width:40px;padding:0}
.btn.icon-only span{display:none}

/* Hôm nay */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;border:0;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);min-width:0}
.tile span{font-size:12.5px;font-weight:500;color:var(--muted)}
.tile b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tile small{font-size:12px;color:var(--muted)}
.tile:hover{box-shadow:0 0 0 .5px rgba(0,0,0,.1),0 2px 8px rgba(60,40,20,.08)}
b.ok{color:var(--ok)}b.bad{color:var(--bad)}
.todos{display:flex;flex-direction:column}
.todos.later{margin-top:6px;opacity:.92}
.todo{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:.5px solid var(--line-2)}
.todos .todo:first-child{border-top:0}
.todo-m{flex:1;min-width:0;display:flex;align-items:center;gap:12px;border:0;background:none;text-align:left;padding:2px 0}
.todo-m[disabled]{cursor:default;opacity:1}
.todo-ic{flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:8px;background:var(--surface-2);color:var(--muted)}
.todo-ic .ic{width:18px;height:18px}
.todo.bad .todo-ic{background:var(--bad-soft);color:var(--bad)}
.todo.warn .todo-ic{background:var(--warn-soft);color:var(--warn)}
.todo.info .todo-ic{background:var(--info-soft);color:var(--info)}
.todo-t{display:flex;flex-direction:column;min-width:0}
.todo-t b{font-weight:600;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-t small{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo-a{display:flex;align-items:center;gap:6px;flex:none}
.iconbtn.zalo{width:auto;padding:0 10px;font-size:13px;font-weight:700;color:#0068FF;text-decoration:none}
a.iconbtn{text-decoration:none;color:var(--fg)}
.welcome{text-align:center;padding:32px 20px;display:flex;flex-direction:column;align-items:center;gap:10px}
.welcome h2{font-size:22px}
.appicon.big{width:56px;height:56px;border-radius:14px;margin:0 auto 6px}
.appicon.big .ic{width:30px;height:30px}
.empty .appicon.big{margin-bottom:12px}

/* dòng đơn kiểu Mail */
.list-pane .cards,.cards{gap:8px}
.ocard{display:flex;align-items:flex-start;gap:10px;padding:11px 13px}
.oc-dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:7px;background:currentColor;padding:0}
.oc-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.oc-l1,.oc-l2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0}
.oc-l1 .oc-name{font-size:15.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.oc-amt{font-variant-numeric:tabular-nums;font-size:14.5px;white-space:nowrap}
.oc-l2{font-size:13px;color:var(--muted)}
.oc-l2 .oc-code{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;font-size:13px}
.oc-l2>span:last-child{flex:none;font-variant-numeric:tabular-nums}
.oc-l2 .due{color:var(--bad);font-weight:600}.oc-l2 .zero{color:var(--ok)}.oc-l2 .info{color:var(--info);font-weight:600}
.oc-note{font-size:12.5px;font-weight:600;margin-top:2px}
.oc-note.bad{color:var(--bad)}.oc-note.warn{color:var(--warn)}
.ocard[aria-current="true"]{background:color-mix(in srgb,var(--accent) 9%,var(--surface))}

/* phần thu gọn */
details.sect{padding:0}
details.sect>summary{list-style:none;display:flex;align-items:center;gap:10px;padding:13px 16px;cursor:pointer;min-height:52px;border-radius:12px}
details.sect>summary::-webkit-details-marker{display:none}
details.sect>summary:hover{background:rgba(120,90,60,.04)}
details.sect>summary h3{font-size:15px;font-weight:600;white-space:nowrap;margin:0}
details.sect .chev{display:grid;place-items:center;color:var(--muted);transition:transform .15s;transform:rotate(-90deg)}
details.sect .chev .ic{width:16px;height:16px;stroke-width:2.2}
details.sect[open] .chev{transform:none}
details.sect .sum{flex:1;min-width:0;color:var(--muted);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:right}
details.sect .sact{display:flex;gap:6px;flex:none}
details.sect>.sect-b{padding:2px 16px 16px}
details.sect[open]>summary{border-bottom:.5px solid var(--line);border-radius:12px 12px 0 0;margin-bottom:10px}
.stack>details.sect+details.sect,.stack>details.sect+section,.stack>section+details.sect{margin-top:12px}
.card+details.sect,details.sect+.card,details.sect+details.sect{margin-top:12px}
.ed-bottom .stack>*+*{margin-top:12px}
.d-contact{display:flex;gap:6px;align-items:center}

/* chi tiết: thanh thao tác gọn */
.d-actions{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.d-actions .btn{min-height:54px;font-size:13px;gap:3px}
.d-actions .btn .ic{width:19px;height:19px}

/* Doanh thu */
.kpis{grid-template-columns:1.8fr repeat(3,minmax(0,1fr))}
.kpis:has(.kpi-profit){grid-template-columns:1.8fr repeat(4,minmax(0,1fr))}
.kpi.hero b{font-size:clamp(22px,4.2cqi,34px)!important;color:var(--accent)}
.kpi b.ok{color:var(--ok)}.kpi b.bad{color:var(--bad)}
.up{color:var(--ok);font-weight:700}.down{color:var(--bad);font-weight:700}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);margin:-4px 0 6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg{width:10px;height:10px;border-radius:3px;display:inline-block}
.lg.rev,.chart .bar.rev{background:var(--accent);fill:var(--accent)}
.lg.cash,.chart .bar.cash{background:color-mix(in srgb,var(--ok) 70%,var(--surface));fill:color-mix(in srgb,var(--ok) 70%,var(--surface))}
.chart .bar.out{fill:var(--line-2)!important}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:flex;flex-direction:column;gap:3px}
.hb.clk{cursor:pointer;border-radius:8px;margin:0 -8px;padding:4px 8px}
.hb.clk:hover{background:rgba(120,90,60,.05)}
.hb-t{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.hb-t span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-t b{font-variant-numeric:tabular-nums;white-space:nowrap}
.hb-bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.hb-bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent))}
.hb small{font-size:12px;color:var(--muted)}

/* tìm nhanh */
.sheet-wrap:has(.palette){align-items:flex-start;padding-top:max(10vh,env(safe-area-inset-top,0px))}
.sheet.palette{width:min(640px,100%)}
.palette .sheet-h{display:none}
.palette .sheet-b{padding:12px;gap:8px}
.palette #pal-q{font-size:17px;min-height:46px;background:transparent;box-shadow:none;padding-left:42px}
.palette .search .ic{top:13px}
.pal-list{display:flex;flex-direction:column;max-height:min(56vh,520px);overflow-y:auto;border-top:.5px solid var(--line-2);padding-top:6px}
.pal-sec{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:10px 10px 4px}
.pal-it{display:flex;align-items:center;gap:12px;min-height:46px;padding:6px 10px;border:0;border-radius:8px;background:transparent;text-align:left;width:100%}
.pal-it .ic{width:19px;height:19px;color:var(--muted);flex:none}
.pal-it span{display:flex;flex-direction:column;min-width:0}
.pal-it b{font-weight:500;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-it small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pal-it[aria-selected="true"],.pal-it:hover{background:var(--accent);color:#fff}
.pal-it[aria-selected="true"] .ic,.pal-it[aria-selected="true"] small,.pal-it:hover .ic,.pal-it:hover small{color:rgba(255,255,255,.85)}
.pal-hint{font-size:12px;color:var(--muted);text-align:center;margin:2px 0 0}

@media (max-width:999px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis,.kpis:has(.kpi-profit){grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis .kpi.hero{grid-column:1/-1}
  .kpis .kpi-profit{grid-column:auto}
  .todo{flex-wrap:wrap}
  .todo-a{width:100%;justify-content:flex-end}
  .d-actions{grid-template-columns:repeat(5,minmax(0,1fr))!important}
  .d-actions .btn{grid-column:auto!important;font-size:12px;padding:6px 2px}
  .palette .pal-hint{display:none}
  .sheet-wrap:has(.palette){align-items:flex-end;padding-top:0}
}
@media (max-width:620px){
  .d-actions .btn:last-child{grid-column:auto}
  .tile b{font-size:19px}
  details.sect .sum{display:none}
  .list-head .hd-act .seg button{padding:0 9px}
}
/* chỉnh sau khi xem ảnh chụp */
.kpis,.kpis:has(.kpi-profit){grid-template-columns:repeat(4,minmax(0,1fr))}
.kpis .kpi.hero{grid-column:1/-1;flex-direction:row;flex-wrap:wrap;align-items:baseline;column-gap:16px}
.kpis .kpi.hero>span:first-child{width:100%}
.kpis .kpi.hero .go{margin-left:auto}
.kpis:has(.kpi-profit) .kpi:not(.hero) b,.kpis .kpi:not(.hero) b{font-size:clamp(16px,3.4cqi,24px)}
.palette input::-webkit-search-cancel-button{display:none}
@media (max-width:999px){
  .kpis,.kpis:has(.kpi-profit){grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis .kpi:not(.hero) b{font-size:clamp(16px,6cqi,24px)}
}
@media (max-width:620px){
  .bignums{gap:6px}
  .bignum{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;padding:10px 14px}
  .bignum b{font-size:21px!important;margin:0}
  .bignum small{width:100%;margin-top:0}
  .d-head{gap:8px}
  .d-contact{width:100%}
}

/* =========================================================

const $ = (s, r = document) => r.querySelector(s);

/* Đọc số tiền bằng chữ tiếng Việt */
const DIG = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
function read3(n, full) {
  const h = Math.floor(n / 100), t = Math.floor((n % 100) / 10), u = n % 10, out = [];
  if (h > 0 || full) out.push(DIG[h] + ' trăm');
  if (t > 1) {
    out.push(DIG[t] + ' mươi');
    if (u === 1) out.push('mốt'); else if (u === 4) out.push('tư'); else if (u === 5) out.push('lăm'); else if (u > 0) out.push(DIG[u]);
  } else if (t === 1) {
    out.push('mười');
    if (u === 5) out.push('lăm'); else if (u > 0) out.push(DIG[u]);
  } else if (u > 0) {
    if (h > 0 || full) out.push('linh');

}
function readBelowBillion(n, full) {
  const g = [Math.floor(n / 1e6), Math.floor(n / 1e3) % 1000, n % 1000], names = ['triệu', 'nghìn', ''];
  const parts = []; let started = full;
  for (let i = 0; i < 3; i++) {
    if (g[i] === 0) continue;
    parts.push(read3(g[i], started) + (names[i] ? ' ' + names[i] : ''));

}
function readNum(n) {

}
function moneyWords(n) {

  return s.charAt(0).toUpperCase() + s.slice(1) + '.';
}

/* =========================================================
   NGHIỆP VỤ
   ========================================================= */
const UNITS = ['m²', 'md', 'bộ', 'cái', 'gói', 'cánh', 'điểm', 'công'];
const UNIT_NAMES = { 'm²': 'm² (mét vuông)', 'md': 'md (mét dài)', 'bộ': 'bộ', 'cái': 'cái', 'gói': 'gói', 'cánh': 'cánh', 'điểm': 'điểm', 'công': 'công' };
const STATUS = {
  quote: { label: 'Đang báo giá', cls: 's-quote' },
  closed: { label: 'Đã chốt', cls: 's-closed' },
  building: { label: 'Đang thi công', cls: 's-building' },
  done: { label: 'Hoàn thành', cls: 's-done' },
};
const DEFAULT_SETTINGS = {
  id: 'settings',
  shopName: 'Nội Thất Hùng Loan',
  tagline: 'Thiết kế – thi công nội thất trọn gói',
  address: 'Làng nghề Hà Lâm 1 – Thư Lâm – Hà Nội',
  phone: '0916.771.586 – 0961.761.868',
  email: '',
  bankName: '', bankBin: '', bankAccount: '', bankHolder: '', memoPrefix: 'HL',
  logo: '',
  defaultNote: '', defaultTerms: '',
  codePrefix: 'BG',
  warrantyMonths: 36,
  planTemplate: null,
  features: { today: true, cash: true, profit: true, qrPdf: true },
  followDays: 3,
};
const TRIGGERS = { sign: 'Khi chốt đơn', progress: 'Khi bắt đầu thi công', accept: 'Khi nghiệm thu, bàn giao', date: 'Theo ngày hẹn' };
const DEFAULT_PLAN = [
  { label: 'Đặt cọc khi ký hợp đồng', pct: 50, trigger: 'sign' },
  { label: 'Khi bắt đầu lắp đặt', pct: 40, trigger: 'progress' },
  { label: 'Sau nghiệm thu, bàn giao', pct: 0, trigger: 'accept' },
];
const PLAN_STATE = {
  paid: { label: 'Đã thu', cls: 's-done' },
  overdue: { label: 'Quá hạn', cls: 's-bad' },
  due: { label: 'Đến hạn', cls: 's-quote' },
  later: { label: 'Chưa đến hạn', cls: 's-later' },
};
const PAY_METHOD = { transfer: 'Chuyển khoản', cash: 'Tiền mặt' };

const rowAmount = r => Math.round((Number(r.qty) || 0) * (Number(r.price) || 0));
function quoteTotals(q) {
  const sub = (q?.rows || []).reduce((s, r) => s + rowAmount(r), 0);
  const d = q?.discount || {};
  let disc = 0;
  if (d.type === 'percent') disc = Math.round(sub * Math.min(Math.max(Number(d.value) || 0, 0), 100) / 100);
  else disc = Math.min(Math.max(Math.round(Number(d.value) || 0), 0), sub);
  return { sub, disc, total: sub - disc };
}
const isClosed = o => o.status !== 'quote';
const lastVersion = o => (o.versions && o.versions.length ? o.versions[o.versions.length - 1] : null);
const headQuote = o => (isClosed(o) ? lastVersion(o)?.quote : o.draft) || newQuote();
const changeSigned = c => (c.sign < 0 ? -c.amount : c.amount);
const confirmedChanges = o => (o.changes || []).filter(c => c.status === 'confirmed').reduce((s, c) => s + changeSigned(c), 0);
function orderTotal(o) {
  if (!isClosed(o)) return quoteTotals(o.draft).total;
  const v = lastVersion(o);
  return (v ? v.total : 0) + confirmedChanges(o);
}
/* ---------- lịch thanh toán theo đợt ---------- */
const planTemplate = () => { const t = settings().planTemplate; return Array.isArray(t) && t.length ? t : DEFAULT_PLAN; };
const newPlan = (tpl = planTemplate()) => tpl.map(r => ({ id: uid('d'), label: r.label || '', pct: Number(r.pct) || 0, trigger: TRIGGERS[r.trigger] ? r.trigger : 'date' }));
const planPctSum = plan => (plan || []).slice(0, -1).reduce((s, r) => s + (Number(r.pct) || 0), 0);
function planAmounts(plan, total) {
  const rows = plan || []; let used = 0;
  return rows.map((r, i) => {
    const last = i === rows.length - 1;
    let amount;
    if (last) amount = total - used;
    else { amount = Math.round(total * (Number(r.pct) || 0) / 100); used += amount; }
    return { ...r, n: i + 1, last, amount: Math.max(0, amount), raw: amount };
  });
}
/* Tỷ lệ % tính trên giá trị báo giá đã chốt; phát sinh đã xác nhận cộng/trừ vào đợt cuối */
function orderPlanAmounts(o, plan = o.plan) {
  const v = lastVersion(o);
  const rows = planAmounts(plan, v ? v.total : orderTotal(o));
  if (!rows.length) return rows;
  let adj = confirmedChanges(o);
  for (let i = rows.length - 1; i >= 0 && adj !== 0; i--) {
    const nv = rows[i].amount + adj;
    if (nv >= 0 || i === 0) { rows[i].amount = Math.max(0, nv); adj = 0; }
    else { adj = nv; rows[i].amount = 0; }
  }
  return rows;
}
function triggerReached(o, r) {
  if (r.reached) return true;
  if (r.trigger === 'sign') return isClosed(o);
  if (r.trigger === 'progress') return o.status === 'building' || o.status === 'done' || !!o.handover;
  if (r.trigger === 'accept') return o.status === 'done' || !!o.handover;
  return false;
}
function planStatus(o) {
  if (!isClosed(o) || !(o.plan && o.plan.length)) return [];
  const T = today();
  let pool = orderPaid(o);
  return orderPlanAmounts(o).map(r => {
    const paid = Math.min(pool, r.amount); pool -= paid;
    const left = r.amount - paid;
    let state;
    if (left <= 0) state = 'paid';
    else if (r.due && r.due < T) state = 'overdue';
    else if (triggerReached(o, r) || (r.due && r.due <= T)) state = 'due';
    else state = 'later';

}
const nextInstallment = o => planStatus(o).find(r => r.left > 0) || null;
const overdueAmount = o => planStatus(o).filter(r => r.state === 'overdue').reduce((s, r) => s + r.left, 0);

function mergePlan(oldPlan, newPlanRows) {
  return (newPlanRows || []).map(r => { const old = (oldPlan || []).find(x => x.id === r.id); return { ...r, due: old?.due || r.due || '', reached: old?.reached || false }; });
}
function normalizeOrder(o) {
  for (const k of ['payments', 'changes', 'attachments', 'notes', 'log', 'versions']) if (!Array.isArray(o[k])) o[k] = [];
  if (o.payReqs && !Array.isArray(o.payReqs)) o.payReqs = [];
  let n = o.payments.reduce((m, p) => Math.max(m, p.no || 0), 0);
  [...o.payments].sort((a, b) => String(a.createdAt || a.date).localeCompare(String(b.createdAt || b.date))).forEach(p => { if (!p.no) p.no = ++n; if (!p.method) p.method = 'transfer'; });

}
const receiptNo = (o, p) => `PT-${o.code}-${pad2(p.no || 0)}`;
async function sha256Hex(str) {
  try {
    const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('');
  } catch (e) {
    let h = 2166136261; for (const ch of str) { h ^= ch.codePointAt(0); h = Math.imul(h, 16777619); }

  }

async function makeSignRecord(img, name, content) {
  const at = new Date().toISOString();
  const hash = (await sha256Hex(JSON.stringify(content) + '|' + at + '|' + name)).slice(0, 16).toUpperCase();
  return { img, name, at, hash };
}
function addMonths(s, m) { const [y, mo, d] = s.split('-').map(Number); const dt = new Date(y, mo - 1 + m, d); if (dt.getDate() !== d) dt.setDate(0); return dstr(dt); }

const orderPaid = o => (o.payments || []).reduce((s, p) => s + (Number(p.amount) || 0), 0);
const orderDue = o => (isClosed(o) ? Math.max(0, orderTotal(o) - orderPaid(o)) : 0);

/* Các sự kiện làm thay đổi giá trị đơn đã chốt, tính theo ngày */
function valueEvents(o) {
  if (!isClosed(o)) return [];
  const ev = [];
  (o.versions || []).forEach((v, i, arr) => {
    if (i === 0) ev.push({ date: v.closedAt, amount: v.total, kind: 'close', label: 'Chốt đơn' + (arr.length > 1 ? ' (bản 1)' : '') });
    else ev.push({ date: v.closedAt, amount: v.total - arr[i - 1].total, kind: 'revise', label: `Chốt bản ${v.no} (điều chỉnh báo giá)` });
  });
  (o.changes || []).filter(c => c.status === 'confirmed').forEach(c => ev.push({ date: c.confirmedAt, amount: changeSigned(c), kind: 'change', label: 'Phát sinh: ' + c.title }));
  return ev;
}
function newQuote() {
  const st = settings();
  return { date: today(), customer: { name: '', phone: '', address: '' }, project: '', rows: [], discount: { type: 'amount', value: 0 }, note: st.defaultNote || '', terms: st.defaultTerms || '', plan: newPlan() };
}
const newRow = (p = {}) => ({ id: uid('r'), name: '', material: '', unit: 'm²', qty: 0, price: 0, dims: null, ...p });
function nextCode() {
  const st = settings();
  const pre = (st.codePrefix || 'BG').replace(/[^A-Za-z0-9-]/g, '').slice(0, 6) || 'BG';
  const d = new Date();
  const stem = `${pre}${String(d.getFullYear()).slice(2)}${pad2(d.getMonth() + 1)}-`;
  /* làm việc nhóm: máy chủ cấp số chính thức khi lưu, tránh 2 máy cùng ra một số */
  if (Store.mode === 'team') return stem + 'T' + Math.random().toString(36).slice(2, 5).toUpperCase();
  let max = 0;
  for (const o of Store.list('orders')) if (o.code && !o.codeTemp && o.code.startsWith(stem)) max = Math.max(max, parseInt(o.code.slice(stem.length), 10) || 0);
  return stem + pad2(max + 1);
}
const DIM_UNIT = { mm: 0.001, cm: 0.01, m: 1 };
function dimsQty(unit, d) {
  const k = DIM_UNIT[d.u] || 0.001, n = Number(d.n) || 0;
  if (unit === 'm²') return round3((Number(d.a) || 0) * k * (Number(d.b) || 0) * k * n);
  if (unit === 'md') return round3((Number(d.a) || 0) * k * n);
  return round3(n);
}
function dimText(unit, d) {
  if (!d) return '';
  const a = QF.format(Number(d.a) || 0), b = QF.format(Number(d.b) || 0), n = Number(d.n) || 1;
  let s;
  if (unit === 'm²') s = `${a} × ${b} ${d.u}`;
  else if (unit === 'md') s = `dài ${a} ${d.u}`;
  else s = (Number(d.a) || Number(d.b)) ? `${a} × ${b} ${d.u}` : '';

  return s;
}

/* =========================================================
   LƯU TRỮ: claude.ai db (đồng bộ tài khoản) hoặc IndexedDB (máy này)
   ========================================================= */
const COLS = ['orders', 'customers', 'catalog', 'app', 'costs', 'cash'];
const caps = { db: null, assets: null, downloads: null };

function cloudBackend(db) {
  return {
    async loadAll() {
      const out = {};
      for (const c of COLS) {
        const snap = await db.collection(c).get();
        out[c] = snap.docs.filter(d => d.exists).map(d => clone(d.data()));
      }
      return out;
    },
    set: (c, id, doc) => withTimeout(db.collection(c).doc(id).set(doc), 15000),
    del: (c, id) => withTimeout(db.collection(c).doc(id).delete(), 15000),

const withTimeout = (p, ms) => Promise.race([p, sleep(ms).then(() => { throw { code: 'unavailable', message: 'timeout' }; })]);
function idbOpen() {

    r.onupgradeneeded = () => { for (const n of ['docs', 'blobs', 'outbox']) if (!r.result.objectStoreNames.contains(n)) r.result.createObjectStore(n); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
const idbReq = r => new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });

  let idb = null;

  const mem = new Map(), memBlobs = new Map();

    persistent: !!idb,
    async loadAll() {
      const out = Object.fromEntries(COLS.map(c => [c, []]));
      if (!idb) return out;
      const keys = await idbReq(tx('docs', 'readonly').getAllKeys());
      const vals = await idbReq(tx('docs', 'readonly').getAll());
      keys.forEach((k, i) => { const c = String(k).split('/')[0]; if (out[c]) out[c].push(vals[i]); });

async function saveFile(filename, blob) {
  let dl = caps.downloads;
  if (!dl && window.claude && typeof window.claude.use === 'function') { try { dl = caps.downloads = await window.claude.use('downloads'); } catch (e) { dl = null; } }
  if (dl) {
    try { await dl.save({ filename, data: blob }); toast('Đã lưu ' + filename); return true; }
    catch (e) {
      if (e && e.code === 'declined') { toast('Đã hủy lưu file'); return false; }
      if (e && e.code === 'rate_limited') { toast('Đang có một hộp thoại lưu file khác. Hãy thử lại sau giây lát.', 'bad'); return false; }
      toast('Không lưu được file ở chế độ xem này. Hãy mở app trong claude.ai rồi thử lại.', 'bad'); return false;
    }
  }
  if (!inFrame) {
    const type = blob.type || ({ pdf: 'application/pdf', png: 'image/png', json: 'application/json', csv: 'text/csv' })[filename.split('.').pop()] || 'application/octet-stream';
    const file = new File([blob], filename, { type });
    if (navigator.canShare && navigator.share) {
      let can = false; try { can = navigator.canShare({ files: [file] }); } catch (e) { can = false; }
      if (can) {
        const doShare = async () => {
          try { await navigator.share({ files: [file] }); return 'ok'; }
          catch (e) { return e && e.name === 'AbortError' ? 'abort' : (e && e.name === 'NotAllowedError' ? 'gesture' : 'fail'); }
        };
        let r = await doShare();
        if (r === 'gesture') {
          /* iOS chỉ cho mở bảng chia sẻ ngay sau khi chạm: hỏi chạm thêm một lần */
          r = await new Promise(res => {
            let done = false;
            const el = openSheet({
              title: 'File đã sẵn sàng', html: `<p><b>${esc(filename)}</b></p><p class="muted">Chạm “Chia sẻ” rồi chọn Zalo, hoặc “Lưu vào Tệp” / “Lưu hình ảnh”.</p>`,
              foot: `<button class="btn" data-sa="close">Hủy</button><button class="btn primary" data-sa="share">Chia sẻ</button>`,
              onClick: async (a2, b2, el2) => { if (a2 !== 'share') return; done = true; closeSheet(el2); res(await doShare()); },
            });
            const obs = new MutationObserver(() => { if (!document.body.contains(el)) { obs.disconnect(); if (!done) res('abort'); } });
            obs.observe(document.body, { childList: true });

  }

}

const bankName = bin => (BANKS.find(b => b[0] === bin) || [])[1] || '';

function tlv(id, v) { v = String(v); return id + String(v.length).padStart(2, '0') + v; }
function crc16(s) {
  let crc = 0xffff;
  for (let i = 0; i < s.length; i++) {
    crc ^= s.charCodeAt(i) << 8;
    for (let j = 0; j < 8; j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xffff : (crc << 1) & 0xffff;

}
const qrMemo = s => fold(s).toUpperCase().replace(/[^A-Z0-9 ]+/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 25);
function vietQRPayload({ bin, account, amount, memo }) {
  const acct = tlv('00', bin) + tlv('01', account);
  const mai = tlv('00', 'A000000727') + tlv('01', acct) + tlv('02', 'QRIBFTTA');
  let s = tlv('00', '01') + tlv('01', amount ? '12' : '11') + tlv('38', mai) + tlv('53', '704');
  if (amount) s += tlv('54', String(Math.round(amount)));
  s += tlv('58', 'VN');
  if (memo) s += tlv('62', tlv('08', memo));
  s += '6304';
  return s + crc16(s);
}
function bankReady(st = settings()) {
  return /^\d{6}$/.test(st.bankBin || '') && /^[A-Za-z0-9]{4,19}$/.test(String(st.bankAccount || '').replace(/\s/g, ''));
}
function orderMemo(o, n) {
  const st = settings();
  return qrMemo(`${st.memoPrefix || ''} ${String(o.code).replace(/[^A-Za-z0-9]/g, '')}${n ? ' D' + n : ''}`);
}
function orderQR(o, amount, n) {
  const st = settings();
  if (!bankReady(st) || !(amount > 0)) return null;
  const memo = orderMemo(o, n);
  const payload = vietQRPayload({ bin: st.bankBin, account: String(st.bankAccount).replace(/\s/g, ''), amount, memo });
  return { payload, memo, amount, matrix: QR.encode(payload), bank: st.bankName || bankName(st.bankBin), account: st.bankAccount, holder: st.bankHolder };
}

    for (const word of words) {
      const test = line ? line + ' ' + word : word;

async function rasterize(pages, size, footer) {

    c.fillStyle = '#FFFFFF'; c.fillRect(0, 0, W, H);

      if (pages.length > 1) drawOp(c, { t: 'text', x: size.w - PG.MR, y: fy, s: `Trang ${i + 1}/${pages.length}`, w: 400, pt: 7.5, color: PC.muted, align: 'right' });

    get y() { return y; }, set y(v) { y = v; },
    get ops() { return ops; },

function drawOp(c, op) {

  } else if (op.t === 'line') {

    const s = Math.floor(tot / n), off = Math.floor((tot - s * n) / 2);
    c.fillStyle = '#FFFFFF'; c.fillRect(px0, py0, tot, tot); c.fillStyle = '#000000';
    for (let yy = 0; yy < m.size; yy++) for (let xx = 0; xx < m.size; xx++) if (m.get(xx, yy)) c.fillRect(px0 + off + (xx + 4) * s, py0 + off + (yy + 4) * s, s, s);
  }
}
async function renderQuotePages(o, src) {

  /* bản đang dùng (bản chốt mới nhất hoặc bản đang sửa): trừ tiền khách đã trả */
  const cur = src === 'draft' || !o.versions.length || String(src) === String(lastVersion(o).no) || !o.versions.some(v => String(v.no) === String(src));
  const total = quoteTotals(q).total;

    const paid = pays.reduce((sum, x) => sum + (Number(x.amount) || 0), 0), chg = confirmedChanges(o);

/* Ghép các trang thành một ảnh PNG dài (gửi Zalo) */
async function makePng(pages, size = { w: 210, h: 297 }) {
  const imgs = await Promise.all(pages.map(p => new Promise((res, rej) => { const u = URL.createObjectURL(p.blob); const i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => { URL.revokeObjectURL(u); rej(new Error('img')); }; i.src = u; })));
  const gap = imgs.length > 1 ? 24 : 0;
  let w = Math.min(1240, imgs[0].naturalWidth);
  /* trang cuối: bỏ khoảng trắng giữa nội dung và chân trang */
  const lastImg = imgs[imgs.length - 1];
  const fullH = img => Math.round(img.naturalHeight * w / img.naturalWidth);
  const footPx = Math.round(fullH(lastImg) * 17 / size.h);
  let lastKeep = null;
  {
    const h = fullH(lastImg), cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const c = cv.getContext('2d');
    if (c) {
      c.drawImage(lastImg, 0, 0, w, h);
      const scanH = h - footPx, data = c.getImageData(0, 0, w, scanH).data;
      let yEnd = 0;
      for (let y = scanH - 1; y >= 0 && !yEnd; y--) for (let x = 0; x < w; x += 2) { const k = (y * w + x) * 4; if (data[k] < 228 || data[k + 1] < 228 || data[k + 2] < 228) { yEnd = y; break; } }
      const top = Math.min(scanH, yEnd + Math.round(w * 0.05));
      if (top + footPx < h * 0.85) lastKeep = { top, foot: footPx, h };
      cv.width = cv.height = 1;
    }
  }
  const hOf = (img, i) => (i === imgs.length - 1 && lastKeep) ? lastKeep.top + lastKeep.foot : fullH(img);
  let total = imgs.reduce((s, img, i) => s + hOf(img, i), 0) + gap * (imgs.length - 1);
  const MAX = 15e6;
  if (w * total > MAX) {
    const k = Math.sqrt(MAX / (w * total)); w = Math.floor(w * k);
    if (lastKeep) { lastKeep = { top: Math.floor(lastKeep.top * k), foot: Math.floor(lastKeep.foot * k), h: fullH(lastImg) }; }
    total = imgs.reduce((s, img, i) => s + hOf(img, i), 0) + gap * (imgs.length - 1);
  }
  const cv = document.createElement('canvas'); cv.width = w; cv.height = total;
  const c = cv.getContext('2d');
  if (!c) throw new Error('canvas');
  c.fillStyle = '#E7E1D9'; c.fillRect(0, 0, w, total);
  c.imageSmoothingQuality = 'high';
  let y = 0;
  imgs.forEach((img, i) => {
    const h = fullH(img);
    if (i === imgs.length - 1 && lastKeep) {
      const sx = img.naturalWidth / w;
      c.drawImage(img, 0, 0, img.naturalWidth, lastKeep.top * sx, 0, y, w, lastKeep.top);
      c.drawImage(img, 0, (h - lastKeep.foot) * sx, img.naturalWidth, lastKeep.foot * sx, 0, y + lastKeep.top, w, lastKeep.foot);
      y += lastKeep.top + lastKeep.foot;
    } else { c.drawImage(img, 0, y, w, h); y += h + gap; }
  });
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  cv.width = cv.height = 1;
  if (!blob) throw new Error('png');
  return blob;
}
function pdfText(s) {
  let h = 'FEFF';
  for (const ch of String(s)) { const cp = ch.codePointAt(0); if (cp > 0xffff) { h += '003F'; continue; } h += cp.toString(16).toUpperCase().padStart(4, '0'); }
  return '<' + h + '>';
}
function makePdf(pages, title, size = { w: 210, h: 297 }) {
  const enc = new TextEncoder(), chunks = [], offs = [];
  let off = 0;
  const push = x => { const b = typeof x === 'string' ? enc.encode(x) : x; chunks.push(b); off += b.length; };
  const obj = (n, fn) => { offs[n] = off; push(`${n} 0 obj\n`); fn(); push('\nendobj\n'); };
  const W = +(size.w * 72 / 25.4).toFixed(2), H = +(size.h * 72 / 25.4).toFixed(2), n = pages.length;
  push('%PDF-1.4\n%âãÏÓ\n');
  obj(1, () => push('<< /Type /Catalog /Pages 2 0 R >>'));
  obj(2, () => push(`<< /Type /Pages /Kids [${pages.map((_, i) => `${4 + 3 * i} 0 R`).join(' ')}] /Count ${n} >>`));
  const d = new Date();
  const ds = `D:${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}${pad2(d.getHours())}${pad2(d.getMinutes())}${pad2(d.getSeconds())}`;
  obj(3, () => push(`<< /Title ${pdfText(title)} /Producer (So Noi That) /CreationDate (${ds}) >>`));
  pages.forEach((p, i) => {
    obj(4 + 3 * i, () => push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im${i} ${6 + 3 * i} 0 R >> >> /Contents ${5 + 3 * i} 0 R >>`));
    const cs = `q ${W} 0 0 ${H} 0 0 cm /Im${i} Do Q`;
    obj(5 + 3 * i, () => push(`<< /Length ${cs.length} >>\nstream\n${cs}\nendstream`));
    obj(6 + 3 * i, () => { push(`<< /Type /XObject /Subtype /Image /Width ${p.w} /Height ${p.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${p.bytes.length} >>\nstream\n`); push(p.bytes); push('\nendstream'); });
  });
  const last = 3 + 3 * n, xref = off;
  push(`xref\n0 ${last + 1}\n0000000000 65535 f \n`);
  for (let k = 1; k <= last; k++) push(String(offs[k]).padStart(10, '0') + ' 00000 n \n');
  push(`trailer\n<< /Size ${last + 1} /Root 1 0 R /Info 3 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
  return new Blob(chunks, { type: 'application/pdf' });
}

function toast(msg, kind = '') {
  let box = $('.toasts');
  if (!box) { box = document.createElement('div'); box.className = 'toasts'; document.body.appendChild(box); }
  box.classList.toggle('wide', isWide());
  const t = document.createElement('div'); t.className = 'toast ' + kind; t.textContent = msg; t.setAttribute('role', 'status');
  box.appendChild(t);
  while (box.children.length > 2) box.firstElementChild.remove();
  setTimeout(() => t.remove(), kind === 'bad' ? 5200 : 2600);
}

const sheets = [];
function openSheet({ title, html, foot = '', cls = '', onMount, onClick }) {
  const el = document.createElement('div');
  el.className = 'sheet-wrap';
  el.innerHTML = `<div class="sheet-bg" data-sa="close"></div><div class="sheet ${cls}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><header class="sheet-h"><h3>${esc(title)}</h3><button class="iconbtn" data-sa="close" aria-label="Đóng">${ic('x')}</button></header><div class="sheet-b">${html}</div>${foot ? `<footer class="sheet-f">${foot}</footer>` : ''}</div>`;
  document.body.appendChild(el);
  const entry = { el };
  sheets.push(entry);
  el.addEventListener('click', e => {
    const b = e.target.closest('[data-sa]');
    if (!b || !el.contains(b)) return;
    if (b.dataset.sa === 'close') { closeSheet(el); return; }
    onClick && onClick(b.dataset.sa, b, el, e);
  });
  onMount && onMount(el);
  requestAnimationFrame(() => el.classList.add('in'));
  return el;
}
function closeSheet(el) {
  const i = el ? sheets.findIndex(s => s.el === el) : sheets.length - 1;
  if (i < 0) return;
  const [s] = sheets.splice(i, 1);
  s.el.remove();
}
function confirmBox({ title, text, ok = 'Đồng ý', danger = false }) {
  return new Promise(res => {
    let done = false;
    const el = openSheet({
      title, html: `<p>${text}</p>`,
      foot: `<button class="btn" data-sa="no">Hủy</button><button class="btn ${danger ? 'danger solid' : 'primary'}" data-sa="yes">${esc(ok)}</button>`,
      onClick: (a) => { done = true; closeSheet(el); res(a === 'yes'); },
    });
    const obs = new MutationObserver(() => { if (!document.body.contains(el)) { obs.disconnect(); if (!done) res(false); } });
    obs.observe(document.body, { childList: true });
  });
}

function validateQuote(q) {

  if (rows.some(r => !r.name.trim())) errs.push('Có dòng có tiền nhưng chưa có tên hạng mục.');
  if (rows.some(r => r.name.trim() && !rowAmount(r))) errs.push('Có hạng mục chưa có khối lượng hoặc đơn giá (thành tiền bằng 0).');
  if (quoteTotals(q).total <= 0) errs.push('Tổng tiền phải lớn hơn 0.');

}

function upsertCustomer(c) {
