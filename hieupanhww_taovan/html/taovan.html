<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Tạo Ván</title>
<style>
  body{font:13px system-ui,Arial,sans-serif;margin:0;padding:12px;background:#f5f5f5;color:#222}
  .grp{background:#fff;border:1px solid #ddd;border-radius:6px;padding:8px 10px;margin-bottom:6px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:4px 0;gap:8px}
  .row.hide{display:none}
  .hint{margin:0 0 10px;color:#777;font-size:11.5px;line-height:1.4}
  input[type=number],input[type=text]{width:120px;padding:3px 5px;border:1px solid #bbb;border-radius:4px}
  input.err{border-color:#d33;background:#fff0f0}
  input:disabled{background:#eee;color:#999}
</style>
</head>
<body>
<div id="app"></div>
<script>
var S = {};
var FIELDS = [
  {sw:'do_day_tu_dong', label:'Độ dày tự động', hint:'Ván mới có độ dày bằng độ dày ván gốc (group/component chứa mặt được chọn).',
   sub:[{k:'do_day', label:'Độ dày ván (mm)', type:'number', showIf:function(){return !S.do_day_tu_dong}}]},
  {sw:'dao_huong', label:'Đảo hướng', hint:'Đảo chiều đùn của ván. Khi tạo bằng chuột có thể bấm Tab để đảo nhanh.'},
  {sw:'tao_component', label:'Tạo component', hint:'Ván tạo ra sẽ là component thay vì group.'},
  {sw:'ten_tu_dong', label:'Tên tự động', hint:"Không nên đặt tên instance/layer bắt đầu bằng 'ABF_' để tránh lỗi khi dán cạnh bằng ABF.",
   sub:[{k:'instance', label:'Instance', type:'text', disabledIf:function(){return S.ten_tu_dong}},
        {k:'layer', label:'Layer', type:'text', disabledIf:function(){return S.ten_tu_dong}}]},
  {sw:'tao_van_nhanh', label:'Tạo ván nhanh', hint:'Tạo ván từ những mặt đang chọn ngay khi kích hoạt công cụ.',
   sub:[{sw:'gop_dong_phang', label:'Gộp đồng phẳng'},
        {k:'do_day_nhanh', label:'Độ dày ván (mm)', type:'number'}],
   subShowIf:function(){return S.tao_van_nhanh}}
];
function save(k,v){ S[k]=v; window.sketchup.save(k,v); render(); }
function render(){
  var app=document.getElementById('app'); app.innerHTML='';
  FIELDS.forEach(function(f){
    var g=document.createElement('div'); g.className='grp';
    g.appendChild(row(f.sw,f.label));
    (f.sub||[]).forEach(function(s){
      if(f.subShowIf && !f.subShowIf()) return;
      if(s.showIf && !s.showIf()) return;
      g.appendChild(s.sw ? row(s.sw,s.label) : field(s));
    });
    app.appendChild(g);
    var p=document.createElement('p'); p.className='hint'; p.textContent=f.hint; app.appendChild(p);
  });
}
function row(k,label){
  var r=document.createElement('div'); r.className='row';
  r.innerHTML='<span>'+label+'</span>';
  var c=document.createElement('input'); c.type='checkbox'; c.checked=!!S[k];
  c.onchange=function(){save(k,c.checked)}; r.appendChild(c); return r;
}
function field(s){
  var r=document.createElement('div'); r.className='row';
  r.innerHTML='<span>'+s.label+'</span>';
  var i=document.createElement('input'); i.type=s.type; if(s.type==='number') i.step='0.1';
  i.value=S[s.k]; i.disabled=!!(s.disabledIf&&s.disabledIf());
  if(s.type==='text' && /^ABF_/.test(S[s.k]||'')) i.className='err';
  i.onchange=function(){
    var v = s.type==='number' ? parseFloat(i.value) : i.value;
    if(s.type==='number' && !(v>0)) { i.value=S[s.k]; return; }
    save(s.k,v);
  };
  r.appendChild(i); return r;
}
window.applySettings=function(o){S=o;render()};
window.onload=function(){window.sketchup.load()};
</script>
</body>
</html>
