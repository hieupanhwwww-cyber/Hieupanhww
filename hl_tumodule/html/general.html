<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cài đặt chung</title>
<link rel="stylesheet" href="common.css">
<style>
  body { padding: 10px; padding-bottom: 76px; }
  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-size: 11px; color: var(--muted); text-transform: uppercase; padding: 2px 6px 6px 0; }
  td { padding: 3px 6px 3px 0; vertical-align: top; }
  td.nm { width: 34%; padding-top: 8px; }
  td .err { color: var(--bad); font-size: 11px; }
  input.bad { border-color: var(--bad); background: #fff6f5; }
  .note { font-size: 12px; color: var(--muted); margin: 6px 0 0; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
  footer { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 8px 10px; }
  footer label { font-size: 12px; display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  footer label input { width: auto; }
  code { background: var(--milk); padding: 0 4px; border-radius: 3px; }
</style>
</head>
<body>
<div class="section">
  <h3>Tên layer và instance gia công</h3>
  <table>
    <thead><tr><th>Thao tác</th><th>Layer (tag)</th><th>Instance (tên nhóm)</th></tr></thead>
    <tbody id="ops"></tbody>
  </table>
  <p class="note">Trong tên dùng được <code>{D}</code> = đường kính lỗ và <code>{Z}</code> = độ sâu (mm). Ví dụ <code>ABF_D{D}</code> → <code>ABF_D15</code>.
    Đặt tên trùng với tên đã khai báo trong ABF của xưởng để ABF nhận đúng.</p>
</div>
<div class="section">
  <h3>Thông số cam Minifix + chốt (mm)</h3>
  <div class="grid" id="cam"></div>
  <p class="note" id="camnote"></p>
</div>
<footer>
  <label><input type="checkbox" id="regen" checked> Cập nhật luôn mọi tủ đang có trong model theo cài đặt mới</label>
  <div class="row-btn">
    <span id="dirty" style="margin-right:auto;color:var(--warn);font-size:12px"></span>
    <button class="ghost" id="defaults" title="Nạp tên mặc định vào bảng; chỉ áp dụng khi bấm Lưu">Tên mặc định</button>
    <button id="save">Lưu cài đặt</button>
  </div>
</footer>
<script src="common.js"></script>
<script>
let cur = null, errors = {};
const $ = (s) => document.querySelector(s);
const cell = (op, fld, val) => {
  const e = errors[op + '.' + fld];
  return `<td><input data-op="${HL.esc(op)}" data-fld="${fld}" value="${HL.esc(val)}" class="${e ? 'bad' : ''}">${e ? `<div class="err">${HL.esc(e)}</div>` : ''}</td>`;
};
function render(ops, cam) {
  $('#ops').innerHTML = ops.map(o => `<tr><td class="nm" title="Mặc định: ${HL.esc(o.def_layer)} / ${HL.esc(o.def_instance)}">${HL.esc(o.title)}</td>${cell(o.key, 'layer', o.layer)}${cell(o.key, 'instance', o.instance)}</tr>`).join('');
  $('#cam').innerHTML = cam.map(c => HL.fieldHtml({ key: 'cam_' + c.key, label: c.label, type: 'mm', value: c.value }, undefined, errors['cam.' + c.key])).join('');
  $('#camnote').textContent = cur.cam_demo ? 'Đang dùng bộ số DEMO — sửa theo phụ kiện của xưởng rồi Lưu.' : 'Bộ đang dùng: ' + cur.cam_name;
}
function collect() {
  const ops = {}, cam = {};
  document.querySelectorAll('#ops input').forEach(i => { (ops[i.dataset.op] = ops[i.dataset.op] || {})[i.dataset.fld] = i.value; });
  document.querySelectorAll('#cam input').forEach(i => { cam[i.dataset.key.replace('cam_', '')] = i.value; });
  return { ops, cam };
}
function load(r) {
  if (!r) return;
  if (r.ok === false) { errors = r.errors || {}; if (cur) { const c = collect(); render(cur.ops.map(o => Object.assign({}, o, c.ops[o.key])), cur.cam.map(x => Object.assign({}, x, { value: c.cam[x.key] }))); } return HL.toast(r.error, true); }
  errors = {}; cur = r; render(r.ops, r.cam);
  $('#dirty').textContent = r.dirty ? 'Có thay đổi chưa lưu.' : '';
  if (r.message) HL.toast(r.message);
}
document.body.addEventListener('input', (e) => { if (e.target.matches('#ops input, #cam input')) $('#dirty').textContent = 'Có thay đổi chưa lưu.'; });
$('#save').onclick = async () => { const c = collect(); load(await HL.req('save', { ops: c.ops, cam: c.cam, regen: $('#regen').checked })); };
$('#defaults').onclick = async () => load(await HL.req('defaults'));
HL.req('init').then(load);
</script>
</body>
</html>
