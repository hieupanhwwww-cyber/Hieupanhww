name: So Noi That - kiem thu nhieu nguoi dung
on:
  push:
    branches: [snt-ci]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - name: Cai thu vien
        working-directory: firebase
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Chay may chu app
        run: (cd pwa && python3 -m http.server 5050 --bind 127.0.0.1 > /tmp/http.log 2>&1 &) && sleep 1
      - name: Kiem thu luat bao mat + dau-cuoi
        working-directory: firebase
        run: |
          mkdir -p ../out
          set +e
          npx firebase emulators:exec --only auth,firestore --project demo-snt "node test/rules.test.js > ../out/rules.log 2>&1; echo \$? > ../out/rules.code; OUT_DIR=../out/shots node test/e2e.js > ../out/e2e.log 2>&1; echo \$? > ../out/e2e.code" > ../out/emulator.log 2>&1
          echo "emu=$?" >> ../out/emulator.log
          tail -5 ../out/rules.log ../out/e2e.log
          true
      - name: Day ket qua len nhanh ci-results
        if: always()
        run: |
          cd out
          echo "${GITHUB_SHA}" > sha.txt
          git init -q && git checkout -q -b ci-results
          git config user.name "snt-ci" && git config user.email "snt-ci@users.noreply.github.com"
          git add -A && git commit -qm "ket qua ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci-results
      - name: Bao loi neu co bai sai
        run: test "$(cat out/rules.code)" = "0" && test "$(cat out/e2e.code)" = "0"
